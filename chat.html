  }
  function passTurn() {
    if (st.phase !== 'playing' || st.turn !== st.myIndex) return;
    if (!st.lastPlay) return;
    st.passCount++;
    st.selected = {};
    if (st.online) GameHub.netBroadcast({ game: 'doudizhu', action: 'pass', session: st.session, idx: st.myIndex });
    st.turn = (st.myIndex + 1) % 3;
    if (st.passCount >= 2) { st.lastPlay = null; st.passCount = 0; }
    render(); scheduleAI();
  }
  function aiFindBeat(hand, lastType) {
    var cnt = {};
    hand.forEach(function (v) { cnt[v] = (cnt[v] || 0) + 1; });
    var vals = Object.keys(cnt).map(Number).sort(function (a, b) { return a - b; });

    if (!lastType) return [vals[0]];
    if (lastType.t === 'single') {
      for (var i = 0; i < vals.length; i++) if (vals[i] > lastType.v) return [vals[i]];
    }
    if (lastType.t === 'pair') {
      for (var i = 0; i < vals.length; i++) if (vals[i] > lastType.v && cnt[vals[i]] >= 2) return [vals[i], vals[i]];
    }
    if (lastType.t === 'triple') {
      for (var i = 0; i < vals.length; i++) if (vals[i] > lastType.v && cnt[vals[i]] >= 3) return [vals[i], vals[i], vals[i]];
    }
    if (lastType.t === 'triple1') {
      for (var i = 0; i < vals.length; i++) {
        if (vals[i] > lastType.v && cnt[vals[i]] >= 3) {
          var k = vals.find(function (x) { return x !== vals[i] && cnt[x] >= 1; });
          if (k !== undefined) return [vals[i], vals[i], vals[i], k];
        }
      }
    }
    if (lastType.t === 'triple2') {
      for (var i = 0; i < vals.length; i++) {
        if (vals[i] > lastType.v && cnt[vals[i]] >= 3) {
          var k2 = vals.find(function (x) { return x !== vals[i] && cnt[x] >= 2; });
          if (k2 !== undefined) return [vals[i], vals[i], vals[i], k2, k2];
        }
      }
    }
    if (lastType.t === 'straight') {
      for (var s = 0; s < vals.length; s++) {
        var start = vals[s];
        if (start <= lastType.v || start > 14) continue;
        var seq = [start];
        for (var k3 = 1; k3 < lastType.len; k3++) {
          if (cnt[start + k3]) seq.push(start + k3); else break;
        }
        if (seq.length === lastType.len) return seq;
      }
    }
    if (lastType.t === 'pairs') {
      var need = lastType.len / 2;
      for (var s2 = 0; s2 < vals.length; s2++) {
        var st2 = vals[s2];
        if (st2 <= lastType.v || st2 > 14) continue;
        var seq2 = [];
        for (var k4 = 0; k4 < need; k4++) {
          if (cnt[st2 + k4] >= 2) seq2.push(st2 + k4, st2 + k4); else break;
        }
        if (seq2.length === lastType.len) return seq2;
      }
    }
    for (var i2 = 0; i2 < vals.length; i2++) if (cnt[vals[i2]] === 4) return [vals[i2], vals[i2], vals[i2], vals[i2]];
    if (cnt[16] && cnt[17]) return [16, 17];
    return null;
  }
  function aiPlay() {
    if (st.phase !== 'playing') return;
    if (!st.players[st.turn] || !st.players[st.turn].isAI) return;
    var idx = st.turn;
    var hand = st.hands[idx] || [];
    if (!hand.length) return;
    var hint = aiFindBeat(hand, st.lastPlay ? st.lastPlay.type : null);
    if (!hint) {
      if (st.lastPlay) {
        st.passCount++;
        st.turn = (idx + 1) % 3;
        if (st.passCount >= 2) { st.lastPlay = null; st.passCount = 0; }
        render();
        scheduleAI();
        return;
      }
      hint = [hand[0]];
    }
    var pt = parseType(hint);
    if (!pt) { hint = [hand[0]]; pt = parseType(hint); }
    doPlay(idx, hint, pt, false);
  }
  function startAI() {
    var seats = [
      { id: myPeerId, name: myName, avatar: myAvatar.dataUrl, isAI: false },
      { id: 'ai1', name: 'AI·甲', avatar: '', isAI: true },
      { id: 'ai2', name: 'AI·乙', avatar: '', isAI: true }
    ];
    dealLocal(seats);
    st.online = false; st.session = GameHub.newSession();
    render();
    if (st.players[st.bidIndex].isAI) scheduleAI();
    sfx('click');
  }
  function startOnline(ids) {
    var seats = [{ id: myPeerId, name: myName, avatar: myAvatar.dataUrl, isAI: false }];
    ids.forEach(function (pid) {
      seats.push({ id: pid, name: members[pid] ? members[pid].name : '玩家', avatar: members[pid] ? members[pid].avatar : '', isAI: false });
    });
    st.online = true;
    st.session = GameHub.newSession();
    dealLocal(seats);

    for (var i = 1; i < 3; i++) {
      GameHub.netSendTo(seats[i].id, {
        game: 'doudizhu', action: 'deal', session: st.session, idx: i,
        hand: st.hands[i], seats: seats.map(function (s) { return { id: s.id, name: s.name, avatar: s.avatar }; })
      });
    }
    GameHub.netBroadcast({ game: 'doudizhu', action: 'start', session: st.session, seats: seats.map(function (s) { return { id: s.id, name: s.name, avatar: s.avatar }; }), counts: [17, 17, 17], bidIdx: 0 });
    render();
  }
  function inviteOnline() {
    showInvitePicker('ddzPick', 2, function (ids) {
      st.session = GameHub.newSession();
      pendingSession = st.session;
      pendingNeed = ids.length;
      pendingIds = ids.slice();
      pendingAccepts = [];
      ids.forEach(function (pid) {
        GameHub.netBroadcast({ game: 'doudizhu', action: 'invite', session: st.session, target: pid });
      });
      showToast('已邀请 ' + ids.length + ' 位好友');
    });
  }
  function startNew() {
    if (st.online) { showToast('请重新邀请好友开始'); return; }
    startAI();
  }
  function abort() {
    st.active = false; st.phase = 'idle'; st.online = false;
    pendingSession = null; pendingAccepts = [];
    document.getElementById('ddzMenu').style.display = 'flex';
    document.getElementById('ddzPlay').style.display = 'none';
    document.getElementById('ddzPick').style.display = 'none';
  }
  function handle(msg) {
    if (msg.game !== 'doudizhu') return;
    switch (msg.action) {
      case 'invite':
        if (msg.target !== myPeerId) return;
        showInviteDialog('斗地主', msg.name, function () {
          GameHub.netBroadcast({ game: 'doudizhu', action: 'accept', session: msg.session, target: msg.senderId });
          openPanel('game');
          document.querySelector('.game-pick[data-game="doudizhu"]').click();
          showToast('已接受邀请，等待开局…');
        }, function () {
          GameHub.netBroadcast({ game: 'doudizhu', action: 'decline', session: msg.session, target: msg.senderId });
        });
        break;
      case 'accept':
        if (msg.target !== myPeerId) return;
        if (pendingSession && msg.session === pendingSession) {
          pendingAccepts.push(msg.senderId);
          if (pendingAccepts.length >= pendingNeed) {
            startOnline(pendingIds);
            pendingSession = null;
            pendingAccepts = [];
          }
        }
        break;
      case 'decline':
        if (msg.target !== myPeerId) return;
        showToast('有玩家拒绝了邀请');
        pendingSession = null; pendingAccepts = [];
        break;
      case 'deal':
        if (msg.target && msg.target !== myPeerId) return;
        if (!msg.seats) return;
        st.online = true; st.session = msg.session; st.active = true;
        st.players = msg.seats.map(function (s) { return { id: s.id, name: s.name, avatar: s.avatar, isAI: false }; });
        st.myIndex = st.players.findIndex(function (p) { return p.id === myPeerId; });
        if (st.myIndex < 0) st.myIndex = 0;
        st.hands = [[], [], []];
        st.hands[msg.idx] = (msg.hand || []).slice().sort(function (a, b) { return a - b; });
        st.counts = [17, 17, 17];
        st.landlord = -1; st.turn = 0; st.lastPlay = null; st.passCount = 0;
        st.phase = 'bidding'; st.bidIndex = 0; st.bidCount = 0; st.selected = {};
        document.getElementById('ddzMenu').style.display = 'none';
        document.getElementById('ddzPlay').style.display = 'flex';
        document.getElementById('ddzPick').style.display = 'none';
        render();
        break;
      case 'start':
        if (!st.active) return;
        st.counts = msg.counts || [17,17,17];
        st.bidIndex = msg.bidIdx || 0;
        render();
        break;
      case 'bid_pass':
        if (!st.active) return;
        st.bidIndex = (st.bidIndex + 1) % 3;
        st.bidCount++;
        render();
        break;
      case 'landlord':
        if (!st.active) return;
        st.landlord = msg.idx;
        st.bottom = msg.bottom || [];
        st.hands[st.landlord] = (st.hands[st.landlord] || []).concat(st.bottom);
        st.hands[st.landlord].sort(function (a, b) { return a - b; });
        st.counts[st.landlord] = 20;
        st.phase = 'playing'; st.turn = st.landlord; st.lastPlay = null; st.passCount = 0;
        render();
        break;
      case 'redeal':
        showToast('重新发牌');
        break;
      case 'play':
        if (!st.active) return;
        var idx = msg.idx;
        var rest = (st.hands[idx] || []).slice();
        if (idx !== st.myIndex) {
          st.counts[idx] = st.counts[idx] - msg.cards.length;
        } else {
          msg.cards.forEach(function (v) {
            var i = rest.indexOf(v);
            if (i >= 0) rest.splice(i, 1);
          });
          st.hands[idx] = rest;
          st.counts[idx] = rest.length;
        }
        st.lastPlay = { pid: st.players[idx].id, cards: msg.cards, type: parseType(msg.cards) };
        st.passCount = 0;
        st.turn = (idx + 1) % 3;
        render();
        break;
      case 'pass':
        if (!st.active) return;
        st.passCount++;
        st.turn = (msg.idx + 1) % 3;
        if (st.passCount >= 2) { st.lastPlay = null; st.passCount = 0; }
        render();
        break;
      case 'over':
        st.phase = 'ended';
        var iWon = (msg.winnerIdx === st.myIndex) === (st.myIndex === st.landlord);
        var c = document.getElementById('ddzCenter');
        if (c) c.innerHTML = '<span style="font-size:14px;font-weight:700;color:' + (iWon ? 'var(--green)' : 'var(--danger)') + ';">' +
          (iWon ? '🎉 你赢了！' : '😢 你输了') + '</span>';
        render();
        break;
    }
  }
  function onPeerLeave(pid) {
    if (!st.active || !st.online) return;
    var idx = st.players.findIndex(function (p) { return p.id === pid; });
    if (idx >= 0) {
      st.phase = 'ended';
      showToast('有玩家离开，对局结束');
      render();
    }
  }
  document.getElementById('ddzMenu').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-ddz]');
    if (!btn) return;
    if (btn.dataset.ddz === 'ai') startAI();
    else inviteOnline();
  });
  return { handle: handle, onPeerLeave: onPeerLeave, abort: abort };
})();

/* ============================================================
   27. 麻将（简化版）
   ============================================================ */
var Mj = (function () {
  var SUITS = ['万', '条', '筒'];
  var st = {
    active: false, online: false, session: null,
    players: [], myIndex: 0, myHand: [],
    counts: [13, 13, 13, 13],
    discards: [], turn: 0, phase: 'playing', ended: false,
    selected: -1, wall: []
  };
  function tileLabel(t) {
    var s = Math.floor(t / 9), n = (t % 9) + 1;
    return n + SUITS[s];
  }
  function tileEl(t, sel, small) {
    var d = document.createElement('div');
    d.className = 'mj-tile' + (sel ? ' sel' : '');
    d.textContent = tileLabel(t);
    d.dataset.t = t;
    if (small) d.style.transform = 'scale(.85)';
    return d;
  }
  function makeWall() {
    var w = [];
    for (var t = 0; t < 27; t++) for (var k = 0; k < 4; k++) w.push(t);
    return shuffle(w);
  }
  function canHu(counts) {
    for (var i = 0; i < 27; i++) {
      if (counts[i] >= 2) {
        counts[i] -= 2;
        var ok = allSets(counts);
        counts[i] += 2;
        if (ok) return true;
      }
    }
    return false;
  }
  function allSets(counts) {
    var i = 0;
    while (i < 27 && counts[i] === 0) i++;
    if (i === 27) return true;
    if (counts[i] >= 3) {
      counts[i] -= 3;
      var ok = allSets(counts);
      counts[i] += 3;
      if (ok) return true;
    }
    var pos = i % 9;
    if (pos <= 6 && counts[i + 1] > 0 && counts[i + 2] > 0) {
      counts[i]--; counts[i + 1]--; counts[i + 2]--;
      var ok2 = allSets(counts);
      counts[i]++; counts[i + 1]++; counts[i + 2]++;
      if (ok2) return true;
    }
    return false;
  }
  function handCounts(hand) {
    var c = new Array(27).fill(0);
    hand.forEach(function (t) { c[t] = (c[t] || 0) + 1; });
    return c;
  }
  function render() {
    if (!st.active) return;
    document.getElementById('mjMenu').style.display = 'none';
    document.getElementById('mjPlay').style.display = 'flex';
    document.getElementById('mjPick').style.display = 'none';

    var others = document.getElementById('mjOthers');
    others.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var seat = (st.myIndex + 1 + i) % 4;
      var p = st.players[seat];
      var el = document.createElement('div');
      el.className = 'mj-opp' + (st.turn === seat && st.phase === 'playing' ? ' turn' : '');
      var nm = document.createElement('span'); nm.className = 'o-name';
      nm.textContent = p ? p.name : '?';
      var ct = document.createElement('span'); ct.className = 'o-cnt';
      ct.textContent = st.counts[seat] + '张';
      el.appendChild(nm); el.appendChild(ct);
      others.appendChild(el);
    }

    var center = document.getElementById('mjCenter');
    center.innerHTML = '';
    st.discards.slice(-40).forEach(function (d) {
      center.appendChild(tileEl(d.t, false, true));
    });
    if (!st.discards.length) {
      center.innerHTML = '<span style="font-size:12px;color:var(--muted);">牌局进行中…</span>';
    }

    var hand = document.getElementById('mjHand');
    hand.innerHTML = '';
    var sorted = st.myHand.slice().sort(function (a, b) { return a - b; });
    sorted.forEach(function (t, i) {
      var el = tileEl(t, st.selected === i, false);
      el.onclick = function () {
        if (st.phase !== 'playing' || st.turn !== st.myIndex) return;
        st.selected = (st.selected === i) ? -1 : i;
        render();
        sfx('click');
      };
      hand.appendChild(el);
    });

    renderActions();
  }
  function renderActions() {
    var a = document.getElementById('mjActions');
    if (!a) return;
    a.innerHTML = '';
    if (st.phase === 'ended') {
      var r = document.createElement('button');
      r.className = 'neo-btn small accent'; r.textContent = '再来一局';
      r.onclick = function () { startNew(); };
      var q = document.createElement('button');
      q.className = 'neo-btn small'; q.textContent = '退出';
      q.onclick = function () { abort(); };
      a.appendChild(r); a.appendChild(q);
      return;
    }
    if (st.turn !== st.myIndex) {
      a.innerHTML = '<span style="font-size:12px;color:var(--muted);">等待 ' +
        esc(st.players[st.turn] ? st.players[st.turn].name : '对手') + ' 出牌…</span>';
      return;
    }
    var hc = handCounts(st.myHand);
    var hu = canHu(hc.slice());
    if (hu) {
      var hb = document.createElement('button');
      hb.className = 'neo-btn small green'; hb.textContent = '🀄 胡牌';
      hb.onclick = function () { huWin(); };
      a.appendChild(hb);
    }
    var db = document.createElement('button');
    db.className = 'neo-btn small accent'; db.textContent = '打出';
    db.disabled = st.selected < 0;
    db.onclick = function () { discard(); };
    a.appendChild(db);
  }
  function discard() {
    if (st.turn !== st.myIndex || st.selected < 0) return;
    var sortedHand = st.myHand.slice().sort(function (a, b) { return a - b; });
    var tile = sortedHand[st.selected];
    var i = st.myHand.indexOf(tile);
    if (i >= 0) st.myHand.splice(i, 1);
    st.selected = -1;
    st.discards.push({ pid: myPeerId, t: tile });
    st.counts[st.myIndex] = st.myHand.length;
    sfx('card');
    if (st.online) {
      GameHub.netBroadcast({ game: 'mahjong', action: 'discard', session: st.session, idx: st.myIndex, tile: tile });
    }
    nextTurn();
  }
  function nextTurn() {
    st.turn = (st.turn + 1) % 4;
    render();
    if (st.online) return;
    setTimeout(autoTurn, 600);
  }
  function autoTurn() {
    if (!st.active || st.phase !== 'playing') return;
    var idx = st.turn;
    if (idx === st.myIndex) {
      drawForMe();
    } else if (st.players[idx] && st.players[idx].isAI) {
      drawForAI(idx);
    }
  }
  function drawForMe() {
    if (!st.wall.length) { endDraw(); return; }
    var t = st.wall.pop();
    st.myHand.push(t);
    st.wallLeft = st.wall.length;
    render();
  }
  function drawForAI(idx) {
    if (!st.wall.length) { endDraw(); return; }
    var t = st.wall.pop();
    st.counts[idx]++;
    var tile = st.players[idx].hand[Math.floor(Math.random() * st.players[idx].hand.length)];
    var i = st.players[idx].hand.indexOf(tile);
    st.players[idx].hand.splice(i, 1);
    st.discards.push({ pid: st.players[idx].id, t: tile });
    st.counts[idx] = st.players[idx].hand.length;
    sfx('card');
    render();
    setTimeout(function () {
      st.turn = (st.turn + 1) % 4;
      render();
      autoTurn();
    }, 500);
  }
  function huWin() {
    st.phase = 'ended'; st.ended = true;
    var c = document.getElementById('mjCenter');
    if (c) c.innerHTML = '<span style="font-size:15px;font-weight:700;color:var(--green);">🀄 恭喜胡牌！</span>';
    sfx('win');
    if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 80, origin: { y: .6 } });
    if (st.online) GameHub.netBroadcast({ game: 'mahjong', action: 'hu', session: st.session, idx: st.myIndex });
    renderActions();
  }
  function endDraw() {
    st.phase = 'ended';
    var c = document.getElementById('mjCenter');
    if (c) c.innerHTML = '<span style="font-size:14px;font-weight:700;color:var(--muted);">🤝 流局</span>';
    renderActions();
  }
  function startAI() {
    st.active = true; st.online = false; st.session = GameHub.newSession();
    st.players = [
      { id: myPeerId, name: myName, avatar: myAvatar.dataUrl, isAI: false, hand: [] },
      { id: 'ai1', name: 'AI·东', avatar: '', isAI: true, hand: [] },
      { id: 'ai2', name: 'AI·南', avatar: '', isAI: true, hand: [] },
      { id: 'ai3', name: 'AI·西', avatar: '', isAI: true, hand: [] }
    ];
    st.wall = makeWall();
    st.myHand = [];
    for (var i = 0; i < 4; i++) {
      if (i === 0) { for (var k = 0; k < 13; k++) st.myHand.push(st.wall.pop()); }
      else { for (var k2 = 0; k2 < 13; k2++) st.players[i].hand.push(st.wall.pop()); }
    }
    st.myHand.sort(function (a, b) { return a - b; });
    st.counts = [13, 13, 13, 13];
    st.discards = [];
    st.turn = 0; st.phase = 'playing'; st.ended = false; st.selected = -1;
    st.myIndex = 0;
    document.getElementById('mjMenu').style.display = 'none';
    document.getElementById('mjPlay').style.display = 'flex';
    document.getElementById('mjPick').style.display = 'none';
    render();
    drawForMe();
    sfx('click');
  }
  function startOnline(ids) {
    showToast('联机麻将简化处理中，稍后完善');
    startAI();
  }
  function inviteOnline() {
    showInvitePicker('mjPick', 3, function (ids) {
      startOnline(ids);
    });
  }
  function startNew() { startAI(); }
  function abort() {
    st.active = false; st.phase = 'idle'; st.online = false; st.ended = false;
    document.getElementById('mjMenu').style.display = 'flex';
    document.getElementById('mjPlay').style.display = 'none';
    document.getElementById('mjPick').style.display = 'none';
  }
  function handle(msg) {
    if (msg.game !== 'mahjong') return;
    if (msg.action === 'hu') {
      if (msg.idx !== st.myIndex) {
        st.phase = 'ended';
        var c = document.getElementById('mjCenter');
        if (c) c.innerHTML = '<span style="font-size:14px;font-weight:700;color:var(--danger);">对方胡牌，本局结束</span>';
        renderActions();
      }
    }
  }
  function onPeerLeave(pid) {}
  document.getElementById('mjMenu').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-mj]');
    if (!btn) return;
    if (btn.dataset.mj === 'ai') startAI();
    else inviteOnline();
  });
  return { handle: handle, onPeerLeave: onPeerLeave, abort: abort };
})();

document.getElementById('backBtn').addEventListener('click', function () {

    setTimeout(function () {
      if (document.referrer && document.referrer.indexOf('shell.html') >= 0) history.back();

function cleanupConnection() {
  if (hostAnnounceTimer) { clearInterval(hostAnnounceTimer); hostAnnounceTimer = null; }
  if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
  try { if (peer) peer.destroy(); } catch (e) {}
  try { if (mqttClient) mqttClient.end(true); } catch (e) {}
  peer = null; mqttClient = null; myPeerId = null;
  hostConnection = null; hostPeerId = null;
  connectingToHost = false; currentPendingConn = null; webrtcOk = false; memberJoined = false;
  Object.keys(connections).forEach(function (k) { delete connections[k]; });
  Object.keys(members).forEach(function (k) { delete members[k]; });
}
