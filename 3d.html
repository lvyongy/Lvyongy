const qiBlasts = [];

function fireSwordQi(charge) {
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const start = camera.position.clone().addScaledVector(dir, 1.2).addScaledVector(right, 0.12);

    const g = new THREE.Group();
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff0b0, transparent: true, opacity: 0.95, depthWrite: false });
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffb030, transparent: true, opacity: 0.45, depthWrite: false });

    const core = new THREE.Mesh(boxGeo(1.4, 0.07, 0.26), coreMat);
    g.add(core);
    const glow = new THREE.Mesh(boxGeo(1.9, 0.16, 0.50), glowMat);
    g.add(glow);
    const tip = new THREE.Mesh(boxGeo(0.32, 0.05, 0.16), coreMat);
    tip.position.x = 0.85;
    g.add(tip);

    g.position.copy(start);
    g.quaternion.copy(camera.quaternion);
    scene.add(g);

    qiBlasts.push({
        mesh: g, pos: start.clone(), dir: dir.clone(),
        speed: 48, life: 0.9, maxLife: 0.9,
        damage: 80 + charge * 190,
        radius: 1.7 + charge * 0.9,
        hitSet: new Set()
    });

    SFX.qiRelease();
    meleeSwingType = 'qiRelease';
    meleeSwingT = 1;
    meleeShieldEl.style.opacity = 0.45;
    player.invulnUntil = Math.max(player.invulnUntil, performance.now() + 250);
    cameraShake = Math.min(1.2, cameraShake + 0.35);
}

function updateQiBlasts(dt) {
    for (let i = qiBlasts.length - 1; i >= 0; i--) {
        const q = qiBlasts[i];
        q.life -= dt;
        q.pos.addScaledVector(q.dir, q.speed * dt);
        q.mesh.position.copy(q.pos);
        q.mesh.rotation.z += dt * 10;

        for (const e of enemies) {
            if (e.dead || q.hitSet.has(e)) continue;
            const c = e.group.position.clone();
            c.y += ENEMY_HEIGHT * 0.55;
            if (c.distanceTo(q.pos) < q.radius) {
                q.hitSet.add(e);
                damageEnemy(e, q.damage, false, c, true);
                spawnBlood(c);
                showHitmarker(false);
            }
        }

        if (pointBlocked(q.pos.x, q.pos.y, q.pos.z, 0.3)) {
            spawnImpact(q.pos, 0xffcc44);
            scene.remove(q.mesh);
            qiBlasts.splice(i, 1);
            continue;
        }
        if (q.life <= 0) {
            scene.remove(q.mesh);
            qiBlasts.splice(i, 1);
        }
    }
}

/* —— 手雷投掷 —— */
const grenades = [];

function buildGrenadeMesh() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(cylGeo(0.085, 0.085, 0.17, 10), MAT.darkSteel);
    g.add(body);
    for (let i = 0; i < 4; i++) {
        const ring = new THREE.Mesh(cylGeo(0.090, 0.090, 0.012, 10), MAT.black);
        ring.position.y = -0.055 + i * 0.036;
        g.add(ring);
    }
    const cap = new THREE.Mesh(cylGeo(0.05, 0.05, 0.06, 8), MAT.steel);
    cap.position.y = 0.11;
    g.add(cap);
    const lever = new THREE.Mesh(boxGeo(0.02, 0.09, 0.025), MAT.steel);
    lever.position.set(0.055, 0.10, 0);
    lever.rotation.z = 0.35;
    g.add(lever);
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.022, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xff3322 }));
    led.position.set(0, 0.148, 0);
    g.add(led);
    return g;
}
const GRENADE_GEO = buildGrenadeMesh();

function throwGrenade() {
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);

    const start = camera.position.clone()
        .addScaledVector(dir, 0.55)
        .addScaledVector(right, 0.20);
    start.y -= 0.10;

    const mesh = GRENADE_GEO.clone();
    mesh.position.copy(start);
    mesh.traverse(o => { if (o.isMesh) o.castShadow = true; });
    scene.add(mesh);

    const vel = dir.clone().multiplyScalar(26).addScaledVector(UP, 4.0);

    grenades.push({
        mesh, pos: start.clone(), vel,
        fuse: 2.5, spin: rr(4, 9), tickTimer: 0, lastBounce: 0
    });

    SFX.throwG();
    meleeSwingType = 'throw';
    meleeSwingT = 1;
}

function explode(pos) {
    SFX.explode();
    spawnExplosion(pos);
    cameraShake = Math.min(1.2, cameraShake + 0.9);

    const R = 8.5;
    for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.group.position.x - pos.x;
        const dy = (e.group.position.y + 1.0) - pos.y;
        const dz = e.group.position.z - pos.z;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d < R) {
            const dmg = 240 * Math.pow(1 - d / R, 1.35);
            const hp = new THREE.Vector3(
                e.group.position.x,
                e.group.position.y + ENEMY_HEIGHT * 0.6,
                e.group.position.z
            );
            damageEnemy(e, dmg, false, hp, true);
        }
    }

    const pdx = player.pos.x - pos.x;
    const pdy = (player.pos.y + 1.0) - pos.y;
    const pdz = player.pos.z - pos.z;
    const pd = Math.sqrt(pdx * pdx + pdy * pdy + pdz * pdz);
    if (pd < R * 0.8) {
        damagePlayer(46 * Math.pow(1 - pd / (R * 0.8), 1.2));
    }
}

function updateGrenades(dt) {
    for (let i = grenades.length - 1; i >= 0; i--) {
        const g = grenades[i];
        g.fuse -= dt;

        g.tickTimer -= dt;
        if (g.tickTimer <= 0) {
            g.tickTimer = Math.max(0.09, g.fuse * 0.22);
            SFX.fuseTick();
        }

        g.vel.y += GRAVITY * 0.9 * dt;

        const nx = g.pos.x + g.vel.x * dt;
        if (pointBlocked(nx, g.pos.y, g.pos.z, 0.13)) {
            g.vel.x *= -0.42;
        } else {
            g.pos.x = nx;
        }
        const nz = g.pos.z + g.vel.z * dt;
        if (pointBlocked(g.pos.x, g.pos.y, nz, 0.13)) {
            g.vel.z *= -0.42;
        } else {
            g.pos.z = nz;
        }

        g.pos.y += g.vel.y * dt;
        const gy = groundHeightAt(g.pos.x, g.pos.z, g.pos.y, 0.12);
        if (g.pos.y < gy + 0.13) {
            g.pos.y = gy + 0.13;
            if (g.vel.y < 0) {
                if (Math.abs(g.vel.y) > 2.0 && performance.now() - g.lastBounce > 90) {
                    SFX.bounce();
                    g.lastBounce = performance.now();
                }
                g.vel.y = -g.vel.y * 0.38;
            }
            if (Math.abs(g.vel.y) < 1.4) g.vel.y = 0;
            g.vel.x *= 0.70;
            g.vel.z *= 0.70;
            if (Math.abs(g.vel.x) < 0.25) g.vel.x = 0;
            if (Math.abs(g.vel.z) < 0.25) g.vel.z = 0;
        }

        g.mesh.position.copy(g.pos);
        g.mesh.rotation.x += dt * g.spin;
        g.mesh.rotation.z += dt * g.spin * 0.7;

        if (g.fuse <= 0) {
            scene.remove(g.mesh);
            grenades.splice(i, 1);
            explode(g.pos.clone());
        }
    }
}

function tryFire(now) {
    const w = W(), ws = WS();
    if (player.dead || player.reloading) return;
    if (w.melee) return;
    if (now - lastFireTime < w.fireInterval * 1000) return;

    if (w.throwable) {
        lastFireTime = now;
        throwGrenade();
        return;
    }

    if (ws.ammo <= 0) { startReload(); return; }

    lastFireTime = now;
    ws.ammo--;
    updateAmmoUI();
    SFX.shoot(w);

    recoilKick = w.recoilKick;
    recoilPitch += aiming ? w.recoilPitch * 0.5 : w.recoilPitch;

    crosshairEl.classList.add('fire');
    clearTimeout(crosshairTimer);
    crosshairTimer = setTimeout(() => crosshairEl.classList.remove('fire'), 85);

    const gm = gunModels[w.id];
    if (gm && gm.flash) {
        gm.flash.visible = true;
        gm.flash.scale.setScalar(0.75 + Math.random() * 0.7);
        gm.flash.rotation.z = Math.random() * Math.PI;
        flashTimer = 0.045;
    }

    const targets = worldMeshes.slice();
    for (const e of enemies) {
        if (!e.dead) for (const m of e.hitMeshes) targets.push(m);
    }

    gunGroup.updateWorldMatrix(true, false);
    const muzzleWorld = gm.group.localToWorld(gm.muzzle.clone());

    const spreadMul = aiming ? 0.35 : 1;
    const tracerColor = w.gold ? 0xffd34d : (w.rare ? 0xffc070 : 0xffee88);

    for (let p = 0; p < w.pellets; p++) {
        const ndc = new THREE.Vector2(
            (Math.random() - 0.5) * w.spread * spreadMul * 2,
            (Math.random() - 0.5) * w.spread * spreadMul * 2
        );
        raycaster.setFromCamera(ndc, camera);
        raycaster.far = w.range;

        const hits = raycaster.intersectObjects(targets, false);

        if (hits.length > 0) {
            const hit = hits[0];
            const enemy = hit.object.userData.enemy;
            if (enemy && !enemy.dead) {
                const relY = hit.point.y - enemy.group.position.y;
                const isHead = relY > ENEMY_HEIGHT * 0.82;
                damageEnemy(enemy, w.damage, isHead, hit.point, false);
                spawnBlood(hit.point);
                if (p === 0) showHitmarker(isHead);
            } else {
                spawnImpact(hit.point);
            }
            if (p === 0 || w.pellets <= 2) spawnTracer(muzzleWorld, hit.point, tracerColor, 0.06);
        } else {
            if (p === 0) {
                const end = raycaster.ray.at(w.range, new THREE.Vector3());
                spawnTracer(muzzleWorld, end, tracerColor, 0.06);
            }
        }
    }

    raycaster.far = Infinity;

    if (ws.ammo === 0 && ws.reserve > 0) startReload();
}

/* ============================================================
   21. 输入
   ============================================================ */
const overlayEl = $('startOverlay');
let usingPointerLock = false;
let fallbackMode = false;
let dragging = false;
let fallbackTipEl = null;

function showFallbackTip() {
    if (!fallbackTipEl) {
        fallbackTipEl = document.createElement('div');
        fallbackTipEl.style.cssText = `
            position:fixed;left:50%;top:15%;transform:translateX(-50%);
            background:rgba(0,0,0,.78);color:#fff;padding:13px 24px;
            border:1px solid rgba(255,255,255,.25);border-radius:10px;
            font-size:14px;line-height:1.75;text-align:center;z-index:300;
            pointer-events:none;opacity:0;transition:opacity .35s;
            text-shadow:1px 1px 0 #000;max-width:88vw;
        `;
        document.body.appendChild(fallbackTipEl);
    }
    fallbackTipEl.innerHTML =
        `当前环境不支持鼠标锁定，已切换为拖拽模式<br>
         <b>按住鼠标右键拖拽</b> 旋转视角 · <b>左键</b> 射击/连斩/蓄力<br>
         <span style="opacity:.65;font-size:12px">如在 iframe 中运行，请为 iframe 添加 allow="pointer-lock"</span>`;
    requestAnimationFrame(() => { fallbackTipEl.style.opacity = 1; });
    clearTimeout(fallbackTipEl._t);
    fallbackTipEl._t = setTimeout(() => { fallbackTipEl.style.opacity = 0; }, 7000);
}

function enterFallbackMode() {
    if (fallbackMode) return;
    fallbackMode = true;
    usingPointerLock = false;
    startGame();
    renderer.domElement.style.cursor = 'crosshair';
    showFallbackTip();
}

function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    overlayEl.classList.add('hidden');
    initAudio();
}

function requestLock() {
    const el = renderer.domElement;
    try {
        const p = el.requestPointerLock ? el.requestPointerLock() : null;
        if (p && typeof p.then === 'function') {
            p.then(() => { usingPointerLock = true; }).catch(enterFallbackMode);
        } else {
            setTimeout(() => {
                if (document.pointerLockElement !== el) enterFallbackMode();
            }, 170);
        }
    } catch (e) {
        enterFallbackMode();
    }
}

overlayEl.addEventListener('click', () => {
    startGame();
    if (!fallbackMode) requestLock();
});

renderer.domElement.addEventListener('click', () => {
    if (fallbackMode || !gameStarted) return;
    if (document.pointerLockElement !== renderer.domElement) requestLock();
});

document.addEventListener('pointerlockchange', () => {
    const locked = document.pointerLockElement === renderer.domElement;
    if (locked) {
        usingPointerLock = true;
        overlayEl.classList.add('hidden');
    } else {
        usingPointerLock = false;
        if (fallbackMode) return;
        if (gameStarted) {
            overlayEl.classList.remove('hidden');
            mouseDown = false;
            aiming = false;
            meleeHolding = false;
            meleeCharging = false;
            for (const k in keys) keys[k] = false;
        }
    }
});

document.addEventListener('pointerlockerror', enterFallbackMode);

document.addEventListener('mousemove', (e) => {
    if (!gameStarted) return;
    if (usingPointerLock) {
        const sens = aiming ? 0.0011 : 0.0021;
        yaw   -= e.movementX * sens;
        pitch -= e.movementY * sens;
        pitch = Math.max(-1.45, Math.min(1.45, pitch));
    } else if (fallbackMode && dragging) {
        const sens = aiming ? 0.0015 : 0.0027;
        yaw   -= e.movementX * sens;
        pitch -= e.movementY * sens;
        pitch = Math.max(-1.45, Math.min(1.45, pitch));
    }
});

/* 左键按下：近战 → 连斩 + 启动蓄力计时；其他 → 持续射击 */
function onPrimaryDown() {
    if (!gameStarted || player.dead) return;
    const w = W();
    if (w.melee) {
        meleeHolding = true;
        meleeHoldStart = performance.now();
        doQuickSlash();
    } else {
        mouseDown = true;
    }
}

function onPrimaryUp() {
    const w = W();
    if (w.melee && meleeHolding) {
        if (meleeCharging && meleeChargeT > 0.22) {
            fireSwordQi(meleeChargeT);
        }
        meleeHolding = false;
        meleeCharging = false;
        meleeChargeT = 0;
        chargeOrb.visible = false;
        crosshairEl.classList.remove('charge');
    }
    mouseDown = false;
}

function onSecondaryDown() {
    if (!gameStarted || player.dead) return;
    const w = W();
    if (w.melee) {
        doHeavyThrust();
    } else {
        aiming = true;
    }
}

document.addEventListener('mousedown', (e) => {
    if (!gameStarted) return;
    if (usingPointerLock) {
        if (e.button === 0) onPrimaryDown();
        if (e.button === 2) onSecondaryDown();
    } else if (fallbackMode) {
        if (e.button === 0) onPrimaryDown();
        if (e.button === 2) { onSecondaryDown(); dragging = true; }
    }
});

document.addEventListener('mouseup', (e) => {
    if (e.button === 0) onPrimaryUp();
    if (e.button === 2) { aiming = false; dragging = false; }
});

document.addEventListener('wheel', (e) => {
    if (!gameStarted || player.dead) return;
    e.preventDefault();
    cycleWeapon(e.deltaY > 0 ? 1 : -1);
}, { passive: false });

renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd'].includes(k)) keys[k] = true;
    if (e.key === 'Shift') keys.shift = true;

    if (e.code === 'Space') {
        e.preventDefault();
        if (player.onGround && !player.dead) {
            player.velY = JUMP_SPEED;
            player.onGround = false;
        }
    }
    if (k === 'r') startReload();

    if (k >= '1' && k <= '9') {
        const idx = parseInt(k, 10) - 1;
        if (idx < WEAPONS.length) switchWeapon(idx);
    }
    if (k === '0' && WEAPONS.length >= 10) switchWeapon(9);
});

window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd'].includes(k)) keys[k] = false;
    if (e.key === 'Shift') keys.shift = false;
});

window.addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    mouseDown = false;
    aiming = false;
    dragging = false;
    meleeHolding = false;
    meleeCharging = false;
    meleeChargeT = 0;
});

/* ============================================================
   22. 玩家更新
   ============================================================ */
const UP = new THREE.Vector3(0, 1, 0);
const moveDir = new THREE.Vector3();

function updatePlayer(dt) {
    if (player.dead) {
        player.respawnTimer -= dt;
        respawnCountEl.textContent = Math.max(0, Math.ceil(player.respawnTimer));
        if (player.respawnTimer <= 0) respawnPlayer();
        const targetY = player.pos.y + 0.35;
        camera.position.set(player.pos.x, camera.position.y + (targetY - camera.position.y) * dt * 3, player.pos.z);
        camera.rotation.set(pitch * 0.4, yaw, 0.35, 'YXZ');
        return;
    }

    if (player.reloading) {
        player.reloadTimer -= dt;
        const p = 1 - Math.max(0, player.reloadTimer) / player.reloadTotal;
        reloadBarFill.style.width = (p * 100) + '%';
        if (player.reloadTimer <= 0) {
            player.reloading = false;
            const w = W(), ws = WS();
            const need = w.magSize - ws.ammo;
            const take = Math.min(need, ws.reserve);
            ws.ammo += take;
            ws.reserve -= take;
            reloadBarEl.style.opacity = 0;
            updateAmmoUI();
        }
    }

    if (performance.now() - player.lastDamageTime > 5200 && player.hp < 100) {
        player.hp = Math.min(100, player.hp + 9 * dt);
        updateVitalsUI();
    }

    /* —— 近战蓄力计时 —— */
    if (meleeHolding && W().melee) {
        const held = performance.now() - meleeHoldStart;
        if (!meleeCharging && held > 550) {
            meleeCharging = true;
            meleeChargeT = 0;
            SFX.chargeUp();
        }
        if (meleeCharging) {
            meleeChargeT = Math.min(1, (held - 550) / 750);
            chargeOrb.visible = true;
            const s = 0.6 + meleeChargeT * 1.5;
            chargeOrb.scale.setScalar(s);
            chargeOrb.children[1].material.opacity = 0.2 + meleeChargeT * 0.4;
            crosshairEl.classList.add('charge');
        }
    } else if (!meleeHolding) {
        chargeOrb.visible = false;
        crosshairEl.classList.remove('charge');
    }

    /* —— 刀刃蓄力发光 —— */
    const knifeModel = gunModels['knife'];
    if (knifeModel && knifeModel.customMats && knifeModel.customMats.blade) {
        const glow = (W().id === 'knife' && meleeCharging) ? (0.15 + meleeChargeT * 0.95) : 0;
        knifeModel.customMats.blade.emissive.setRGB(glow * 1.2, glow * 0.6, glow * 0.08);
    }

    /* —— 移动 —— */
    moveDir.set(0, 0, 0);
    if (keys.w) moveDir.z -= 1;
    if (keys.s) moveDir.z += 1;
    if (keys.a) moveDir.x -= 1;
    if (keys.d) moveDir.x += 1;

    const isMoving = moveDir.lengthSq() > 0;

    if (isMoving) {
        moveDir.normalize().applyAxisAngle(UP, yaw);

        let speed = keys.shift ? 10.8 : 6.4;
        if (aiming) speed *= 0.55;

        const step = speed * dt;

        const ox = player.pos.x, oz = player.pos.z;
        player.pos.x += moveDir.x * step;
        if (collidesAt(player.pos, PLAYER_RADIUS)) player.pos.x = ox;
        player.pos.z += moveDir.z * step;
        if (collidesAt(player.pos, PLAYER_RADIUS)) player.pos.z = oz;

        walkTime += dt * (keys.shift ? 15 : 9);
        bobAmount = Math.min(1, bobAmount + dt * 6);
    } else {
        bobAmount = Math.max(0, bobAmount - dt * 6);
    }

    player.velY += GRAVITY * dt;
    player.pos.y += player.velY * dt;

    const gh = groundHeightAt(player.pos.x, player.pos.z, player.pos.y);
    if (player.pos.y <= gh + 0.001) {
        player.pos.y = gh;
        player.velY = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }

    /* —— 拾取 —— */
    for (const p of pickups) {
        if (!p.active) continue;
        const dx = p.group.position.x - player.pos.x;
        const dz = p.group.position.z - player.pos.z;
        if (dx * dx + dz * dz < PICKUP_RADIUS_SQ) {
            if (p.type === 'health') {
                if (player.hp >= 100) {
                    if (player.armor >= player.maxArmor) continue;
                    player.armor = Math.min(player.maxArmor, player.armor + 25);
                    showToast('拾取 医疗包 → 护甲 +25', '#7fc8ff');
                } else {
                    player.hp = Math.min(100, player.hp + 45);
                    showToast('拾取 医疗包 → 生命 +45', '#7dff9e');
                }
                updateVitalsUI();
            } else if (p.type === 'ammo') {
                WS().reserve += 60;
                showToast('拾取 弹药包 → 备弹 +60', '#ffd34d');
                updateAmmoUI();
            } else {
                const idx = WEAPONS.findIndex(w => w.id === p.type);
                if (idx >= 0) {
                    const wdef = WEAPONS[idx];
                    if (!wdef.owned) {
                        wdef.owned = true;
                        weaponStates[idx].ammo = wdef.magSize;
                        weaponStates[idx].reserve = 400;
                        showToast(`获得 ${wdef.name}！`, wdef.gold ? '#ffd34d' : '#7fd8ff');
                        updateAmmoUI();
                        switchWeapon(idx);
                        SFX.pickup();
                    } else {
                        weaponStates[idx].reserve += 300;
                        showToast(`${wdef.name} 备弹 +300`, '#ffd34d');
                        updateAmmoUI();
                    }
                }
            }
            p.active = false;
            p.timer = PICKUP_RESPAWN;
            p.group.visible = false;
            if (p.type === 'health' || p.type === 'ammo') SFX.pickup();
        }
    }

    /* —— 相机 —— */
    const bob = Math.sin(walkTime) * 0.042 * bobAmount;
    const roll = Math.cos(walkTime * 0.5) * 0.011 * bobAmount;

    if (cameraShake > 0) cameraShake = Math.max(0, cameraShake - dt * 3.2);
    const shakeX = (Math.random() - 0.5) * cameraShake * 0.16;
    const shakeY = (Math.random() - 0.5) * cameraShake * 0.16;

    camera.position.set(
        player.pos.x + shakeX,
        player.pos.y + EYE_HEIGHT + bob + shakeY,
        player.pos.z
    );
    camera.rotation.set(pitch + recoilPitch, yaw, roll, 'YXZ');

    const isSniper = W().id === 'sniper';
    let targetFov = 76;
    if (aiming) {
        if (isSniper) targetFov = 18;
        else targetFov = 52;
    }
    if (Math.abs(camera.fov - targetFov) > 0.05) {
        camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 14);
        camera.updateProjectionMatrix();
    }

    const hideGun = aiming && isSniper;
    gunGroup.visible = !hideGun;

    if (isSniper && aiming) {
        scopeOverlayEl.classList.add('on');
        crosshairEl.style.opacity = 0;
    } else {
        scopeOverlayEl.classList.remove('on');
        crosshairEl.style.opacity = 1;
    }

    recoilKick *= Math.exp(-13 * dt);
    recoilPitch *= Math.exp(-9 * dt);

    /* —— 武器基础位置 —— */
    let base;
    if (aiming && isSniper) {
        base = { x: 0.0, y: -0.09, z: -0.20 };
    } else if (aiming) {
        base = { x: 0.0, y: -0.155, z: -0.33 };
    } else {
        base = { x: 0.30, y: -0.28, z: -0.48 };
    }

    // 蓄力时抬刀姿势
    if (W().melee && meleeCharging) {
        const c = meleeChargeT;
        base.x += c * 0.02;
        base.y += c * 0.17;
        base.z += c * 0.10;
    }

    const k = Math.min(1, dt * 15);
    gunGroup.position.x += (base.x - gunGroup.position.x) * k;
    gunGroup.position.y += (base.y - gunGroup.position.y) * k;
    gunGroup.position.z += (base.z - gunGroup.position.z) * k;

    /* —— 近战 / 投掷 / 剑气 动画 —— */
    gunGroup.rotation.set(0, 0, 0);
    if (meleeSwingT > 0) {
        meleeSwingT = Math.max(0, meleeSwingT - dt * 3.4);
        const t = 1 - meleeSwingT;
        const swing = Math.sin(t * Math.PI);
        const type = meleeSwingType;

        if (type === 'slash0') {
            gunGroup.rotation.y = -swing * 1.5;
            gunGroup.rotation.z = swing * 0.9;
            gunGroup.rotation.x = -swing * 0.3;
            gunGroup.position.x -= swing * 0.20;
            gunGroup.position.y += swing * 0.10;
        } else if (type === 'slash1') {
            gunGroup.rotation.y = swing * 1.2;
            gunGroup.rotation.z = -swing * 0.8;
            gunGroup.rotation.x = -swing * 0.25;
            gunGroup.position.x += swing * 0.10;
            gunGroup.position.y += swing * 0.08;
        } else if (type === 'slash2') {
            gunGroup.rotation.y = -swing * 0.9;
            gunGroup.rotation.x = -swing * 0.65;
            gunGroup.rotation.z = swing * 0.35;
            gunGroup.position.y += swing * 0.16;
        } else if (type === 'heavy') {
            const k2 = swing;
            gunGroup.position.z -= k2 * 0.75;
            gunGroup.position.y += k2 * 0.05;
            gunGroup.rotation.x = -k2 * 0.15;
        } else if (type === 'qiRelease') {
            gunGroup.rotation.y = swing * 1.8;
            gunGroup.rotation.z = swing * 0.6;
            gunGroup.position.z -= swing * 0.35;
        } else if (type === 'throw') {
            gunGroup.position.z += swing * 0.30;
            gunGroup.position.y += swing * 0.14;
            gunGroup.rotation.x = -swing * 0.75;
        }
    } else if (meleeCharging) {
        const c = meleeChargeT;
        gunGroup.rotation.x = c * 0.35;
        gunGroup.rotation.y = -c * 0.45;
        gunGroup.rotation.z = c * 0.25;
    } else {
        gunGroup.position.z += recoilKick * 0.085;
        gunGroup.position.y += Math.sin(walkTime * 2) * 0.008 * bobAmount;
        gunGroup.rotation.x = recoilKick * 0.2;
        gunGroup.rotation.z = Math.sin(walkTime) * 0.02 * bobAmount;
    }

    const shieldNow = performance.now();
    if (shieldNow < player.invulnUntil) {
        const remain = (player.invulnUntil - shieldNow) / 1000;
        meleeShieldEl.style.opacity = Math.min(0.65, remain * 1.8).toFixed(3);
    } else {
        meleeShieldEl.style.opacity = 0;
    }

    /* —— 射击（非近战） —— */
    if (mouseDown) {
        const w = W();
        if (w.throwable || w.auto) {
            tryFire(performance.now());
        } else if (!w.melee && !player._semiLatch) {
            player._semiLatch = true;
            tryFire(performance.now());
        }
    } else {
        player._semiLatch = false;
    }

    if (vignetteFlash > 0) vignetteFlash = Math.max(0, vignetteFlash - dt * 1.9);
    const lowHp = player.hp < 35 ? (0.20 + Math.sin(performance.now() * 0.006) * 0.10) : 0;
    vignetteEl.style.opacity = Math.max(vignetteFlash, lowHp).toFixed(3);

    if (hurtFlashVal > 0) {
        hurtFlashVal = Math.max(0, hurtFlashVal - dt * 4);
        hurtFlashEl.style.opacity = hurtFlashVal.toFixed(3);
    }
}

/* ============================================================
   23. 敌人更新
   ============================================================ */
const _eToPlayer = new THREE.Vector3();
const _enemyEye = new THREE.Vector3();

function lerpAngle(a, b, t) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
}

function enemyCollides(pos) {
    return collidesAt(pos, ENEMY_RADIUS, 0.55);
}

function moveEntityXZ(entity, dirX, dirZ, speed, dt) {
    const step = speed * dt;
    const ox = entity.group.position.x, oz = entity.group.position.z;

    entity.group.position.x += dirX * step;
    if (enemyCollides(entity.group.position)) entity.group.position.x = ox;
    entity.group.position.z += dirZ * step;
    if (enemyCollides(entity.group.position)) entity.group.position.z = oz;
}

function checkStepUp(e, dirX, dirZ) {
    const aheadX = e.group.position.x + dirX * 1.0;
    const aheadZ = e.group.position.z + dirZ * 1.0;
    const curY = e.group.position.y;
    const aheadGround = groundHeightAt(aheadX, aheadZ, curY + 2.2, 0.45);
    const stepUp = aheadGround - curY;
    if (stepUp > 0.55 && stepUp < 1.95) return aheadGround;
    return null;
}

function updateEnemies(dt) {
    for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];

        if (e.dead) {
            if (e.deadTimer < 2.2) {
                e.deadTimer += dt;
                if (e.mixer) e.mixer.update(dt);
            }
            if (!e.useFallAnim && !e.deathFallDone) {
                e.deathRotX += dt * 4.5;
                if (e.deathRotX >= Math.PI / 2) {
                    e.deathRotX = Math.PI / 2;
                    e.deathFallDone = true;
                }
                e.group.rotation.x = e.deathRotX;
            }
            e.barBg.visible = false;
            e.barFg.visible = false;
            continue;
        }

        const by = e.group.position.y + 2.3;
        e.barBg.position.set(e.group.position.x, by, e.group.position.z);
        e.barFg.position.set(e.group.position.x - 0.55, by, e.group.position.z);

        _eToPlayer.subVectors(player.pos, e.group.position);
        _eToPlayer.y = 0;
        const dist = _eToPlayer.length();

        e.animTick++;
        const animSkip = dist > 55 ? 2 : 1;
        if (e.mixer && (e.animTick % animSkip === 0)) {
            e.mixer.update(dt * animSkip);
        }

        if (e.flash > 0) {
            e.flash -= dt;
            const f = Math.max(0, e.flash / 0.13);
            for (const m of e.baseMats) if (m.emissive) m.emissive.setRGB(f * 0.9, 0, 0);
        } else {
            for (const m of e.baseMats) if (m.emissive) m.emissive.setRGB(0, 0, 0);
        }

        const ratio = Math.max(0, e.hp / e.maxHp);
        e.barFg.scale.x = 1.1 * ratio;
        e.barFg.visible = ratio > 0.01;
        e.barFg.material.color.setHex(ratio > 0.6 ? 0x35d07f : ratio > 0.3 ? 0xe0c23a : 0xd84438);

        if (e.pendingAttack) {
            e.pendingAttack.t -= dt;
            if (e.pendingAttack.t <= 0) {
                const d = player.pos.distanceTo(e.group.position);
                if (d < ENEMY_ATTACK_RANGE + 1.2 && !player.dead) {
                    damagePlayer(e.pendingAttack.dmg);
                }
                e.pendingAttack = null;
            }
        }

        e.visionTimer -= dt;
        if (e.visionTimer <= 0) {
            e.visionTimer = 0.26 + Math.random() * 0.22;
            _enemyEye.copy(e.group.position).add(_v2.set(0, 1.5, 0));
            e.canSee = !player.dead && dist < 50 && hasLineOfSight(_enemyEye, camera.position);
        }
        if (e.canSee) {
            e.lastSeen.copy(player.pos);
            e.alert = 4.5;
        } else {
            e.alert -= dt;
        }

        if (e.alert > 0) {
            const target = e.canSee ? player.pos : e.lastSeen;
            const dx = target.x - e.group.position.x;
            const dz = target.z - e.group.position.z;
            const td = Math.hypot(dx, dz);

            if (td > 0.05) {
                const targetYaw = Math.atan2(dx, dz) + ENEMY_FACING_OFFSET;
                e.group.rotation.y = lerpAngle(e.group.rotation.y, targetYaw, Math.min(1, dt * 8));
            }

            if (e.climbTimer > 0) {
                e.climbTimer -= dt;
                e.group.position.y += (e.climbTargetY - e.group.position.y) * Math.min(1, dt * 9);
                if (td > 0.05) {
                    moveEntityXZ(e, dx / td, dz / td, e.speed * 0.55, dt);
                }
                continue;
            }

            if (dist > ENEMY_ATTACK_RANGE) {
                if (e.animState !== 'sprint' && e.animState !== 'jump') {
                    enemyPlayAnim(e, 'sprint', 0.15);
                }

                if (td > 0.05) {
                    const nX = dx / td, nZ = dz / td;
                    const climbY = checkStepUp(e, nX, nZ);
                    if (climbY !== null) {
                        enemyPlayAnim(e, 'jump', 0.1, true);
                        e.climbTimer = 0.55;
                        e.climbTargetY = climbY;
                        continue;
                    }
                    moveEntityXZ(e, nX, nZ, e.speed, dt);
                }
            } else {
                if (e.attackCd <= 0) {
                    enemyPlayAnim(e, 'jump_forward', 0.1, true);
                    e.attackCd = ENEMY_ATTACK_CD;
                    enemyMeleeAttack(e);
                    if (td > 0.05) {
                        moveEntityXZ(e, dx / td, dz / td, e.speed * 0.8, 0.25);
                    }
                } else {
                    e.attackCd -= dt;
                    if (e.animState !== 'walk' && e.animState !== 'jump_forward') {
                        enemyPlayAnim(e, 'walk', 0.15);
                    }
                }
            }
        } else {
            if (e.wanderState === 'dance') {
                if (e.animState !== 'dance') enemyPlayAnim(e, 'dance', 0.2);
                e.danceTimer -= dt;
                if (e.danceTimer <= 0) {
                    e.wanderState = 'walk';
                    e.wanderTimer = rr(2.5, 5);
                    const a = rand() * Math.PI * 2;
                    e.wanderDir.set(Math.sin(a), 0, Math.cos(a));
                }
            } else {
                if (e.animState !== 'walk' && e.animState !== 'jump') {
                    enemyPlayAnim(e, 'walk', 0.2);
                }

                e.wanderTimer -= dt;
                if (e.wanderTimer <= 0) {
                    e.wanderTimer = rr(2.5, 5.5);
                    if (Math.random() < 0.35) {
                        e.wanderState = 'dance';
                        e.danceTimer = rr(2.5, 5.5);
                    } else {
                        const a = rand() * Math.PI * 2;
                        e.wanderDir.set(Math.sin(a), 0, Math.cos(a));
                    }
                }

                const wd = e.wanderDir;
                e.group.rotation.y = lerpAngle(
                    e.group.rotation.y,
                    Math.atan2(wd.x, wd.z) + ENEMY_FACING_OFFSET,
                    Math.min(1, dt * 4)
                );

                if (e.climbTimer > 0) {
                    e.climbTimer -= dt;
                    e.group.position.y += (e.climbTargetY - e.group.position.y) * Math.min(1, dt * 9);
                    moveEntityXZ(e, wd.x, wd.z, e.speed * 0.2, dt);
                    continue;
                }

                const climbY = checkStepUp(e, wd.x, wd.z);
                if (climbY !== null) {
                    enemyPlayAnim(e, 'jump', 0.1, true);
                    e.climbTimer = 0.5;
                    e.climbTargetY = climbY;
                } else {
                    moveEntityXZ(e, wd.x, wd.z, e.speed * 0.38, dt);
                }
            }
        }

        if (e.climbTimer <= 0) {
            const gy = groundHeightAt(e.group.position.x, e.group.position.z, e.group.position.y + 0.3, 0.5);
            e.group.position.y += (gy - e.group.position.y) * Math.min(1, dt * 14);
        }
    }
}

/* ============================================================
   24. 拾取物更新
   ============================================================ */
function updatePickups(dt) {
    const t = performance.now() * 0.001;
    for (const p of pickups) {
        if (!p.active) {
            if (p.noRespawn) continue;
            p.timer -= dt;
            if (p.timer <= 0) {
                p.active = true;
                p.group.visible = true;
            }
            continue;
        }
        p.group.rotation.y += dt * 1.8;
        p.group.position.y = p.baseY + Math.sin(t * 2 + p.spin) * 0.16;
    }
}

/* ============================================================
   25. 小地图
   ============================================================ */
const mmCanvas = $('minimap');
const mmCtx = mmCanvas.getContext('2d');
const MM_SIZE = 190;
const MM_DPR = Math.min(devicePixelRatio, 2);
mmCanvas.width = MM_SIZE * MM_DPR;
mmCanvas.height = MM_SIZE * MM_DPR;
mmCtx.scale(MM_DPR, MM_DPR);

const MM_SCALE = 0.42;
let lastMMTime = 0;

function updateMinimap(now) {
    if (now - lastMMTime < 70) return;
    lastMMTime = now;

    const S = MM_SIZE;
    const cx = S / 2, cy = S / 2;
    const px = player.pos.x, pz = player.pos.z;
    const sn = Math.sin(yaw), cs = Math.cos(yaw);

    mmCtx.clearRect(0, 0, S, S);
    mmCtx.fillStyle = 'rgba(10,22,32,0.88)';
    mmCtx.fillRect(0, 0, S, S);

    mmCtx.strokeStyle = 'rgba(120,190,255,0.07)';
    mmCtx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const p = (i / 4) * S;
        mmCtx.beginPath(); mmCtx.moveTo(p, 0); mmCtx.lineTo(p, S); mmCtx.stroke();
        mmCtx.beginPath(); mmCtx.moveTo(0, p); mmCtx.lineTo(S, p); mmCtx.stroke();
    }

    const range = (S / 2) / MM_SCALE + 8;

    const boxes = gatherColliders(px - range, pz - range, px + range, pz + range, _qA);
    mmCtx.fillStyle = 'rgba(150,175,200,0.42)';
    for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        const bw = b.max.x - b.min.x;
        const bd = b.max.z - b.min.z;
        if (bw < 1.5 && bd < 1.5) continue;
        if (b.max.y < 1.0) continue;

        const bx = (b.min.x + b.max.x) * 0.5;
        const bz = (b.min.z + b.max.z) * 0.5;
        const dx = bx - px, dz = bz - pz;
        const mx = cx + (cs * dx - sn * dz) * MM_SCALE;
        const my = cy + (sn * dx + cs * dz) * MM_SCALE;

        const rw = Math.max(1.5, bw * MM_SCALE * 0.85);
        const rh = Math.max(1.5, bd * MM_SCALE * 0.85);
        if (mx < -20 || mx > S + 20 || my < -20 || my > S + 20) continue;
        mmCtx.fillRect(mx - rw / 2, my - rh / 2, rw, rh);
    }

    for (let i = 0; i < pickups.length; i++) {
        const p = pickups[i];
        if (!p.active) continue;
        const dx = p.group.position.x - px, dz = p.group.position.z - pz;
        if (Math.abs(dx) > range || Math.abs(dz) > range) continue;
        const mx = cx + (cs * dx - sn * dz) * MM_SCALE;
        const my = cy + (sn * dx + cs * dz) * MM_SCALE;
        if (p.type === 'health')      mmCtx.fillStyle = '#5aff9a';
        else if (p.type === 'ammo')   mmCtx.fillStyle = '#ffd34d';
        else                          mmCtx.fillStyle = p.type === 'golden' ? '#ffe680' : '#7fd8ff';
        mmCtx.beginPath();
        mmCtx.arc(mx, my, p.type === 'gatling' || p.type === 'golden' ? 3.6 : 2.6, 0, Math.PI * 2);
        mmCtx.fill();
    }

    for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.dead) continue;
        const dx = e.group.position.x - px, dz = e.group.position.z - pz;
        if (Math.abs(dx) > range || Math.abs(dz) > range) continue;
        const mx = cx + (cs * dx - sn * dz) * MM_SCALE;
        const my = cy + (sn * dx + cs * dz) * MM_SCALE;
        const d = Math.hypot(dx, dz);
        mmCtx.fillStyle = d < 40 ? '#ff4a4a' : 'rgba(255,74,74,0.45)';
        mmCtx.beginPath();
        mmCtx.arc(mx, my, d < 40 ? 3.4 : 2.2, 0, Math.PI * 2);
        mmCtx.fill();
    }

    mmCtx.save();
    mmCtx.translate(cx, cy);
    mmCtx.fillStyle = '#7fe8ff';
    mmCtx.shadowColor = '#7fe8ff';
    mmCtx.shadowBlur = 7;
    mmCtx.beginPath();
    mmCtx.moveTo(0, -7);
    mmCtx.lineTo(-5, 6);
    mmCtx.lineTo(0, 3);
    mmCtx.lineTo(5, 6);
    mmCtx.closePath();
    mmCtx.fill();
    mmCtx.restore();

    mmCtx.strokeStyle = 'rgba(140,210,255,0.22)';
    mmCtx.lineWidth = 1.5;
    mmCtx.beginPath();
    mmCtx.arc(cx, cy, S / 2 - 5, 0, Math.PI * 2);
    mmCtx.stroke();
}

/* ============================================================
   26. 主循环
   ============================================================ */
const clock = new THREE.Clock();
let statUpdateTimer = 0;

function animate() {
    requestAnimationFrame(animate);

    if (!active3d) {
        clock.getDelta();
        return;
    }

    const dt = Math.min(clock.getDelta(), 0.05);
    const now = performance.now();

    if (gameStarted) {
        updatePlayer(dt);
        updateEnemies(dt);
        updatePickups(dt);
        updateGrenades(dt);
        updateQiBlasts(dt);
        updateMinimap(now);

        statUpdateTimer -= dt;
        if (statUpdateTimer <= 0) {
            statUpdateTimer = 0.5;
            updateStatsUI();
        }
    }

    updateEffects(dt);

    if (flashTimer > 0) {
        flashTimer -= dt;
        if (flashTimer <= 0 && currentFlash) currentFlash.visible = false;
    }

    sun.position.set(player.pos.x + 80, 140, player.pos.z + 60);
    sun.target.position.copy(player.pos);
    sun.target.updateMatrixWorld();

    renderer.render(scene, camera);
}

/* ============================================================
   27. 初始化
   ============================================================ */
updateVitalsUI();
updateAmmoUI();
updateStatsUI();
updateWeaponModel();

camera.position.set(player.pos.x, player.pos.y + EYE_HEIGHT, player.pos.z);
camera.rotation.set(pitch, yaw, 0, 'YXZ');

loadAssets();

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
