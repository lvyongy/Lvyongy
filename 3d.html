<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>她来了 · 她来了</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0b1622;
        font-family: 'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
        user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; }

    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

    /* ---------- 准星 ---------- */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 0; height: 0; transition: opacity .1s; }
    .ch {
        position: absolute; background: rgba(255,255,255,.95);
        box-shadow: 0 0 3px rgba(0,0,0,.9); border-radius: 1px;
        transition: transform .07s ease-out;
    }
    .ch.t { width: 2px; height: 10px; left: -1px; top: -16px; }
    .ch.b { width: 2px; height: 10px; left: -1px; top: 6px; }
    .ch.l { width: 10px; height: 2px; left: -16px; top: -1px; }
    .ch.r { width: 10px; height: 2px; left: 6px; top: -1px; }
    #crosshair.fire .ch.t { transform: translateY(-7px); }
    #crosshair.fire .ch.b { transform: translateY(7px); }
    #crosshair.fire .ch.l { transform: translateX(-7px); }
    #crosshair.fire .ch.r { transform: translateX(7px); }
    #crosshair .dot {
        position: absolute; width: 3px; height: 3px; left: -1.5px; top: -1.5px;
        background: rgba(255,255,255,.9); border-radius: 50%;
        box-shadow: 0 0 3px rgba(0,0,0,.9);
    }
    #crosshair.charge .dot { background: #ffd34d; box-shadow: 0 0 10px #ffb030; }

    /* ---------- 狙击镜遮罩 ---------- */
    #scopeOverlay {
        position: fixed; inset: 0; pointer-events: none; z-index: 55;
        opacity: 0; transition: opacity .08s;
    }
    #scopeOverlay.on { opacity: 1; }
    #scopeOverlay .ring {
        position: absolute; inset: 0;
        background: radial-gradient(circle at center,
            transparent 0%, transparent 32%,
            rgba(0,0,0,0.6) 36%, #000 43%);
    }
    #scopeOverlay .cross-h {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
        width: 150px; height: 1px; background: rgba(15,15,15,0.92);
    }
    #scopeOverlay .cross-v {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
        width: 1px; height: 150px; background: rgba(15,15,15,0.92);
    }
    #scopeOverlay .tick { position: absolute; left: 50%; top: 50%; background: rgba(15,15,15,0.85); }
    #scopeOverlay .tick.h1 { width: 22px; height: 1px; margin-left: -68px; margin-top: -1px; }
    #scopeOverlay .tick.h2 { width: 22px; height: 1px; margin-left: 46px;  margin-top: -1px; }
    #scopeOverlay .tick.v1 { width: 1px; height: 22px; margin-top: -68px; margin-left: -1px; }
    #scopeOverlay .tick.v2 { width: 1px; height: 22px; margin-top: 46px;  margin-left: -1px; }
    #scopeOverlay .dot2 {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
        width: 3px; height: 3px; background: #ff3b30; border-radius: 50%;
        box-shadow: 0 0 5px #ff3b30;
    }

    /* ---------- 近战无敌护盾特效 ---------- */
    #meleeShield {
        position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, rgba(80,200,255,0) 40%, rgba(80,200,255,.35) 100%);
        transition: opacity .18s;
    }

    /* ---------- 命中标记 ---------- */
    #hitmarker {
        position: fixed; left: 50%; top: 50%; width: 26px; height: 26px;
        transform: translate(-50%,-50%) rotate(45deg);
        opacity: 0; transition: opacity .1s;
    }
    #hitmarker::before, #hitmarker::after {
        content: ''; position: absolute; background: #ff5a5a;
        box-shadow: 0 0 5px rgba(0,0,0,.9);
    }
    #hitmarker::before { width: 26px; height: 2px; top: 12px; left: 0; }
    #hitmarker::after  { width: 2px; height: 26px; left: 12px; top: 0; }
    #hitmarker.head::before, #hitmarker.head::after { background: #ffd34d; }
    #hitmarker.show { opacity: 1; }

    /* ---------- 受伤暗角 ---------- */
    #vignette {
        position: fixed; inset: 0; opacity: 0; transition: opacity .25s;
        background: radial-gradient(ellipse at center, rgba(160,0,0,0) 40%, rgba(190,0,0,.9) 100%);
    }
    #hurtFlash {
        position: fixed; inset: 0; opacity: 0;
        background: radial-gradient(ellipse at center, rgba(255,0,0,0) 30%, rgba(255,30,30,.55) 100%);
        transition: opacity .16s;
    }

    /* ---------- 小地图 ---------- */
    #minimapWrap {
        position: fixed; left: 18px; top: 18px; width: 190px; height: 190px;
        border-radius: 14px; overflow: hidden;
        border: 2px solid rgba(140,200,255,.28);
        box-shadow: 0 8px 28px rgba(0,0,0,.55), inset 0 0 30px rgba(0,0,0,.5);
        background: rgba(10,20,30,.8); backdrop-filter: blur(4px);
    }
    #minimap { width: 190px; height: 190px; display: block; }
    #mmLabel {
        position: absolute; left: 10px; bottom: 8px; font-size: 10px;
        color: rgba(180,220,255,.6); letter-spacing: 2px; font-weight: 700;
    }

    /* ---------- 击杀播报 ---------- */
    #killFeed {
        position: fixed; right: 20px; top: 74px; text-align: right;
        color: #fff; font-size: 14px; line-height: 1.9;
        text-shadow: 1px 1px 0 #000, 0 0 8px rgba(0,0,0,.7);
        min-width: 180px;
    }
    #killFeed .row {
        background: rgba(0,0,0,.42); padding: 4px 10px; border-radius: 6px;
        margin-bottom: 4px; display: inline-block; font-weight: 600;
        animation: feedIn .3s ease-out;
    }
    #killFeed .row b { color: #ffd34d; }
    #killFeed .row.head b { color: #ff7a5a; }
    @keyframes feedIn { from { opacity:0; transform: translateX(20px);} to {opacity:1; transform:none;} }

    /* ---------- 拾取提示 ---------- */
    #toastBox {
        position: fixed; left: 50%; top: 26%; transform: translateX(-50%);
        color: #fff; text-align: center; pointer-events: none; z-index: 70;
    }
    .toast {
        padding: 6px 16px; margin-bottom: 4px; border-radius: 6px;
        background: rgba(0,0,0,.55); font-weight: 700; font-size: 14px;
        letter-spacing: 1px; text-shadow: 1px 1px 0 #000;
        animation: toastUp 1.4s ease-out forwards;
        display: inline-block;
    }
    @keyframes toastUp {
        0%   { opacity: 0; transform: translateY(8px); }
        15%  { opacity: 1; transform: translateY(0); }
        78%  { opacity: 1; transform: translateY(-14px); }
        100% { opacity: 0; transform: translateY(-24px); }
    }

    /* ---------- 统计面板 ---------- */
    #stats {
        position: fixed; right: 20px; top: 20px; text-align: right;
        color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.9);
    }
    #stats .big { font-size: 34px; font-weight: 800; letter-spacing: 1px; color: #ffd34d; line-height: 1; }
    #stats .lbl { font-size: 11px; letter-spacing: 3px; opacity: .65; font-weight: 700; }
    #stats .sub { font-size: 13px; font-weight: 700; opacity: .9; margin-top: 4px; }
    #stats .sub span { color: #7fe8ff; }
    #stats .alive { font-size: 12px; font-weight: 700; opacity: .7; margin-top: 2px; }

    /* ---------- 生命 / 护甲 ---------- */
    #vitals { position: fixed; left: 22px; bottom: 24px; width: 270px; }
    .barRow { margin-bottom: 7px; }
    .barLabel {
        font-size: 10px; letter-spacing: 2px; font-weight: 800;
        color: rgba(255,255,255,.7); text-shadow: 1px 1px 0 #000; margin-bottom: 3px;
        display: flex; justify-content: space-between;
    }
    .barBg {
        height: 14px; background: rgba(0,0,0,.6); border-radius: 3px;
        border: 1.5px solid rgba(255,255,255,.22); overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .barFill { height: 100%; width: 100%; transition: width .16s ease-out, background .3s; }
    #healthFill { background: linear-gradient(90deg,#2fbf71,#7dff9e); }
    #armorFill  { background: linear-gradient(90deg,#3a8fd4,#7fc8ff); }

    /* ---------- 弹药 ---------- */
    #ammoBox {
        position: fixed; right: 24px; bottom: 20px; text-align: right;
        color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.9);
    }
    #ammoText { font-size: 42px; font-weight: 800; line-height: 1; letter-spacing: 1px; }
    #ammoText small { font-size: 20px; opacity: .55; font-weight: 700; }
    #ammoText.low { color: #ff6a4a; }
    #ammoText.melee { font-size: 28px; color: #ff9a4a; }
    #weaponName {
        font-size: 11px; letter-spacing: 3px; opacity: .65; font-weight: 800; margin-top: 4px;
    }
    #weaponSlots {
        position: fixed; right: 24px; bottom: 96px; display: flex; gap: 4px;
        flex-direction: column; align-items: flex-end;
    }
    .slot {
        font-size: 10px; font-weight: 800; letter-spacing: 1px;
        padding: 1px 7px; border-radius: 3px; color: rgba(255,255,255,.35);
        background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08);
        text-shadow: 1px 1px 0 #000; transition: all .15s;
    }
    .slot.on {
        color: #111; background: #ffd34d; border-color: #ffd34d;
        box-shadow: 0 0 12px rgba(255,211,77,.55);
    }
    .slot.meleeSlot { color: rgba(255,150,80,.5); }
    .slot.meleeSlot.on { color: #111; background: #ff9a4a; border-color: #ff9a4a; }
    .slot.rareSlot { color: rgba(255,215,110,.6); }
    .slot.rareSlot.on { color: #111; background: linear-gradient(90deg,#ffd34d,#ffae2e); border-color: #ffd34d; }
    .slot.goldSlot { color: rgba(255,215,110,.75); }
    .slot.goldSlot.on { color: #111; background: linear-gradient(90deg,#ffe680,#e0a020); border-color: #ffd34d; }
    #reloadBar {
        position: fixed; left: 50%; top: 60%; transform: translateX(-50%);
        width: 160px; height: 5px; background: rgba(0,0,0,.6);
        border-radius: 3px; overflow: hidden; opacity: 0; transition: opacity .2s;
    }
    #reloadBar i { display: block; height: 100%; width: 0; background: #ffd34d; }

    /* ---------- 伤害飘字 ---------- */
    .dmgNum {
        position: fixed; font-weight: 900; font-size: 19px; color: #fff;
        text-shadow: 2px 2px 0 #000, 0 0 10px rgba(255,80,60,.9);
        pointer-events: none; z-index: 60; transform: translate(-50%,-50%);
        animation: dmgUp .75s ease-out forwards;
    }
    .dmgNum.head { color: #ffd34d; font-size: 25px; }
    .dmgNum.melee { color: #ff9a4a; font-size: 23px; }
    @keyframes dmgUp {
        0%   { opacity: 1; transform: translate(-50%,-50%) scale(1.4); }
        100% { opacity: 0; transform: translate(-50%,-160%) scale(.85); }
    }

    /* ---------- 死亡界面 ---------- */
    #deathScreen {
        position: fixed; inset: 0; z-index: 120; display: none;
        flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(60,0,0,.55), rgba(10,0,0,.92));
        color: #fff; text-align: center; backdrop-filter: blur(2px);
    }
    #deathScreen h2 {
        font-size: 56px; margin: 0; letter-spacing: 10px; color: #ff4a4a;
        text-shadow: 0 0 40px rgba(255,50,50,.7), 3px 3px 0 #000;
    }
    #deathScreen p { font-size: 15px; letter-spacing: 3px; opacity: .8; margin-top: 16px; }
    #respawnCount { color: #ffd34d; font-weight: 800; font-size: 20px; }

    /* ---------- 加载提示 ---------- */
    #loadTip {
        position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%);
        color: #9fd8ff; font-size: 13px; letter-spacing: 2px; font-weight: 700;
        text-shadow: 1px 1px 0 #000; z-index: 90; opacity: 0; transition: opacity .4s;
    }

    /* ---------- 返回按钮 ---------- */
    #backBtn {
        position: fixed; top: 18px; right: 20px; z-index: 200;
        padding: 9px 16px; background: rgba(0,0,0,.55); color: #fff;
        border: 1px solid rgba(255,255,255,.15); border-radius: 9px;
        cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
        backdrop-filter: blur(8px); transition: background .2s;
    }
    #backBtn:hover { background: rgba(0,0,0,.85); }

    /* ---------- 开始遮罩 ---------- */
    #startOverlay {
        position: fixed; inset: 0; z-index: 150; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(12,30,50,.78), rgba(3,8,15,.96));
        color: #fff; cursor: pointer; backdrop-filter: blur(4px);
        transition: opacity .3s;
    }
    #startOverlay.hidden { display: none; }
    #startOverlay h1 {
        font-size: 58px; margin: 0; letter-spacing: 12px; font-weight: 900;
        text-shadow: 0 0 40px rgba(120,200,255,.8), 4px 4px 0 #000;
        background: linear-gradient(180deg,#fff,#8fd0ff);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    #startOverlay .sub {
        font-size: 13px; letter-spacing: 10px; opacity: .55; margin: 10px 0 40px;
        font-weight: 700;
    }
    #startOverlay .btn {
        padding: 15px 56px; border: 2px solid rgba(140,220,255,.7);
        border-radius: 12px; font-size: 19px; font-weight: 800; letter-spacing: 5px;
        background: rgba(50,140,220,.18); box-shadow: 0 0 34px rgba(90,190,255,.35);
        animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse { 0%,100% { opacity:.72; } 50% { opacity:1; } }
    #startOverlay .keys {
        margin-top: 40px; font-size: 13px; opacity: .68; line-height: 2.2; text-align: center;
    }
    #startOverlay .keys b {
        display: inline-block; background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.22); border-radius: 5px;
        padding: 2px 9px; margin: 0 3px; font-weight: 700;
    }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<body>

<div id="hud">
    <div id="crosshair">
        <div class="ch t"></div><div class="ch b"></div>
        <div class="ch l"></div><div class="ch r"></div>
        <div class="dot"></div>
    </div>
    <div id="hitmarker"></div>
    <div id="hurtFlash"></div>
    <div id="vignette"></div>
    <div id="meleeShield"></div>

    <div id="scopeOverlay">
        <div class="ring"></div>
        <div class="cross-h"></div>
        <div class="cross-v"></div>

    <div id="minimapWrap">

            <div class="barLabel"><span>生命</span><span id="hpNum">100</span></div>
            <div class="barBg"><div class="barFill" id="healthFill"></div></div>
        </div>
        <div class="barRow">
            <div class="barLabel"><span>护甲</span><span id="apNum">0</span></div>
            <div class="barBg"><div class="barFill" id="armorFill" style="width:0%"></div></div>
        </div>
    </div>

    <div id="weaponSlots"></div>

    <div id="ammoBox">
        <div id="ammoText">30<small>/∞</small></div>

        <div><b>W A S D</b> 移动 · <b>Shift</b> 冲刺 · <b>空格</b> 跳跃</div>
        <div><b>鼠标</b> 瞄准 · <b>左键</b> 射击/连斩 · <b>左键长按</b> 蓄力剑气 · <b>右键</b> 机瞄/重击突刺</div>
        <div><b>R</b> 换弹 · <b>滚轮/1-7</b> 切换武器 · 手雷无限 · 敌人掉落加特林与黄金枪</div>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';

/* ============================================================
   0. 宿主通信
   ============================================================ */
let active3d = true;
window.addEventListener('message', e => {
    if (!e.data) return;
    if (e.data.type === 'activate')   active3d = true;
    if (e.data.type === 'deactivate') active3d = false;
});
document.getElementById('backBtn').addEventListener('click', () => {
    if (document.pointerLockElement) document.exitPointerLock();
    parent.postMessage({ type: 'navigate', to: 'home' }, '*');
});

/* ============================================================
   1. 场景 / 相机 / 渲染器 / 天空
   ============================================================ */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc4dff5, 170, 720);

const camera = new THREE.PerspectiveCamera(76, innerWidth / innerHeight, 0.05, 3000);
camera.rotation.order = 'YXZ';
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

(function buildSky() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0.00, '#1b4a86');
    g.addColorStop(0.34, '#4e8cc9');
    g.addColorStop(0.55, '#8fc0e8');
    g.addColorStop(0.72, '#c9e3f5');
    g.addColorStop(0.88, '#eaf5fd');
    g.addColorStop(1.00, '#f7fbfe');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 512);
    for (let i = 0; i < 55; i++) {
        const cx = Math.random() * 1024;
        const cy = 40 + Math.random() * 220;
        const r = 18 + Math.random() * 62;
        const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        const a = 0.35 + Math.random() * 0.45;
        grd.addColorStop(0, `rgba(255,255,255,${a})`);
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    scene.background = tex;
})();

/* ============================================================
   2. 光照
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xd6ebff, 0x5a7344, 1.15);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d6, 2.1);
sun.position.set(80, 140, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SHADOW_RANGE = 100;
sun.shadow.camera.left   = -SHADOW_RANGE;
sun.shadow.camera.right  =  SHADOW_RANGE;
sun.shadow.camera.top    =  SHADOW_RANGE;
sun.shadow.camera.bottom = -SHADOW_RANGE;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 460;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.025;
scene.add(sun);
scene.add(sun.target);

/* ============================================================
   3. 确定性随机
   ============================================================ */
let _rng = 0x1f2e3d4c;
function rand() {
    _rng = (_rng * 1103515245 + 12345) & 0x7fffffff;
    return _rng / 0x7fffffff;
}
function rr(a, b) { return a + rand() * (b - a); }

/* ============================================================
   4. 纹理与材质
   ============================================================ */
function makeBlockTexture(hex, variance, size = 64, cells = 8) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const cell = size / cells;
    const base = new THREE.Color(hex);
    const R = base.r * 255, G = base.g * 255, B = base.b * 255;
    for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
            const v = 1 + (Math.random() - 0.5) * variance;
            ctx.fillStyle = `rgb(${Math.min(255, R * v) | 0},${Math.min(255, G * v) | 0},${Math.min(255, B * v) | 0})`;
            ctx.fillRect(x * cell, y * cell, cell, cell);
        }
    }
    for (let i = 0; i < size * size * 0.25; i++) {
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.12})`;
        ctx.fillRect(Math.random() * size | 0, Math.random() * size | 0, 1, 1);
    }
    const t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
}

/* ============================================================
   5. 碰撞体空间网格
   ============================================================ */
const CELL = 16;
const grid = new Map();
const colliders = [];
const worldMeshes = [];
let _qid = 0;
const _qA = [], _qB = [], _qC = [];

function addColliderBox(minX, minY, minZ, maxX, maxY, maxZ) {
    const box = new THREE.Box3(
        new THREE.Vector3(minX, minY, minZ),
        new THREE.Vector3(maxX, maxY, maxZ)
    );
    colliders.push(box);
    const x0 = Math.floor(minX / CELL), x1 = Math.floor(maxX / CELL);
    const z0 = Math.floor(minZ / CELL), z1 = Math.floor(maxZ / CELL);
    for (let gx = x0; gx <= x1; gx++) {
        for (let gz = z0; gz <= z1; gz++) {
            const key = gx + ',' + gz;
            let arr = grid.get(key);
            if (!arr) { arr = []; grid.set(key, arr); }
            arr.push(box);
        }
    }
    return box;
}

function gatherColliders(minX, minZ, maxX, maxZ, out) {
    out.length = 0;
    _qid++;
    const x0 = Math.floor(minX / CELL), x1 = Math.floor(maxX / CELL);
    const z0 = Math.floor(minZ / CELL), z1 = Math.floor(maxZ / CELL);
    for (let gx = x0; gx <= x1; gx++) {
        for (let gz = z0; gz <= z1; gz++) {
            const arr = grid.get(gx + ',' + gz);
            if (!arr) continue;
            for (let i = 0; i < arr.length; i++) {
                const b = arr[i];
                if (b._q !== _qid) { b._q = _qid; out.push(b); }
            }
        }
    }
    return out;
}

function pointBlocked(x, y, z, r) {
    const boxes = gatherColliders(x - r, z - r, x + r, z + r, _qC);
    for (let i = 0; i < boxes.length; i++) {
        const c = boxes[i];
        if (x + r > c.min.x && x - r < c.max.x &&
            z + r > c.min.z && z - r < c.max.z &&
            y + r > c.min.y && y - r < c.max.y) return true;
    }
    return false;
}

/* ============================================================
   6. 方块构建工具
   ============================================================ */
const _geoCache = new Map();
function boxGeo(w, h, d) {
    const key = w.toFixed(3) + '|' + h.toFixed(3) + '|' + d.toFixed(3);
    let g = _geoCache.get(key);
    if (!g) { g = new THREE.BoxGeometry(w, h, d); _geoCache.set(key, g); }
    return g;
}
const _cylCache = new Map();
function cylGeo(rt, rb, h, seg) {
    const key = rt.toFixed(3) + '|' + rb.toFixed(3) + '|' + h.toFixed(3) + '|' + seg;
    let g = _cylCache.get(key);
    if (!g) { g = new THREE.CylinderGeometry(rt, rb, h, seg); _cylCache.set(key, g); }
    return g;
}

function addBox(w, h, d, x, baseY, z, mat, opts = {}) {
    const mesh = new THREE.Mesh(boxGeo(w, h, d), mat);
    mesh.position.set(x, baseY + h / 2, z);
    mesh.castShadow    = opts.noShadow ? false : true;
    mesh.receiveShadow = true;
    if (opts.rotY) mesh.rotation.y = opts.rotY;
    scene.add(mesh);
    if (opts.collide !== false) {
        const c = Math.abs(Math.cos(opts.rotY || 0)), s = Math.abs(Math.sin(opts.rotY || 0));
        const bw = w * c + d * s, bd = w * s + d * c;
        addColliderBox(x - bw / 2, baseY, z - bd / 2, x + bw / 2, baseY + h, z + bd / 2);
        worldMeshes.push(mesh);
    }
    return mesh;
}

function addDeco(w, h, d, x, baseY, z, mat) {
    return addBox(w, h, d, x, baseY, z, mat, { collide: false });
}

function addCyl(rt, rb, h, x, baseY, z, mat, seg = 12) {
    const mesh = new THREE.Mesh(cylGeo(rt, rb, h, seg), mat);
    mesh.position.set(x, baseY + h / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    const r = Math.max(rt, rb);
    addColliderBox(x - r, baseY, z - r, x + r, baseY + h, z + r);
    worldMeshes.push(mesh);
    return mesh;
}

function buildHouse(cx, cz, w, d, h, wallMat, roofMat) {
    const t = 0.55;
    const hw = w / 2, hd = d / 2;
    const doorW = 3.0, doorH = 3.4;

    addBox(w, h, t, cx, 0, cz - hd + t / 2, wallMat);
    const segW = (w - doorW) / 2;
    addBox(segW, h, t, cx - hw + segW / 2, 0, cz + hd - t / 2, wallMat);
    addBox(segW, h, t, cx + hw - segW / 2, 0, cz + hd - t / 2, wallMat);
    addBox(doorW, h - doorH, t, cx, doorH, cz + hd - t / 2, wallMat);
    addBox(t, h, d, cx - hw + t / 2, 0, cz, wallMat);
    addBox(t, h, d, cx + hw - t / 2, 0, cz, wallMat);

    const winMat = new THREE.MeshStandardMaterial({ color: 0x2c3f52, roughness: .3, metalness: .3 });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0xd8dde3, roughness: .8 });
    for (let i = -1; i <= 1; i += 2) {
        for (const side of [-1, 1]) {
            const zz = cz + side * (hd - t / 2) - side * 0.04;
            addDeco(1.6, 1.8, 0.12, cx + i * w * 0.26, h * 0.45, zz, winMat);
            addDeco(1.86, 0.12, 0.16, cx + i * w * 0.26, h * 0.45 + 1.8, zz, frameMat);
            addDeco(1.86, 0.12, 0.16, cx + i * w * 0.26, h * 0.45 - 0.06, zz, frameMat);
            addDeco(0.12, 1.92, 0.16, cx + i * w * 0.26 - 0.86, h * 0.45, zz, frameMat);
            addDeco(0.12, 1.92, 0.16, cx + i * w * 0.26 + 0.86, h * 0.45, zz, frameMat);
            addDeco(0.10, 1.8, 0.18, cx + i * w * 0.26, h * 0.45, zz, frameMat);
        }
    }

    addBox(w + 1.4, 0.55, d + 1.4, cx, h, cz, roofMat);
    addBox(w + 1.5, 0.45, 0.35, cx, h + 0.55, cz - hd - 0.7, roofMat);
    addBox(w + 1.5, 0.45, 0.35, cx, h + 0.55, cz + hd + 0.7, roofMat);

    if (w > 13 && d > 11) {
        addBox(2.2, 1.6, 2.2, cx - w * 0.2, 0, cz - d * 0.16, M.crate);
        addBox(1.6, 2.4, 1.6, cx + w * 0.24, 0, cz + d * 0.2, M.metal);
    }
    addBox(3.4, 1.1, 1.2, cx, 0, cz + hd + 1.4, M.sandbag);
}

function buildTower(cx, cz, size, height) {
    const t = 0.8, hs = size / 2;
    const corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
    for (const [sx, sz] of corners) {
        addBox(t, height, t, cx + sx * (hs - t / 2), 0, cz + sz * (hs - t / 2), M.plank);
    }
    addBox(size + 1.2, 0.45, size + 1.2, cx, height, cz, M.plank);
    addBox(size + 1.2, 1.1, 0.3, cx, height + 0.45, cz - hs - 0.45, M.wood);
    addBox(size + 1.2, 1.1, 0.3, cx, height + 0.45, cz + hs + 0.45, M.wood);
    addBox(0.3, 1.1, size + 1.2, cx - hs - 0.45, height + 0.45, cz, M.wood);
    addBox(0.3, 1.1, size + 1.2, cx + hs + 0.45, height + 0.45, cz, M.wood);
    addBox(size + 2.0, 0.4, size + 2.0, cx, height + 4.2, cz, M.roof);

    const steps = Math.ceil(height / 0.55) + 1;
    for (let i = 0; i < steps; i++) {
        const ang = (i / steps) * Math.PI * 1.4;
        const r = hs + 2.2;
        addBox(2.2, 0.55, 1.6, cx + Math.cos(ang) * r, i * 0.55, cz + Math.sin(ang) * r, M.stone);
    }
}

    addBox(w * 0.22, h, t, cx - hw + w * 0.11, 0, cz + hd - t / 2, M.concrete);
    addBox(w * 0.22, h, t, cx + hw - w * 0.11, 0, cz + hd - t / 2, M.concrete);
    addBox(w * 0.56, h - 4.6, t, cx, 4.6, cz + hd - t / 2, M.concrete);

function buildFence(x, z, len, alongZ) {
    const n = Math.max(2, Math.round(len / 3.2));
    for (let i = 0; i <= n; i++) {
        const p = -len / 2 + (i / n) * len;
        const px = alongZ ? x : x + p;
        const pz = alongZ ? z + p : z;
        addBox(0.16, 2.4, 0.16, px, 0, pz, M.metal);
    }
    for (const hy of [0.32, 2.12]) {
        addBox(alongZ ? 0.09 : len, 0.09, alongZ ? len : 0.09, x, hy, z, M.metal, { collide: false });
    }
    const bars = n * 4;
    for (let i = 0; i < bars; i++) {
        const p = -len / 2 + (i + 0.5) * (len / bars);
        const px = alongZ ? x : x + p;
        const pz = alongZ ? z + p : z;
        addBox(0.045, 1.85, 0.045, px, 0.28, pz, M.metal, { collide: false });
    }
}

const wireMat = new THREE.LineBasicMaterial({ color: 0x1c2228, transparent: true, opacity: 0.75 });
function addWire(ax, ay, az, bx, by, bz, sag) {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
        const t = i / 8;
        pts.push(new THREE.Vector3(
            ax + (bx - ax) * t,
            ay + (by - ay) * t - Math.sin(t * Math.PI) * sag,
            az + (bz - az) * t
        ));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    scene.add(new THREE.Line(geo, wireMat));
}

    const ctx = c.getContext('2d');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, 256, 128);
    ctx.strokeStyle = fg; ctx.lineWidth = 6;
    ctx.strokeRect(9, 9, 238, 110);
    ctx.fillStyle = fg;
    ctx.font = 'bold 52px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 68);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
}

function buildWatchTower(cx, cz) {
    const H = 12, S = 6, t = 0.5;
    for (const [sx, sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
        addBox(t, H, t, cx + sx * (S/2 - t/2), 0, cz + sz * (S/2 - t/2), M.wood);
    }
    addBox(S + 1, 0.5, S + 1, cx, H, cz, M.plank);
    addBox(S + 1, 1.2, 0.3, cx, H + 0.5, cz - S/2 - 0.35, M.plank);
    addBox(S + 1, 1.2, 0.3, cx, H + 0.5, cz + S/2 + 0.35, M.plank);
    addBox(0.3, 1.2, S + 1, cx - S/2 - 0.35, H + 0.5, cz, M.plank);
    addBox(0.3, 1.2, S + 1, cx + S/2 + 0.35, H + 0.5, cz, M.plank);
    addBox(S + 2, 0.4, S + 2, cx, H + 5, cz, M.roof);
    for (const [sx, sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
        addBox(0.35, 5, 0.35, cx + sx * (S/2 - 0.2), H + 0.5, cz + sz * (S/2 - 0.2), M.wood);
    }
    const steps = Math.ceil(H / 0.55) + 2;
    for (let i = 0; i < steps; i++) {
        const ang = (i / steps) * Math.PI * 1.6;
        const r = S/2 + 1.4;
        addBox(2.0, 0.55, 1.6, cx + Math.cos(ang) * r, i * 0.55, cz + Math.sin(ang) * r, M.plank);
    }
}

function buildWreck(x, z, rotY) {
    const bodyMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(rand() * 0.15 + 0.02, 0.32, 0.35),
        roughness: .95, metalness: .15
    });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x1a2630, roughness: .3, metalness: .4 });
    const parts = [
        [5.2, 1.2, 2.4,  0, 0.7, 0, bodyMat],
        [2.4, 1.4, 2.0,  0.4, 1.9, 0, bodyMat],
        [1.5, 0.7, 1.7,  0.3, 2.4, 0, glassMat],
        [0.4, 0.9, 2.3, -2.4, 0.7, 0, bodyMat],
        [0.7, 0.7, 2.2,  2.6, 0.7, 0, bodyMat],
    ];
    const cosR = Math.cos(rotY), sinR = Math.sin(rotY);
    for (const [w, h, d, ox, baseY, oz, mat] of parts) {
        const rx = x + ox * cosR - oz * sinR;
        const rz = z + ox * sinR + oz * cosR;
        addBox(w, h, d, rx, baseY, rz, mat, { collide: true });
    }
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1 });
    for (const [wx, wz] of [[-1.5, 1.1], [1.5, 1.1], [-1.5, -1.1], [1.5, -1.1]]) {
        const rx = x + wx * cosR - wz * sinR;
        const rz = z + wx * sinR + wz * cosR;
        const wheel = new THREE.Mesh(cylGeo(0.55, 0.55, 0.4, 12), wheelMat);
        wheel.position.set(rx, 0.55, rz);
        wheel.rotation.z = Math.PI / 2;
        wheel.rotation.y = rotY;
        wheel.castShadow = true;
        scene.add(wheel);
    }
}

        const mat = mountainMats[i % 3];
        const m = new THREE.Mesh(new THREE.ConeGeometry(w, h, 5), mat);
        m.position.set(Math.cos(a) * r, h * 0.4 - 12, Math.sin(a) * r);
        m.rotation.y = rand() * Math.PI;
        m.castShadow = false;
        m.receiveShadow = false;
        scene.add(m);
    }

    // 草丛（InstancedMesh）
    const bladeGeo = new THREE.BoxGeometry(0.055, 1, 0.055);
    bladeGeo.translate(0, 0.5, 0);
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0x5d8c3e, roughness: 1 });
    const N = 1500;
    const inst = new THREE.InstancedMesh(bladeGeo, bladeMat, N);
    inst.receiveShadow = true;
    const dummy = new THREE.Object3D();
    let placed = 0, guard = 0;
    while (placed < N && guard < N * 5) {
        guard++;
        const a = rand() * Math.PI * 2;
        const r = 8 + Math.sqrt(rand()) * 260;
        const x = Math.cos(a) * r, z = Math.sin(a) * r;

        dummy.scale.set(1, rr(0.25, 0.62), 1);
        dummy.updateMatrix();
        inst.setMatrixAt(placed, dummy.matrix);
        placed++;
    }
    inst.count = placed;
    scene.add(inst);

    // 野花
    const flowerGeo = new THREE.SphereGeometry(0.07, 5, 4);
    const flowerMatA = new THREE.MeshStandardMaterial({ color: 0xffd95a, roughness: 0.85 });
    const flowerMatB = new THREE.MeshStandardMaterial({ color: 0xff7d9a, roughness: 0.85 });
    const FA = new THREE.InstancedMesh(flowerGeo, flowerMatA, 280);
    const FB = new THREE.InstancedMesh(flowerGeo, flowerMatB, 280);
    for (let i = 0; i < 280; i++) {
        const a = rand() * Math.PI * 2;
        const r = 12 + Math.sqrt(rand()) * 200;
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        const hide = (Math.abs(x) < 8.5 && Math.abs(z) < 190);
        dummy.position.set(x, rr(0.1, 0.3), z);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(hide ? 0 : rr(0.7, 1.4));
        dummy.updateMatrix();
        FA.setMatrixAt(i, dummy.matrix);
        dummy.position.x += rr(-0.5, 0.5);
        dummy.position.z += rr(-0.5, 0.5);
        dummy.updateMatrix();
        FB.setMatrixAt(i, dummy.matrix);
    }
    scene.add(FA, FB);
})();

const pickups = [];
const PICKUP_RESPAWN = 20;
const PICKUP_RADIUS_SQ = 4.8 * 4.8;

function buildDropModel(type) {
    const group = new THREE.Group();

    if (type === 'health') {
        const mat = new THREE.MeshStandardMaterial({
            color: 0xf2f4f6, roughness: .6, emissive: 0x224433, emissiveIntensity: .35
        });
        const crossMat = new THREE.MeshStandardMaterial({
            color: 0xff3a3a, emissive: 0x881111, emissiveIntensity: .7
        });
        group.add(new THREE.Mesh(boxGeo(1.0, 1.0, 1.0), mat));
        const c1 = new THREE.Mesh(boxGeo(0.72, 0.22, 0.24), crossMat); c1.position.z = 0.52;
        const c2 = new THREE.Mesh(boxGeo(0.22, 0.72, 0.24), crossMat); c2.position.z = 0.52;
        group.add(c1, c2);
        const glow = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 6),
            new THREE.MeshBasicMaterial({ color: 0x66ff88, transparent: true, opacity: .16, depthWrite: false }));
        group.add(glow);
        group.scale.setScalar(0.55);
    } else if (type === 'ammo') {
        const mat = new THREE.MeshStandardMaterial({
            color: 0x7d5a2e, roughness: .9, emissive: 0x332200, emissiveIntensity: .4
        });
        const cap = new THREE.MeshStandardMaterial({ color: 0xffd34d, emissive: 0x665500, emissiveIntensity: .8 });
        group.add(new THREE.Mesh(boxGeo(1.1, 0.7, 0.8), mat));
        const band = new THREE.Mesh(boxGeo(1.13, 0.18, 0.83), cap);
        band.position.y = 0.08;
        group.add(band);
        const glow = new THREE.Mesh(new THREE.SphereGeometry(0.85, 8, 6),
            new THREE.MeshBasicMaterial({ color: 0xffdd44, transparent: true, opacity: .14, depthWrite: false }));
        group.add(glow);
        group.scale.setScalar(0.55);
    } else {
        const isGold = type === 'golden';
        const mainMat = isGold ? MAT.gold : MAT.darkSteel;
        const accMat  = isGold ? MAT.goldDark : MAT.steel;

        if (isGold) {
            group.add(new THREE.Mesh(boxGeo(0.95, 0.24, 0.20), mainMat));
            const barrel = new THREE.Mesh(cylGeo(0.075, 0.075, 0.34, 10), mainMat);
            barrel.rotation.z = Math.PI / 2;
            barrel.position.set(-0.55, 0.02, 0);
            group.add(barrel);
            const grip = new THREE.Mesh(boxGeo(0.24, 0.42, 0.18), mainMat);
            grip.position.set(0.28, -0.28, 0);
            grip.rotation.z = 0.25;
            group.add(grip);
            const sight = new THREE.Mesh(boxGeo(0.10, 0.08, 0.12), accMat);
            sight.position.set(-0.18, 0.17, 0);
            group.add(sight);
        } else {
            group.add(new THREE.Mesh(boxGeo(0.7, 0.34, 0.36), mainMat));
            for (let i = 0; i < 6; i++) {
                const a = i / 6 * Math.PI * 2;
                const b = new THREE.Mesh(cylGeo(0.045, 0.045, 0.9, 8), accMat);
                b.rotation.z = Math.PI / 2;
                b.position.set(-0.72, Math.cos(a) * 0.11, Math.sin(a) * 0.11);
                group.add(b);
            }
            const box = new THREE.Mesh(boxGeo(0.32, 0.44, 0.42), MAT.polymer);
            box.position.set(0.22, -0.26, 0);
            group.add(box);
        }

        const glow = new THREE.Mesh(new THREE.SphereGeometry(1.1, 10, 8),
            new THREE.MeshBasicMaterial({
                color: isGold ? 0xffd34d : 0x7fd8ff, transparent: true, opacity: .18, depthWrite: false
            }));
        group.add(glow);
        group.scale.setScalar(0.62);
    }

    group.traverse(o => { if (o.isMesh) o.castShadow = true; });
    return group;
}

function createPickup(type, x, z) {
    const group = buildDropModel(type);
    group.position.set(x, type === 'health' || type === 'ammo' ? 0.85 : 1.05, z);
    scene.add(group);
    const noRespawn = (type === 'gatling' || type === 'golden');
    pickups.push({
        type, group, active: true, timer: 0,
        baseY: group.position.y, spin: rand() * 6.28, noRespawn
    });
}

let actx = null, noiseBuffer = null;

function initAudio() {
    if (actx) return;
    try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const len = Math.floor(actx.sampleRate * 0.4);
        noiseBuffer = actx.createBuffer(1, len, actx.sampleRate);
        const d = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
}

function playNoise(dur, filterFreq, vol) {
    if (!actx || !noiseBuffer) return;
    const t = actx.currentTime;
    const src = actx.createBufferSource();
    src.buffer = noiseBuffer;
    const flt = actx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(filterFreq, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(80, filterFreq * 0.25), t + dur);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt).connect(gain).connect(actx.destination);
    src.start(t);
    src.stop(t + dur + 0.02);
}

function playTone(freqStart, freqEnd, dur, vol, type = 'sine') {
    if (!actx) return;
    const t = actx.currentTime;
    const osc = actx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
}

const SFX = {
    shoot(weapon) {
        const id = weapon.id;
        if (id === 'sniper')        { playNoise(0.18, 3400, 0.38); playTone(210, 55, 0.16, 0.28, 'sine'); }

        });

        });
        const puff = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 6), m);
        puff.position.copy(pos).add(new THREE.Vector3(rr(-1.4, 1.4), rr(0, 1.6), rr(-1.4, 1.4)));
        scene.add(puff);
        effects.push({
            mesh: puff, life: rr(0.7, 1.3), maxLife: 1.3, type: 'smoke',
            vel: new THREE.Vector3(rr(-1.5, 1.5), rr(1.2, 3), rr(-1.5, 1.5))
        });
    }

    scene.add(light);
    effects.push({ mesh: light, life: 0.3, maxLife: 0.3, type: 'light' });

function updateEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
        const f = effects[i];
        f.life -= dt;
        if (f.life <= 0) {
            scene.remove(f.mesh);
            if (f.type !== 'light') {
                if (f.mesh.geometry !== tracerGeo) f.mesh.geometry.dispose();
                if (f.mesh.material && f.mesh.material.dispose) f.mesh.material.dispose();
            }
            effects.splice(i, 1);
            continue;
        }
        const k = f.life / f.maxLife;

        if (f.type === 'light') {
            f.mesh.intensity = 12 * k;
        } else if (f.type === 'blast') {
            f.mesh.material.opacity = k * 0.95;
            f.mesh.scale.setScalar(1 + (1 - k) * 5.5);
        } else if (f.type === 'shockwave') {
            f.mesh.material.opacity = k * 0.8;
            f.mesh.scale.setScalar(1 + (1 - k) * 9);
        } else if (f.type === 'smoke') {
            f.mesh.material.opacity = k * 0.45;
            f.mesh.scale.setScalar(1 + (1 - k) * 2.2);
            if (f.vel) { f.mesh.position.addScaledVector(f.vel, dt); f.vel.multiplyScalar(0.96); }
        } else {
            if (f.mesh.material) f.mesh.material.opacity = k;
            if (f.type === 'impact') {
                f.mesh.scale.setScalar(1 + (1 - k) * 3.5);
            } else if (f.type === 'debris') {
                f.vel.y -= 24 * dt;
                f.mesh.position.addScaledVector(f.vel, dt);
                f.mesh.rotation.x += dt * 9;
                f.mesh.rotation.y += dt * 7;
            }
        }
    }
}

function collidesAt(pos, radius, stepH) {
    const sh = stepH === undefined ? STEP_HEIGHT : stepH;
    const y0 = pos.y + sh;
    const y1 = pos.y + PLAYER_HEIGHT;
    const boxes = gatherColliders(pos.x - radius, pos.z - radius, pos.x + radius, pos.z + radius, _qA);
    for (let i = 0; i < boxes.length; i++) {
        const c = boxes[i];
        if (pos.x + radius > c.min.x && pos.x - radius < c.max.x &&
            pos.z + radius > c.min.z && pos.z - radius < c.max.z &&
            y0 < c.max.y && y1 > c.min.y) return true;
    }
    return false;
}

function groundHeightAt(x, z, feetY, radius) {
    const r = radius === undefined ? PLAYER_RADIUS : radius;
    let best = 0;
    const boxes = gatherColliders(x - r, z - r, x + r, z + r, _qB);
    for (let i = 0; i < boxes.length; i++) {
        const c = boxes[i];
        if (x + r > c.min.x && x - r < c.max.x &&
            z + r > c.min.z && z - r < c.max.z) {
            if (c.max.y <= feetY + STEP_HEIGHT + 0.05 && c.max.y > best) best = c.max.y;
        }
    }
    return best;
}

const fbxLoader = new FBXLoader();

const animClips = {};
let modelReady = false;
const loadTipEl = document.getElementById('loadTip');

function loadFbx(url) {
    return new Promise((resolve, reject) => {
        fbxLoader.load(url, resolve, undefined, reject);
    });
}

async function loadAssets() {
    loadTipEl.style.opacity = 1;
    try {
        const walkFbx = await loadFbx('walk.fbx');
        enemyModelSource = walkFbx;
        if (walkFbx.animations && walkFbx.animations.length > 0) {
            animClips.walk = walkFbx.animations[0];
        }
    } catch (e) {
        console.warn('[Block Ops] walk.fbx 加载失败，将使用方块人兜底：', e);
    }

    const list = [
        ['jump.fbx', 'jump'],
        ['jump_forward.fbx', 'jump_forward'],
        ['dance.fbx', 'dance'],
        ['sprint.fbx', 'sprint'],
        ['fall.fbx', 'fall'],
    ];
    await Promise.all(list.map(async ([url, name]) => {
        try {
            const fbx = await loadFbx(url);
            if (fbx.animations && fbx.animations.length > 0) {
                animClips[name] = fbx.animations[0];
            }
        } catch (e) { /* 忽略 */ }
    }));

    modelReady = true;

    const total = ENEMY_TARGET;
    let spawned = 0;
    let guard = 0;
    while (spawned < total && guard < total * 3) {
        guard++;
        if (createEnemy()) spawned++;
        if (spawned % 8 === 0) {
            loadTipEl.textContent = `正在生成敌人... ${spawned}/${total}`;
            await new Promise(r => setTimeout(r, 0));
        }
    }
    loadTipEl.style.opacity = 0;
}

function findSpawnPoint(minDistFromPlayer = 26) {
    for (let i = 0; i < 260; i++) {
        const a = rand() * Math.PI * 2;
        const r = 32 + rand() * 160;
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        const dx = x - player.pos.x, dz = z - player.pos.z;
        if (dx * dx + dz * dz < minDistFromPlayer * minDistFromPlayer) continue;
        const boxes = gatherColliders(x - 1.2, z - 1.2, x + 1.2, z + 1.2, _qA);
        let blocked = false;
        for (const b of boxes) {
            if (b.max.y > 0.3 && b.min.y < 2.0) { blocked = true; break; }
        }
        if (!blocked) return new THREE.Vector3(x, 0, z);
    }
    return new THREE.Vector3(rr(-100, 100), 0, rr(-100, 100));
}

function enemyPlayAnim(e, name, fade = 0.2, force = false) {
    const a = e.actions[name];
    if (!a) return false;
    if (!force && e.animState === name && e.currentAction === a) return true;

    const isOnce = ['jump', 'jump_forward', 'fall'].includes(name);

    a.reset();
    a.paused = false;
    a.setEffectiveWeight(1);
    a.timeScale = (name === 'sprint') ? 1.3 : 1.0;
    a.play();

    if (e.currentAction && e.currentAction !== a) {
        e.currentAction.crossFadeTo(a, fade, false);
    }
    e.currentAction = a;
    e.animState = name;
    e.isOnceAnim = isOnce;
    return true;
}

function buildFallbackModel() {
    const g = new THREE.Group();
    const mats = [];
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a5f8a, roughness: .9 });
    const headMat = new THREE.MeshStandardMaterial({ color: 0xd9ac86, roughness: .9 });
    const legMat  = new THREE.MeshStandardMaterial({ color: 0x2b3038, roughness: .95 });
    mats.push(bodyMat, headMat, legMat);

    const parts = [
        [0.24, 0.90, 0.26, -0.17, 0.45, 0, legMat],
        [0.24, 0.90, 0.26,  0.17, 0.45, 0, legMat],
        [0.74, 0.86, 0.44,  0,    1.31, 0, bodyMat],
        [0.46, 0.46, 0.46,  0,    1.97, 0, headMat],
        [0.21, 0.80, 0.23, -0.47, 1.33, 0, bodyMat],
        [0.21, 0.80, 0.23,  0.47, 1.33, 0, bodyMat],
    ];
    const hitMeshes = [];
    for (const [w, h, d, x, y, z, mat] of parts) {
        const m = new THREE.Mesh(boxGeo(w, h, d), mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        g.add(m);
        hitMeshes.push(m);
    }
    return { model: g, mats, hitMeshes };
}

function createEnemy() {
    if (!modelReady) return null;

    const group = new THREE.Group();
    let mixer = null;
    const actions = {};
    const hitMeshes = [];
    const baseMats = [];

    if (enemyModelSource) {
        const model = cloneSkeleton(enemyModelSource);

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const s = ENEMY_HEIGHT / (size.y || 1);
        model.scale.setScalar(s);

        const box2 = new THREE.Box3().setFromObject(model);
        model.position.y -= box2.min.y;

        model.traverse(o => {
            if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = false;
                o.frustumCulled = false;
                if (Array.isArray(o.material)) {
                    o.material = o.material.map(m => m.clone());
                    o.material.forEach(m => { m.emissive = new THREE.Color(0, 0, 0); baseMats.push(m); });
                } else if (o.material) {
                    o.material = o.material.clone();
                    o.material.emissive = new THREE.Color(0, 0, 0);
                    baseMats.push(o.material);
                }
                hitMeshes.push(o);
            }
        });

        group.add(model);

        mixer = new THREE.AnimationMixer(model);
        for (const name in animClips) {
            const clip = animClips[name];
            const action = mixer.clipAction(clip);
            if (['jump', 'jump_forward', 'fall'].includes(name)) {
                action.setLoop(THREE.LoopOnce, 1);
                action.clampWhenFinished = true;
            }
            actions[name] = action;
        }
    } else {
        const fb = buildFallbackModel();
        group.add(fb.model);
        fb.hitMeshes.forEach(m => hitMeshes.push(m));
        fb.mats.forEach(m => baseMats.push(m));
    }

    const barBg = new THREE.Sprite(new THREE.SpriteMaterial({
        color: 0x000000, transparent: true, opacity: .55, depthWrite: false, depthTest: false
    }));
    barBg.scale.set(1.2, 0.14, 1);
    scene.add(barBg);

    const barFg = new THREE.Sprite(new THREE.SpriteMaterial({
        color: 0x35d07f, transparent: true, depthWrite: false, depthTest: false
    }));
    barFg.center.set(0, 0.5);
    barFg.scale.set(1.1, 0.085, 1);
    scene.add(barFg);

    const enemy = {
        group, mixer, actions, hitMeshes, baseMats,
        barBg, barFg,
        hp: 100, maxHp: 100,
        dead: false, deadTimer: 0,
        speed: rr(5.4, 7.0),
        attackCd: rr(0.6, 1.6),
        currentAction: null,
        animState: '',
        isOnceAnim: false,
        alert: 0,
        canSee: false,
        visionTimer: rand() * 0.3,
        lastSeen: new THREE.Vector3(),
        wanderTimer: 0,
        wanderDir: new THREE.Vector3(0, 0, 1),
        wanderState: 'walk',
        danceTimer: 0,
        animTick: 0,
        flash: 0,
        pendingAttack: null,
        climbTimer: 0,
        climbTargetY: 0,
        useFallAnim: false,
        deathFallDone: false,
        deathRotX: 0,
        corpse: false,
    };

    hitMeshes.forEach(m => { m.userData.enemy = enemy; });

    if (mixer) {
        mixer.addEventListener('finished', () => {
            if (enemy.dead) return;
            enemy.isOnceAnim = false;
            if (enemy.climbTimer > 0) return;
            if (enemy.alert > 0) {
                enemyPlayAnim(enemy, 'sprint', 0.15);
            } else {
                if (enemy.wanderState === 'dance') enemyPlayAnim(enemy, 'dance', 0.15);
                else enemyPlayAnim(enemy, 'walk', 0.15);
            }
        });
    }

    const sp = findSpawnPoint();
    group.position.copy(sp);
    group.rotation.y = rand() * Math.PI * 2;
    scene.add(group);

    if (mixer) enemyPlayAnim(enemy, 'walk', 0);
    else enemy.animState = 'walk';

    enemies.push(enemy);
    return enemy;
}

/* —— 视线检测 —— */
const _losDir = new THREE.Vector3();
function hasLineOfSight(from, to) {
    _losDir.subVectors(to, from);
    const dist = _losDir.length();
    if (dist < 0.01) return true;
    _losDir.normalize();
    raycaster.set(from, _losDir);
    raycaster.far = dist;
    const hits = raycaster.intersectObjects(worldMeshes, false);
    raycaster.far = Infinity;
    return hits.length === 0 || hits[0].distance >= dist - 0.5;
}

function damageEnemy(enemy, dmg, isHead, hitPoint, isMelee) {
    if (enemy.dead) return;
    enemy.hp -= isHead ? dmg * 2.1 : dmg;
    enemy.flash = 0.13;
    enemy.alert = Math.max(enemy.alert, 5);

    showDamageNumber(hitPoint, Math.round(isHead ? dmg * 2.1 : dmg), isHead, isMelee);
    SFX[isHead ? 'headshot' : 'hit']();

    if (enemy.hp <= 0) {
        enemy.hp = 0;
        enemy.dead = true;
        enemy.deadTimer = 0;
        enemy.deathRotX = 0;
        enemy.deathFallDone = false;
        enemy.hitMeshes.forEach(m => { m.userData.enemy = null; });

        let hasFallAnim = false;
        if (enemy.actions && enemy.actions['fall']) {
            const a = enemy.actions['fall'];
            a.reset();
            a.setLoop(THREE.LoopOnce, 1);
            a.clampWhenFinished = true;
            a.play();
            if (enemy.currentAction && enemy.currentAction !== a) {
                enemy.currentAction.crossFadeTo(a, 0.1, false);
            }
            enemy.currentAction = a;
            enemy.animState = 'dead';
            enemy.isOnceAnim = true;
            hasFallAnim = true;
        }
        enemy.useFallAnim = hasFallAnim;

        player.kills++;
        player.streak++;
        SFX.kill();
        addKillFeed(isHead);
        updateStatsUI();

        const ex = enemy.group.position.x;
        const ez = enemy.group.position.z;
        const roll = Math.random();
        if (roll < 0.05) {
            createPickup('gatling', ex + rr(-1, 1), ez + rr(-1, 1));
            showToast('敌人掉落了 加特林！', '#7fd8ff');
        } else if (roll < 0.095) {
            createPickup('golden', ex + rr(-1, 1), ez + rr(-1, 1));
            showToast('敌人掉落了 黄金枪！', '#ffd34d');
        } else if (roll < 0.75) {
            const ang = rand() * Math.PI * 2;
            const r = 1.2 + rand() * 1.6;
            createPickup(
                Math.random() < 0.5 ? 'health' : 'ammo',
                ex + Math.cos(ang) * r,
                ez + Math.sin(ang) * r
            );
        }
    }
}

function enemyMeleeAttack(enemy) {
    SFX.swing();
    enemy.pendingAttack = { t: 0.3, dmg: rr(12, 19) };
}

function updateVitalsUI() {
    const hp = Math.max(0, Math.round(player.hp));
    const ap = Math.max(0, Math.round(player.armor));
    healthFillEl.style.width = (hp / 100 * 100) + '%';
    armorFillEl.style.width  = (ap / player.maxArmor * 100) + '%';

    apNumEl.textContent = ap;

    else              healthFillEl.style.background = 'linear-gradient(90deg,#d8342f,#ff7a70)';

function updateAmmoUI() {
    const w = W(), ws = WS();
    if (w.melee) {
        ammoTextEl.innerHTML = `近战`;
        ammoTextEl.classList.add('melee');
        ammoTextEl.classList.remove('low');
    } else if (w.throwable) {
        ammoTextEl.classList.remove('melee', 'low');
        ammoTextEl.innerHTML = `∞<small>/∞</small>`;
    } else {
        ammoTextEl.classList.remove('melee');
        ammoTextEl.innerHTML = `${ws.ammo}<small>/${ws.reserve > 900 ? '∞' : ws.reserve}</small>`;
        ammoTextEl.classList.toggle('low', ws.ammo <= Math.ceil(w.magSize * 0.22));
    }
    weaponNameEl.textContent = w.name;

    let html = '';
    WEAPONS.forEach((we, i) => {
        if (!we.owned) return;
        const key = i === 9 ? '0' : String(i + 1);
        let cls = 'slot';
        if (we.melee) cls += ' meleeSlot';
        else if (we.gold) cls += ' goldSlot';
        else if (we.rare) cls += ' rareSlot';
        if (i === curWeapon) cls += ' on';
        html += `<div class="${cls}">${key} ${we.short}</div>`;
    });
    weaponSlotsEl.innerHTML = html;
}

function updateStatsUI() {
    killCountEl.textContent = player.kills;
    streakEl.textContent = player.streak;
    let alive = 0;
    for (const e of enemies) if (!e.dead) alive++;
    aliveCountEl.textContent = alive;
}

function addKillFeed(isHead) {
    const div = document.createElement('div');
    div.className = 'row' + (isHead ? ' head' : '');
    div.innerHTML = `击杀 <b>敌方士兵</b> ${isHead ? '· 爆头' : ''}`;
    killFeedEl.appendChild(div);
    setTimeout(() => {
        div.style.transition = 'opacity .4s';
        div.style.opacity = '0';
        setTimeout(() => div.remove(), 420);
    }, 2600);
    while (killFeedEl.children.length > 5) killFeedEl.removeChild(killFeedEl.firstChild);
}

function showToast(text, color = '#fff') {
    const el = document.createElement('div');
    el.className = 'toast';
    el.style.color = color;
    el.textContent = text;
    toastBoxEl.appendChild(el);
    setTimeout(() => el.remove(), 1450);
}

function showDamageNumber(worldPos, amount, isHead, isMelee) {
    if (!worldPos) return;
    const v = worldPos.clone().project(camera);
    if (v.z > 1) return;
    const x = (v.x * 0.5 + 0.5) * innerWidth;
    const y = (-v.y * 0.5 + 0.5) * innerHeight;
    if (x < 0 || x > innerWidth || y < 0 || y > innerHeight) return;
    const el = document.createElement('div');
    el.className = 'dmgNum' + (isHead ? ' head' : (isMelee ? ' melee' : ''));
    el.textContent = amount;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 780);
}

function showHitmarker(isHead) {
    hitmarkerEl.classList.add('show');
    hitmarkerEl.classList.toggle('head', isHead);
    setTimeout(() => hitmarkerEl.classList.remove('show'), 110);
}

/* ============================================================
   19. 受伤 / 死亡 / 重生
   ============================================================ */
function damagePlayer(amount) {
    if (player.dead) return;
    if (performance.now() < player.invulnUntil) return;

    if (player.armor > 0) {
        const absorbed = Math.min(player.armor, amount * 0.6);
        player.armor -= absorbed;
        amount -= absorbed;
    }
    player.hp -= amount;
    player.lastDamageTime = performance.now();
    player.streak = 0;
    updateStatsUI();

    vignetteFlash = Math.min(1, vignetteFlash + 0.6);
    hurtFlashVal = 1;
    SFX.hurt();

    if (player.hp <= 0) {
        player.hp = 0;
        player.dead = true;
        player.respawnTimer = 3.0;
        deathScreenEl.style.display = 'flex';
        mouseDown = false;
        aiming = false;
        meleeHolding = false;
        meleeCharging = false;
    }
    updateVitalsUI();
}

function respawnPlayer() {
    player.dead = false;
    player.hp = 100;
    player.armor = 0;
    player.reloading = false;
    player.velY = 0;
    player.streak = 0;
    player.invulnUntil = 0;

    const sp = findSpawnPoint();
    player.pos.copy(sp);
    player.pos.y = 0.5;

    weaponStates.forEach((s, i) => {
        if (!WEAPONS[i].melee && !WEAPONS[i].throwable) s.ammo = WEAPONS[i].magSize;
    });

    vignetteFlash = 0;
    hurtFlashVal = 0;
    deathScreenEl.style.display = 'none';
    reloadBarEl.style.opacity = 0;
    scopeOverlayEl.classList.remove('on');

    updateVitalsUI();
    updateAmmoUI();
    updateStatsUI();
}

let lastFireTime = -9999;

let flashTimer = 0;

function updateWeaponModel() {
    const id = W().id;
    for (const key in gunModels) {
        gunModels[key].group.visible = (key === id);
    }
    currentFlash = gunModels[id].flash;
    meleeSwingT = 0;
    meleeSwingType = '';
    meleeHolding = false;
    meleeCharging = false;
    meleeChargeT = 0;
    chargeOrb.visible = false;
    crosshairEl.classList.remove('charge');
}

function switchWeapon(idx) {
    if (player.dead) return;
    if (idx < 0 || idx >= WEAPONS.length) return;
    if (!WEAPONS[idx].owned) return;
    if (idx === curWeapon) return;
    curWeapon = idx;

    if (player.reloading) {
        player.reloading = false;
        reloadBarEl.style.opacity = 0;
    }

    updateWeaponModel();
    updateAmmoUI();
    SFX.switchW();
}

function cycleWeapon(dir) {
    let i = curWeapon;
    for (let n = 0; n < WEAPONS.length; n++) {
        i = (i + dir + WEAPONS.length) % WEAPONS.length;
        if (WEAPONS[i].owned) { switchWeapon(i); return; }
    }
}

function startReload() {
    const w = W(), ws = WS();
    if (w.melee || w.throwable) return;
    if (player.reloading || player.dead) return;
    if (ws.ammo >= w.magSize) return;
    if (ws.reserve <= 0) return;
    player.reloading = true;
    player.reloadTotal = w.reloadTime;
    player.reloadTimer = w.reloadTime;
    reloadBarEl.style.opacity = 1;
    reloadBarFill.style.width = '0%';
    SFX.reload();
}

/* —— 普通挥砍 —— */
function meleeAttack(w, now) {
    player.invulnUntil = now + w.invulnTime * 1000;
    meleeShieldEl.style.opacity = 0.65;

    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    dir.y = 0;
    dir.normalize();

    const halfArc = Math.cos(w.arc / 2);
    let hitAny = false;

    for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.group.position.x - player.pos.x;
        const dz = e.group.position.z - player.pos.z;
        const dist = Math.hypot(dx, dz);
        if (dist > w.range + 0.7) continue;
        if (dist < 0.001) continue;
        const dot = (dx / dist) * dir.x + (dz / dist) * dir.z;
        if (dot < halfArc) continue;

        const hitPoint = new THREE.Vector3(
            e.group.position.x,
            e.group.position.y + ENEMY_HEIGHT * 0.65,
            e.group.position.z
        );
        damageEnemy(e, w.damage, false, hitPoint, true);
        spawnBlood(hitPoint);
        hitAny = true;
    }

    if (hitAny) showHitmarker(false);
}

/* —— 左键快速斩击（连击序列） —— */
function doQuickSlash() {
    const now = performance.now();
    const w = W();
    if (now - meleeLastSlashTime < w.fireInterval * 1000) return;
    meleeLastSlashTime = now;

    const idx = meleeComboIdx % 3;
    meleeComboIdx++;
    meleeSwingType = 'slash' + idx;
    meleeSwingT = 1;

    meleeAttack(w, now);
    SFX.slash();
}

/* —— 右键重击：直刺突进 —— */
function doHeavyThrust() {
    const now = performance.now();
    const w = W();
    if (player.dead || player.reloading) return;
    if (!w.melee) return;
    if (now - meleeHeavyTime < 900) return;
    meleeHeavyTime = now;

    meleeSwingType = 'heavy';
    meleeSwingT = 1;
    SFX.thrust();
    player.invulnUntil = now + 380;
    meleeShieldEl.style.opacity = 0.5;

    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const origin = camera.position.clone();
    let hitAny = false;

    for (const e of enemies) {
        if (e.dead) continue;
        const center = e.group.position.clone();
        center.y += ENEMY_HEIGHT * 0.55;
        const toE = center.clone().sub(origin);
        const proj = toE.dot(dir);
        if (proj < 0.3 || proj > 4.8) continue;
        const closest = origin.clone().addScaledVector(dir, proj);
        if (closest.distanceTo(center) < 1.05) {
            damageEnemy(e, w.damage * 2.3, false, closest.clone(), true);
            spawnBlood(closest);
            hitAny = true;
        }
    }
    if (hitAny) showHitmarker(false);
}
