                            <input type="number" id="intervalInput" min="1" max="300" value="${Math.round(state.quoteInterval / 1000)}" />
                            <span style="font-size:0.6rem;opacity:0.4;">秒</span>
                        </div>
                    `;
                    qBody.appendChild(intervalRow);
                    qMod.appendChild(qBody);
                    content.appendChild(qMod);

                    // ---- 导出/导入 ----
                    const toolMod = document.createElement('div');
                    toolMod.className = 'settings-module';
                    toolMod.dataset.module = 'tools';
                    const tHeader = this._createHeader('⚡ 配置工具', 'tools');
                    toolMod.appendChild(tHeader);
                    const tBody = document.createElement('div');
                    tBody.className = 'settings-module-body' + (state.moduleStates.tools !== false ? '' : ' collapsed');
                    tBody.innerHTML = `
                        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
                            <button id="exportConfigBtn" style="flex:1;padding:4px 8px;border-radius:8px;border:none;background:rgba(255,255,255,0.08);color:inherit;font-size:0.65rem;cursor:pointer;">导出配置</button>
                            <button id="importConfigBtn" style="flex:1;padding:4px 8px;border-radius:8px;border:none;background:rgba(255,255,255,0.08);color:inherit;font-size:0.65rem;cursor:pointer;">导入配置</button>
                            <input type="file" id="importConfigInput" accept=".json" style="display:none;" />
                        </div>
                    `;
                    toolMod.appendChild(tBody);
                    content.appendChild(toolMod);

                    // ---- 绑定事件 ----
                    this._bindEvents();
                    // 更新壁纸预览
                    if (state.isWallpaperMode) this._updateWallpaperPreview();
                },

                _createHeader(label, key) {
                    const header = document.createElement('div');
                    header.className = 'settings-module-header';
                    header.dataset.moduleToggle = key;
                    const span = document.createElement('span');
                    span.textContent = label;
                    const arrow = document.createElement('span');
                    arrow.className = 'arrow' + (state.moduleStates[key] !== false ? '' : ' collapsed');
                    arrow.textContent = '▾';
                    header.appendChild(span);
                    header.appendChild(arrow);
                    header.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const k = header.dataset.moduleToggle;
                        if (state.moduleStates[k] !== undefined) {
                            state.moduleStates[k] = !state.moduleStates[k];
                            Storage.set('moduleStates', state.moduleStates);
                            const body = header.closest('.settings-module').querySelector(
                            '.settings-module-body');
                            const arr = header.querySelector('.arrow');
                            if (body) body.classList.toggle('collapsed', !state.moduleStates[k]);
                            if (arr) arr.classList.toggle('collapsed', !state.moduleStates[k]);
                        }
                    });
                    return header;
                },

                _bindEvents() {
                    // 模式切换
                    const bigSwitch = document.getElementById('modeSwitchBig');
                    if (bigSwitch) {
                        bigSwitch.addEventListener('click', () => ModeManager.toggleMode());
                    }

                    // 壁纸类型切换
                    document.querySelectorAll('.type-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove(
                            'active'));
                            btn.classList.add('active');
                            const type = btn.dataset.type;
                            state.currentWallpaperType = type;
                            const items = CONFIG.wallpapers[type] || [];
                            if (items.length > 0) {
                                const exists = items.some(w => w.id === state.currentWallpaperId);
                                if (!exists) state.currentWallpaperId = items[0].id;
                            }
                            WallpaperManager.apply(state.currentWallpaperType, state.currentWallpaperId);
                            this._updateWallpaperPreview();
                            Storage.set('wallpaperType', state.currentWallpaperType);
                        });
                    });

                    // 自定义壁纸上传
                    const upload = document.getElementById('customWallpaperUpload');
                    if (upload) {
                        upload.addEventListener('change', (e) => {
                            const file = e.target.files[0];
                            if (file) {
                                WallpaperManager.uploadCustom(file).then(() => {
                                    showToast('壁纸已上传');
                                    this._updateWallpaperPreview();
                                });
                            }
                            upload.value = '';
                        });
                    }

                    // 元素控制
                    document.querySelectorAll('.elem-control').forEach(row => {
                        const id = row.dataset.elemId;
                        const toggle = row.querySelector('.elem-toggle');
                        const range = row.querySelector('.elem-opacity input[type="range"]');
                        const valDisplay = row.querySelector('.elem-opacity-value');
                        toggle.addEventListener('click', () => {
                            ElemManager.toggle(id);
                            toggle.classList.toggle('active', state.elemState[id].visible);
                        });
                        range.addEventListener('input', () => {
                            const val = parseFloat(range.value);
                            ElemManager.setOpacity(id, val);
                            if (valDisplay) valDisplay.textContent = Math.round(val * 100) + '%';
                        });
                    });

                    // 语录管理
                    const manager = document.getElementById('quoteManager');
                    if (manager) {
                        manager.querySelectorAll('.edit-btn').forEach(btn => {
                            btn.addEventListener('click', () => {
                                const idx = parseInt(btn.dataset.index);
                                const q = QuoteManager.quotes[idx];
                                if (!q) return;
                                const newText = prompt('编辑语录内容：', q.text);
                                if (newText !== null) {
                                    const newAuthor = prompt('编辑作者：', q.author);
                                    if (newAuthor !== null) {
                                        QuoteManager.edit(idx, newText, newAuthor);
                                        this.renderSettings();
                                    }
                                }
                            });
                        });
                        manager.querySelectorAll('.del-btn').forEach(btn => {
                            btn.addEventListener('click', () => {
                                const idx = parseInt(btn.dataset.index);
                                if (confirm('确定删除此语录？')) {
                                    QuoteManager.remove(idx);
                                    this.renderSettings();
                                }
                            });
                        });
                    }

                    const addBtn = document.getElementById('addQuoteBtn');
                    if (addBtn) {
                        addBtn.addEventListener('click', () => {
                            const text = document.getElementById('newQuoteText');
                            const author = document.getElementById('newQuoteAuthor');
                            if (QuoteManager.add(text.value, author.value)) {
                                text.value = '';
                                author.value = '';
                                this.renderSettings();
                                showToast('语录已添加');
                            } else {
                                showToast('请输入内容');
                            }
                        });
                    }

                    const intervalInput = document.getElementById('intervalInput');
                    if (intervalInput) {
                        intervalInput.addEventListener('change', () => {
                            let val = parseInt(intervalInput.value);
                            if (isNaN(val) || val < 1) val = 1;
                            if (val > 300) val = 300;
                            intervalInput.value = val;
                            QuoteManager.setInterval(val);
                            showToast('间隔已更新');
                        });
                    }

                    // 导出配置
                    const exportBtn = document.getElementById('exportConfigBtn');
                    if (exportBtn) {
                        exportBtn.addEventListener('click', () => {
                            const data = {
                                links: state.links,
                                quotes: QuoteManager.quotes,
                                quoteInterval: state.quoteInterval,
                                nightMode: state.currentMode === 'night',
                                isWallpaperMode: state.isWallpaperMode,
                                wallpaperType: state.currentWallpaperType,
                                wallpaperId: state.currentWallpaperId,
                                elemState: state.elemState,
                                moduleStates: state.moduleStates,
                                simplePositions: Storage.get(getStorageKey('simplePositions'), {}),
                                wallpaperPositions: Storage.get(getStorageKey('wallpaperPositions'),
                                {}),
                                simpleLocks: Storage.get(getStorageKey('simpleLocks'), {}),
                                wallpaperLocks: Storage.get(getStorageKey('wallpaperLocks'), {}),
                            };
                            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'lingjing_config.json';
                            a.click();
                            URL.revokeObjectURL(url);
                            showToast('配置已导出');
                        });
                    }

                    // 导入配置
                    const importBtn = document.getElementById('importConfigBtn');
                    const importInput = document.getElementById('importConfigInput');
                    if (importBtn && importInput) {
                        importBtn.addEventListener('click', () => importInput.click());
                        importInput.addEventListener('change', (e) => {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                try {
                                    const data = JSON.parse(ev.target.result);
                                    if (data.links) { state.links = data.links;
                                        LinkManager.save();
                                        LinkManager.render(); }
                                    if (data.quotes) { QuoteManager.quotes = data.quotes;
                                        QuoteManager.save();
                                        QuoteManager.show(0);
                                        QuoteManager.restartInterval(); }
                                    if (data.quoteInterval) { state.quoteInterval = data
                                        .quoteInterval;
                                        QuoteManager.setInterval(data.quoteInterval / 1000); }
                                    if (data.nightMode !== undefined) ModeManager
                                        ._applyDayNight(data.nightMode ? 'night' : 'day');
                                    if (data.isWallpaperMode !== undefined) {
                                        state.isWallpaperMode = data.isWallpaperMode;
                                        Storage.set('isWallpaperMode', state.isWallpaperMode);
                                        ModeManager.toggleMode(); // 重新应用
                                    }
                                    if (data.elemState) { state.elemState = data.elemState;
                                        Storage.set('elemState', state.elemState);
                                        ElemManager.apply(); }
                                    if (data.moduleStates) { state.moduleStates = data
                                            .moduleStates;
                                        Storage.set('moduleStates', state.moduleStates); }
                                    if (data.simplePositions) Storage.set(getStorageKey(
                                        'simplePositions'), data.simplePositions);
                                    if (data.wallpaperPositions) Storage.set(getStorageKey(
                                        'wallpaperPositions'), data.wallpaperPositions);
                                    if (data.simpleLocks) Storage.set(getStorageKey('simpleLocks'),
                                        data.simpleLocks);
                                    if (data.wallpaperLocks) Storage.set(getStorageKey(
                                        'wallpaperLocks'), data.wallpaperLocks);
                                    showToast('配置导入成功，请刷新页面');
                                    setTimeout(() => location.reload(), 1000);
                                } catch (err) { showToast('配置文件格式错误'); }
                            };
                            reader.readAsText(file);
                            importInput.value = '';
                        });
                    }
                },

                _updateWallpaperPreview() {
                    const grid = document.getElementById('wallpaperPreviewGrid');
                    if (!grid) return;
                    const items = CONFIG.wallpapers[state.currentWallpaperType] || [];
                    grid.innerHTML = '';
                    items.forEach(wp => {
                        const el = document.createElement('div');
                        el.className = 'wp-preview-item' + (state.currentWallpaperId === wp.id ? ' active' : '');
                        el.dataset.id = wp.id;
                        el.dataset.type = state.currentWallpaperType;
                        if (state.currentWallpaperType === 'dynamic') {
                            const vid = document.createElement('video');
                            const src = ResourceLoader.blobs[wp.id] || 'videos/' + wp.file;
                            vid.src = src;
                            vid.muted = true;
                            vid.playsInline = true;
                            vid.preload = 'metadata';
                            vid.loop = true;
                            vid.addEventListener('loadedmetadata', () => vid.play().catch(() => {}));
                            el.appendChild(vid);
                        } else {
                            const img = document.createElement('img');
                            const src = wp.file.startsWith('data:') ? wp.file : 'images/' + wp.file;
                            img.src = src;
                            img.alt = wp.name;
                            img.loading = 'lazy';
                            el.appendChild(img);
                        }
                        const label = document.createElement('div');
                        label.className = 'wp-label';
                        label.textContent = wp.name;
                        el.appendChild(label);
                        const check = document.createElement('div');
                        check.className = 'check-mark';
                        check.textContent = '✓';
                        el.appendChild(check);
                        el.addEventListener('click', () => {
                            WallpaperManager.apply(state.currentWallpaperType, wp.id);
                            document.querySelectorAll('.wp-preview-item').forEach(item => {
                                item.classList.toggle('active', item.dataset.id === wp.id);
                            });
                        });
                        grid.appendChild(el);
                    });
                }
            };

            // ================================================================
            // 13. 核心模块: 拖拽系统 (简单模式 + 修仙模式)
            // ================================================================
            const DragManager = {
                init() {
                    this._initSimpleDrags();
                    this._initWallpaperDrags();
                    this._loadSimplePositions();
                },

                // 简单模式拖拽
                _initSimpleDrags() {
                    const targets = document.querySelectorAll('.simple-draggable');
                    const stateMap = new WeakMap();
                    targets.forEach(el => {
                        const st = {
                            isDragging: false,
                            startX: 0,
                            startY: 0,
                            baseTX: 0,
                            baseTY: 0,
                            fixedLeft: 0,
                            fixedTop: 0,
                            width: 0,
                            height: 0,
                            rafId: null,
                            locked: false,
                        };
                        stateMap.set(el, st);

                        // 加载锁状态
                        const locks = Storage.get(getStorageKey('simpleLocks'), {});
                        if (locks[el.id]) {
                            st.locked = true;
                            el.classList.add('locked');
                            el.style.cursor = 'default';
                        }

                        el.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            if (st.isDragging) return;
                            st.locked = !st.locked;
                            const locks = Storage.get(getStorageKey('simpleLocks'), {});
                            locks[el.id] = st.locked;
                            Storage.set(getStorageKey('simpleLocks'), locks);
                            if (st.locked) {
                                el.classList.add('locked');
                                el.style.cursor = 'default';
                            } else {
                                el.classList.remove('locked');
                                el.style.cursor = 'grab';
                            }
                        });

                        const onStart = (e) => {
                            if (st.locked) return;
                            if (e.target.closest('input') || e.target.closest('a') || e.target.closest(
                                    'button')) return;
                            if (ModeManager.isWallpaperMode) return;
                            if (activeDrag) _endDrag(activeDrag);
                            const ev = e.touches ? e.touches[0] : e;
                            const rect = el.getBoundingClientRect();
                            const transform = this._getTransform(el);
                            st.isDragging = false;
                            st.startX = ev.clientX;
                            st.startY = ev.clientY;
                            st.baseTX = transform.x;
                            st.baseTY = transform.y;
                            st.fixedLeft = rect.left - st.baseTX;
                            st.fixedTop = rect.top - st.baseTY;
                            st.width = el.offsetWidth || rect.width;
                            st.height = el.offsetHeight || rect.height;
                            el.style.cursor = 'grabbing';
                            activeDrag = el;
                            if (e.cancelable) e.preventDefault();
                        };

                        const onMove = (e) => {
                            if (activeDrag !== el) return;
                            if (st.locked) return;
                            const ev = e.touches ? e.touches[0] : e;
                            const dx = ev.clientX - st.startX;
                            const dy = ev.clientY - st.startY;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 6) {
                                if (!st.isDragging) {
                                    st.isDragging = true;
                                    el.classList.add('dragging-simple');
                                    const rect = el.getBoundingClientRect();
                                    const transform = this._getTransform(el);
                                    st.baseTX = transform.x;
                                    st.baseTY = transform.y;
                                    st.fixedLeft = rect.left - st.baseTX;
                                    st.fixedTop = rect.top - st.baseTY;
                                    st.startX = ev.clientX;
                                    st.startY = ev.clientY;
                                    if (e.cancelable) e.preventDefault();
                                    return;
                                }
                                let newTX = st.baseTX + (ev.clientX - st.startX);
                                let newTY = st.baseTY + (ev.clientY - st.startY);
                                const safeRight = window.innerWidth - parseFloat(getComputedStyle(
                                    document.documentElement).getPropertyValue('--safe-right') || '0');
                                const safeBottom = window.innerHeight - parseFloat(getComputedStyle(
                                    document.documentElement).getPropertyValue('--safe-bottom') ||
                                    '0');
                                const maxX = safeRight - st.width - st.fixedLeft;
                                const minX = -st.fixedLeft;
                                const maxY = safeBottom - st.height - st.fixedTop;
                                const minY = -st.fixedTop;
                                newTX = Math.max(minX, Math.min(maxX, newTX));
                                newTY = Math.max(minY, Math.min(maxY, newTY));
                                if (el.id === 'quoteArea') {
                                    const rectNow = el.getBoundingClientRect();
                                    const leftEdge = rectNow.left;
                                    const availWidth = Math.min(420, Math.max(200, window.innerWidth -
                                        leftEdge - 32));
                                    el.style.maxWidth = availWidth + 'px';
                                }
                                this._applyTransformRAF(el, newTX, newTY, st);
                                const pos = Storage.get(getStorageKey('simplePositions'), {});
                                pos[el.id] = { x: newTX, y: newTY };
                                Storage.set(getStorageKey('simplePositions'), pos);
                                if (e.cancelable) e.preventDefault();
                            } else {
                                if (e.cancelable) e.preventDefault();
                            }
                        };

                        const onEnd = () => {
                            if (activeDrag === el) {
                                if (st.rafId) { cancelAnimationFrame(st.rafId);
                                    st.rafId = null; }
                                if (st.isDragging) {
                                    el.classList.remove('dragging-simple');
                                    el.style.cursor = st.locked ? 'default' : 'grab';
                                    st.isDragging = false;
                                }
                                activeDrag = null;
                            }
                        };

                        el.addEventListener('pointerdown', onStart);
                        document.addEventListener('pointermove', onMove);
                        document.addEventListener('pointerup', onEnd);
                        document.addEventListener('pointercancel', onEnd);
                        el.addEventListener('touchstart', onStart, { passive: false });
                        document.addEventListener('touchmove', onMove, { passive: false });
                        document.addEventListener('touchend', onEnd);
                        document.addEventListener('touchcancel', onEnd);
                        el._dragCleanup = () => {
                            el.removeEventListener('pointerdown', onStart);
                            document.removeEventListener('pointermove', onMove);
                            document.removeEventListener('pointerup', onEnd);
                            document.removeEventListener('pointercancel', onEnd);
                            el.removeEventListener('touchstart', onStart);
                            document.removeEventListener('touchmove', onMove);
                            document.removeEventListener('touchend', onEnd);
                            document.removeEventListener('touchcancel', onEnd);
                        };
                    });
                },

                _getTransform(el) {
                    let tx = 0,
                        ty = 0;
                    const style = window.getComputedStyle(el);
                    const transform = style.transform;
                    if (transform && transform !== 'none') {
                        const matrix = transform.match(/matrix.*\((.+)\)/);
                        if (matrix) {
                            const values = matrix[1].split(', ').map(Number);
                            if (values.length === 6) { tx = values[4] || 0;
                                ty = values[5] || 0; } else if (values.length === 16) { tx = values[12] || 0;
                                ty = values[13] || 0; }
                        }
                    }
                    return { x: tx, y: ty };
                },

                _applyTransformRAF(el, x, y, st) {
                    if (st.rafId) { cancelAnimationFrame(st.rafId);
                        st.rafId = null; }
                    st.rafId = requestAnimationFrame(() => {
                        el.style.transform = `translate(${x}px, ${y}px)`;
                        st.rafId = null;
                    });
                },

                _loadSimplePositions() {
                    const pos = Storage.get(getStorageKey('simplePositions'), {});
                    document.querySelectorAll('.simple-draggable').forEach(el => {
                        let tx = 0,
                            ty = 0;
                        if (pos[el.id]) {
                            tx = pos[el.id].x;
                            ty = pos[el.id].y;
                        } else {
                            // 默认布局优化
                            const isMobile = window.innerWidth <= 768;
                            if (el.id === 'clockArea') {
                                tx = 0;
                                ty = isMobile ? -6 : -10;
                                ty = ty * window.innerHeight / 100;
                            } else if (el.id === 'quoteArea') {
                                tx = 0;
                                ty = 0;
                                el.style.maxWidth = isMobile ? (window.innerWidth * 0.9) + 'px' : '420px';
                            } else if (el.id === 'bottomArea') {
                                tx = 0;
                                ty = isMobile ? 6 : 10;
                                ty = ty * window.innerHeight / 100;
                            }
                        }
                        el.style.transform = `translate(${tx}px, ${ty}px)`;
                        const st = window._simpleStateMap?.get(el);
                        if (st) { st.baseTX = tx;
                            st.baseTY = ty; }
                    });
                },

                // 修仙模式拖拽
                _initWallpaperDrags() {
                    const items = document.querySelectorAll('.draggable-item');
                    items.forEach(item => {
                        let locked = false;
                        const locks = Storage.get(getStorageKey('wallpaperLocks'), {});
                        if (locks[item.id]) { locked = true;
                            item.classList.add('locked');
                            item.style.cursor = 'default'; }

                        item.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            locked = !locked;
                            const locks = Storage.get(getStorageKey('wallpaperLocks'), {});
                            locks[item.id] = locked;
                            Storage.set(getStorageKey('wallpaperLocks'), locks);
                            if (locked) { item.classList.add('locked');
                                item.style.cursor = 'default'; } else { item.classList.remove('locked');
                                item.style.cursor = 'grab'; }
                        });

                        let dragging = false;
                        let startX, startY, origX, origY;
                        let rafId = null;

                        const onStart = (e) => {
                            if (locked) return;
                            if (e.target.closest('.settings-panel') || e.target.closest('a') || e.target
                                .closest('button') || e.target.closest('input')) return;
                            const ev = e.touches ? e.touches[0] : e;
                            const rect = item.getBoundingClientRect();
                            let left = parseFloat(item.style.left) || rect.left;
                            let top = parseFloat(item.style.top) || rect.top;
                            if (!item.style.left) { left = rect.left;
                                item.style.left = left + 'px'; }
                            if (!item.style.top) { top = rect.top;
                                item.style.top = top + 'px'; }
                            origX = left;
                            origY = top;
                            startX = ev.clientX;
                            startY = ev.clientY;
                            dragging = false;
                            item.style.cursor = 'grabbing';
                            if (e.cancelable) e.preventDefault();
                        };

                        const onMove = (e) => {
                            if (locked) return;
                            const ev = e.touches ? e.touches[0] : e;
                            const dx = ev.clientX - startX;
                            const dy = ev.clientY - startY;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 8) {
                                if (!dragging) {
                                    dragging = true;
                                    item.classList.add('dragging');
                                    if (e.cancelable) e.preventDefault();
                                }
                                let newX = origX + dx;
                                let newY = origY + dy;
                                const safeRight = window.innerWidth - parseFloat(getComputedStyle(
                                    document.documentElement).getPropertyValue('--safe-right') || '0');
                                const safeBottom = window.innerHeight - parseFloat(getComputedStyle(
                                    document.documentElement).getPropertyValue('--safe-bottom') ||
                                    '0');
                                newX = Math.max(0, Math.min(safeRight - item.offsetWidth, newX));
                                newY = Math.max(0, Math.min(safeBottom - item.offsetHeight, newY));
                                if (rafId) cancelAnimationFrame(rafId);
                                rafId = requestAnimationFrame(() => {
                                    item.style.left = newX + 'px';
                                    item.style.top = newY + 'px';
                                    if (item.id === 'wallpaperQuoteDisplay') {
                                        const rect = item.getBoundingClientRect();
                                        const leftDist = rect.left;
                                        const availWidth = Math.min(420, Math.max(180, window
                                            .innerWidth - leftDist - 24));
                                        item.style.maxWidth = availWidth + 'px';
                                        const baseSize = 1.2;
                                        let fontSize = baseSize;
                                        if (rect.top < 60) fontSize = Math.max(0.7, baseSize - (60 -
                                            rect.top) / 150);
                                        if (window.innerHeight - rect.bottom < 60) fontSize = Math.max(
                                            0.7, baseSize - (60 - (window.innerHeight - rect
                                            .bottom)) / 150);
                                        if (availWidth < 250) fontSize = Math.min(fontSize, 0.9);
                                        const wq = item.querySelector('.wq-text');
                                        if (wq) wq.style.fontSize = fontSize + 'rem';
                                    }
                                    const pos = Storage.get(getStorageKey('wallpaperPositions'), {});
                                    pos[item.id] = { left: parseFloat(item.style.left), top: parseFloat(
                                            item.style.top) };
                                    Storage.set(getStorageKey('wallpaperPositions'), pos);
                                    rafId = null;
                                });
                                if (e.cancelable) e.preventDefault();
                            }
                        };

                        const onEnd = () => {
                            if (dragging) {
                                dragging = false;
                                item.classList.remove('dragging');
                                item.style.cursor = locked ? 'default' : 'grab';
                            }
                            if (rafId) { cancelAnimationFrame(rafId);
                                rafId = null; }
                        };

                        item.addEventListener('mousedown', onStart);
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onEnd);
                        item.addEventListener('touchstart', onStart, { passive: false });
                        document.addEventListener('touchmove', onMove, { passive: false });
                        document.addEventListener('touchend', onEnd);
                        document.addEventListener('touchcancel', onEnd);
                        item._dragCleanup = () => {
                            item.removeEventListener('mousedown', onStart);
                            document.removeEventListener('mousemove', onMove);
                            document.removeEventListener('mouseup', onEnd);
                            item.removeEventListener('touchstart', onStart);
                            document.removeEventListener('touchmove', onMove);
                            document.removeEventListener('touchend', onEnd);
                            document.removeEventListener('touchcancel', onEnd);
                        };
                    });
                }
            };
            let activeDrag = null;

            // ================================================================
            // 14. 核心模块: 开始页与雨滴
            // ================================================================
            const StartPageManager = {
                el: document.getElementById('startPage'),
                rainContainer: document.getElementById('rain-container'),
                _rainInitialized: false,
                _rainDestroyed: false,
                _curtains: null,
                _plane: null,
                _mouse: { x: 0, y: 0 },

                init() {
                    // 触发淡入
                    setTimeout(() => {
                        this.el.classList.remove('fade-out');
                        this.el.classList.add('show');
                    }, 200);
                    // 延迟初始化雨滴
                    setTimeout(() => this._initRainEffect(), 300);
                    // 点击退出
                    this.el.addEventListener('click', () => this.exit());
                    this.el.addEventListener('touchstart', () => this.exit(), { passive: true });
                    // 构建雨丝
                    this._buildRaindrops();
                },

                exit() {
                    if (this.el.classList.contains('fade-out')) return;
                    this.el.classList.remove('show');
                    this.el.classList.add('fade-out');

                    // 启动独立雨丝
                    const rc = this.rainContainer;
                    rc.classList.add('active');
                    setTimeout(() => {
                        rc.classList.add('fade-out');
                        setTimeout(() => {
                            rc.classList.remove('active');
                            rc.style.display = 'none';
                        }, 1200);
                    }, 300);

                    setTimeout(() => {
                        this._destroyRainEffect();
                    }, 1300);
                },

                _buildRaindrops() {
                    const rc = this.rainContainer;
                    rc.innerHTML = '';
                    const configs = [
                        { left: 10, duration: 2.4, delay: 0.2, height: 60 },
                        { left: 22, duration: 3.0, delay: 0.8, height: 80 },
                        { left: 35, duration: 2.0, delay: 0.0, height: 50 },
                        { left: 48, duration: 2.8, delay: 0.5, height: 70 },
                        { left: 60, duration: 2.2, delay: 1.0, height: 55 },
                        { left: 73, duration: 3.2, delay: 0.3, height: 90 },
                        { left: 85, duration: 2.6, delay: 0.7, height: 65 },
                        { left: 92, duration: 2.0, delay: 1.2, height: 45 },
                        { left: 15, duration: 2.9, delay: 0.9, height: 75 },
                        { left: 42, duration: 2.1, delay: 0.1, height: 50 },
                        { left: 68, duration: 3.1, delay: 0.6, height: 85 },
                        { left: 78, duration: 2.3, delay: 1.1, height: 60 },
                    ];
                    configs.forEach(cfg => {
                        const el = document.createElement('div');
                        el.className = 'raindrop';
                        el.style.left = cfg.left + '%';
                        el.style.animationDuration = cfg.duration + 's';
                        el.style.animationDelay = cfg.delay + 's';
                        el.style.height = cfg.height + 'px';
                        rc.appendChild(el);
                    });
                },

                _initRainEffect() {
                    if (this._rainInitialized || this._rainDestroyed) return;
                    if (typeof Curtains === 'undefined') {
                        console.warn('Curtains.js 未加载，雨滴跳过');
                        return;
                    }
                    const container = document.getElementById('canvas');
                    const texture = document.getElementById('texture');
                    if (!container || !texture) return;
                    if (!texture.complete || texture.naturalWidth === 0) {
                        texture.onload = () => this._initRainEffect();
                        return;
                    }
                    try {
                        this._curtains = new Curtains({
                            container: 'canvas',
                            watchScroll: false,
                            pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
                        });
                        const vs = `
                            #ifdef GL_ES
                            precision mediump float;
                            #endif
                            attribute vec3 aVertexPosition;
                            attribute vec2 aTextureCoord;
                            uniform mat4 uMVMatrix;
                            uniform mat4 uPMatrix;
                            uniform mat4 dispImageMatrix;
                            varying vec3 vVertexPosition;
                            varying vec2 vTextureCoord;
                            void main() {
                                vec3 vertexPosition = aVertexPosition;
                                gl_Position = uPMatrix * uMVMatrix * vec4(vertexPosition, 1.0);
                                vTextureCoord = (dispImageMatrix * vec4(aTextureCoord, 0., 1.)).xy;
                                vVertexPosition = vertexPosition;
                            }
                        `;
                        const fs = `
                            #ifdef GL_ES
                            precision mediump float;
                            #endif
                            #define PI2 6.28318530718
                            #define PI  3.14159265359
                            #define S(a,b,n) smoothstep(a,b,n)
                            varying vec3 vVertexPosition;
                            varying vec2 vTextureCoord;
                            uniform float uTime;
                            uniform vec2  uReso;
                            uniform vec2  uMouse;
                            uniform sampler2D dispImage;
                            float N12(vec2 p) {
                                p = fract(p * vec2(123.34, 345.45));
                                p += dot(p, p + 34.345);
                                return fract(p.x * p.y);
                            }
                            vec3 Layer(vec2 uv0, float t) {
                                vec2 asp = vec2(2., 1.);
                                vec2 uv1 = uv0 * 3.0 * asp;
                                uv1.y += t * 0.25;
                                vec2 gv = fract(uv1) - 0.5;
                                vec2 id = floor(uv1);
                                float n = N12(id);
                                t += n * PI2;
                                float w = uv0.y * 10.0;
                                float x = (n - 0.5) * 0.8;
                                x += (0.4 - abs(x)) * sin(3.0 * w) * pow(sin(w), 6.0) * 0.45;
                                float y = -sin(t + sin(t + sin(t) * 0.5)) * (0.5 - 0.06);
                                y -= (gv.x - x) * (gv.x - x);
                                vec2 dropPos = (gv - vec2(x, y)) / asp;
                                float drop = S(0.015, 0.01, length(dropPos));
                                vec2 trailPos = (gv - vec2(x, t * 0.25)) / asp;
                                trailPos.y = (fract(trailPos.y * 8.0) - 0.5) / 8.0;
                                float trail = S(0.01, 0.0075, length(trailPos));
                                float fogTrail = S(-0.05, 0.05, dropPos.y);
                                fogTrail *= S(0.5, y, gv.y);
                                trail *= fogTrail;
                                fogTrail *= S(0.015, 0.0075, abs(dropPos.x));
                                vec2 off = drop * dropPos + trail * trailPos;
                                return vec3(off, fogTrail);
                            }
                            void main() {
                                float dist = 5.0;
                                float blurSize = 1.5;
                                float t = mod(uTime * 0.03, 7200.0);
                                vec2 uv = vTextureCoord;
                                vec3 drops = Layer(uv, t);
                                drops += Layer(uv * 1.25 + 7.54, t);
                                drops += Layer(uv * 1.35 + 1.54, t);
                                drops += Layer(uv * 1.57 - 7.54, t);
                                float blur = blurSize * 1.0 * (1.0 - drops.z);
                                vec4 col = vec4(0.0);
                                int numSamples = 32;
                                float a = N12(uv) * PI2;
                                blur *= 0.0005;
                                uv += drops.xy * dist;
                                for (int n = 0; n < 32; n++) {
                                    vec2 off = vec2(sin(a), cos(a)) * blur;
                                    float d = fract(sin(float(n + 1) * 546.0) * 5424.0);
                                    d = sqrt(d);
                                    off *= d;
                                    col += texture2D(dispImage, uv + off);
                                    a++;
                                }
                                col /= float(numSamples);
                                gl_FragColor = col;
                            }
                        `;
                        const planeEl = document.querySelector('.plane');
                        this._plane = this._curtains.addPlane(planeEl, {
                            vertexShader: vs,
                            fragmentShader: fs,
                            widthSegments: 40,
                            heightSegments: 40,
                            uniforms: {
                                time: { name: 'uTime', type: '1f', value: 0 },
                                mousepos: { name: 'uMouse', type: '2f', value: [0, 0] },
                                resolution: { name: 'uReso', type: '2f', value: [window.innerWidth, window
                                        .innerHeight] },
                            }
                        });
                        if (this._plane) {
                            this._plane.onRender(() => {
                                if (this._rainDestroyed) return;
                                this._plane.uniforms.time.value++;
                                this._plane.uniforms.resolution.value = [window.innerWidth, window
                                    .innerHeight
                                ];
                                this._plane.uniforms.mousepos.value = [this._mouse.x, this._mouse.y];
                            });
                            window.addEventListener('mousemove', (e) => { this._mouse.x = e.clientX;
                                this._mouse.y = e.clientY; });
                            window.addEventListener('resize', () => {
                                if (this._plane && !this._rainDestroyed) {
                                    this._plane.uniforms.resolution.value = [window.innerWidth, window
                                        .innerHeight
                                    ];
                                }
                            });
                            this._rainInitialized = true;
                        } else {
                            this._curtains.dispose();
                            this._curtains = null;
                        }
                    } catch (e) { console.warn('雨滴初始化失败', e); }
                },

                _destroyRainEffect() {
                    if (this._rainDestroyed) return;
                    this._rainDestroyed = true;
                    if (this._plane) { try { this._plane.remove(); } catch (_) {} }
                    if (this._curtains) { try { this._curtains.dispose(); } catch (_) {} }
                    this._plane = null;
                    this._curtains = null;
                    this._rainInitialized = false;
                }
            };

            // ================================================================
            // 15. 核心模块: 时钟
            // ================================================================
            const ClockManager = {
                init() {
                    this.update();
                    setInterval(() => this.update(), 1000);
                },
                update() {
                    const now = new Date();
                    const h = String(now.getHours()).padStart(2, '0');
                    const m = String(now.getMinutes()).padStart(2, '0');
                    const timeStr = h + ':' + m;
                    const dateStr =
                        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${'日一二三四五六'[now.getDay()]}`;
                    document.getElementById('time').textContent = timeStr;
                    document.getElementById('date').textContent = dateStr;
                    document.getElementById('wpTime').textContent = timeStr;
                    document.getElementById('wpDate').textContent = dateStr;
                }
            };

            // ================================================================
            // 16. 拉绳交互 (键盘支持)
            // ================================================================
            const RopeManager = {
                handle: document.getElementById('rope-handle'),
                line: document.getElementById('rope-line'),
                _isDragging: false,
                _startY: 0,
                _currentPull: 0,
                _MAX: 120,
                _THRESHOLD: 70,
                _hasTriggered: false,
                _rafId: null,

                init() {
                    this._reset(false);
                    // 鼠标/触摸
                    this.handle.addEventListener('mousedown', (e) => this._onStart(e.clientY, e));
                    this.handle.addEventListener('touchstart', (e) => {
                        const t = e.touches[0];
                        if (t) this._onStart(t.clientY, e);
                    }, { passive: false });
                    document.addEventListener('mousemove', (e) => this._onMove(e.clientY));
                    document.addEventListener('mouseup', () => this._onEnd());
                    document.addEventListener('touchmove', (e) => {
                        const t = e.touches[0];
                        if (t) this._onMove(t.clientY);
                    }, { passive: true });
                    document.addEventListener('touchend', () => this._onEnd());
                    document.addEventListener('touchcancel', () => this._onEnd());
                    // 键盘支持
                    this.handle.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            ModeManager.toggleDayNight();
                            // 模拟拉动反馈
                            this.line.style.height = (60 + 70) + 'px';
                            this.handle.style.top = (72 + 70) + 'px';
                            setTimeout(() => this._reset(true), 400);
                        }
                    });
                },

                _onStart(clientY, e) {
                    if (e) e.preventDefault();
                    this._isDragging = true;
                    this._startY = clientY;
                    this._hasTriggered = false;
                    this.line.style.transition = 'none';
                    this.handle.style.transition = 'none';
                    this.handle.style.cursor = 'grabbing';
                },

                _onMove(clientY) {
                    if (!this._isDragging) return;
                    const delta = Math.max(0, clientY - this._startY);
                    this._updatePull(delta);
                    if (delta >= this._THRESHOLD && !this._hasTriggered) {
                        this._hasTriggered = true;
                        ModeManager.toggleDayNight();
                    }
                },

                _onEnd() {
                    if (!this._isDragging) return;
                    this._isDragging = false;
                    this.handle.style.cursor = 'grab';
                    if (this._currentPull >= this._THRESHOLD && !this._hasTriggered) {
                        this._hasTriggered = true;
                        ModeManager.toggleDayNight();
                    }
                    this._reset(true);
                },

                _updatePull(val) {
                    this._currentPull = Math.min(Math.max(val, 0), this._MAX);
                    if (this._rafId) cancelAnimationFrame(this._rafId);
                    this._rafId = requestAnimationFrame(() => {
                        this.line.style.height = (60 + this._currentPull) + 'px';
                        this.handle.style.top = (72 + this._currentPull) + 'px';
                        this._rafId = null;
                    });
                },

                _reset(animate) {
                    if (this._rafId) { cancelAnimationFrame(this._rafId);
                        this._rafId = null; }
                    if (animate) {
                        this.line.style.transition = 'height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                        this.handle.style.transition = 'top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    } else {
                        this.line.style.transition = 'none';
                        this.handle.style.transition = 'none';
                    }
                    this.line.style.height = '60px';
                    this.handle.style.top = '72px';
                    this._currentPull = 0;
                    this._hasTriggered = false;
                    if (animate) {
                        setTimeout(() => {
                            this.line.style.transition = 'height 0.15s ease-out';
                            this.handle.style.transition = 'none';
                        }, 550);
                    } else {
                        this.line.style.transition = 'height 0.15s ease-out';
                        this.handle.style.transition = 'none';
                    }
                }
            };

            // ================================================================
            // 17. 音乐播放器 UI 事件绑定
            // ================================================================
            function bindMusicEvents() {
                const cover = document.getElementById('playerCover');
                const joystickDirs = document.querySelectorAll('.player-joystick .touch > div');
                const btn = document.getElementById('playerJoystickBtn');

                // 点击封面切换播放
                cover.addEventListener('click', () => MusicManager.togglePlay());

                // 摇杆方向
                joystickDirs.forEach(div => {
                    const dir = div.dataset.dir;
                    div.addEventListener('mouseenter', () => {
                        btn.classList.remove('dir-up', 'dir-down', 'dir-left', 'dir-right');
                        btn.classList.add('dir-' + dir);
                    });
                    div.addEventListener('mouseleave', () => {
                        btn.classList.remove('dir-up', 'dir-down', 'dir-left', 'dir-right');
                    });
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        MusicManager.handleJoystick(dir);
                    });
                    div.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        MusicManager.handleJoystick(dir);
                    }, { passive: false });
                });

                // 播放器拖拽 (整体)
                const player = document.getElementById('musicPlayer');
                let isDrag = false,
                    ox, oy, sx, sy;
                const onStart = (e) => {
                    if (e.target.closest('.player-cover') || e.target.closest('.player-joystick')) return;
                    const ev = e.touches ? e.touches[0] : e;
                    const rect = player.getBoundingClientRect();
                    ox = ev.clientX - rect.left;
                    oy = ev.clientY - rect.top;
                    sx = rect.left;
                    sy = rect.top;
                    isDrag = true;
                    player.style.cursor = 'grabbing';
                    if (e.cancelable) e.preventDefault();
                };
                const onMove = (e) => {
                    if (!isDrag) return;
                    const ev = e.touches ? e.touches[0] : e;
                    let x = ev.clientX - ox,
                        y = ev.clientY - oy;
                    const safeRight = window.innerWidth - parseFloat(getComputedStyle(document.documentElement)
                        .getPropertyValue('--safe-right') || '0');
                    const safeBottom = window.innerHeight - parseFloat(getComputedStyle(document.documentElement)
                        .getPropertyValue('--safe-bottom') || '0');
                    x = Math.max(0, Math.min(safeRight - player.offsetWidth, x));
                    y = Math.max(0, Math.min(safeBottom - player.offsetHeight, y));
                    player.style.left = x + 'px';
                    player.style.top = y + 'px';
                    MusicManager.savePos();
                    if (e.cancelable) e.preventDefault();
                };
                const onEnd = () => { if (isDrag) { isDrag = false;
                        player.style.cursor = 'grab';
                        MusicManager.savePos(); } };
                player.addEventListener('mousedown', onStart);
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
                player.addEventListener('touchstart', onStart, { passive: false });
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
                document.addEventListener('touchcancel', onEnd);
            }

            // ================================================================
            // 18. 双击空白切换播放器
            // ================================================================
            function initDoubleTapPlayer() {
                document.addEventListener('dblclick', (e) => {
                    const interactive = ['button', 'a', 'input', 'textarea', 'select', '.link-item',
                        '.add-link-btn', '.glass-link', '.glass-add', '.settings-toggle', '.settings-panel',
                        '.modal-overlay', '.player-cover', '.player-joystick', '.quote-area', '.clock-area',
                        '.draggable-item', '#rope-container', '#settingsPanelWrapper', '.search-box',
                        '.glass-search-wrapper', '.search-btn', '.glass-search-btn', '.mode-switch-big',
                        '.type-btn', '.wp-preview-item', '.elem-toggle', '.elem-opacity input',
                        '.settings-module-header', '.quote-item .q-actions button', '#addQuoteBtn',
                        '#modalSave', '#modalCancel', '#modalDelete', '.settings-toggle'
                    ];
                    for (const sel of interactive) { if (e.target.closest(sel)) return; }
                    MusicManager.toggleVisibility();
                });
            }

            // ================================================================
            // 19. 主初始化
            // ================================================================
            function initApp() {
                // 加载模块折叠状态
                const ms = Storage.get('moduleStates');
                if (ms) Object.assign(state.moduleStates, ms);

                // 加载链接
                LinkManager.init();

                // 加载名言
                QuoteManager.init();

                // 加载元素状态
                ElemManager.init();

                // 加载模式
                ModeManager.init();

                // 壁纸管理器 (由ModeManager内部调用)
                // 拖拽
                DragManager.init();

                // 时钟
                ClockManager.init();

                // 拉绳
                RopeManager.init();

                // 音乐
                MusicManager.init();
                bindMusicEvents();

                // 设置UI
                UIManager.init();

                // 开始页
                StartPageManager.init();

                // 双击播放器
                initDoubleTapPlayer();

                // 模态框事件
                document.getElementById('modalSave').addEventListener('click', () => LinkManager.saveLink());
                document.getElementById('modalCancel').addEventListener('click', () => LinkManager.closeEditor());
                document.getElementById('modalDelete').addEventListener('click', () => LinkManager.deleteLink());
                document.getElementById('modalOverlay').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) LinkManager.closeEditor();
                });

                // 搜索框事件
                const searchInput = document.getElementById('searchInput');
                const searchBtn = document.getElementById('searchBtn');
                searchBtn.addEventListener('click', () => LinkManager.search(searchInput.value));
                searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') LinkManager.search(searchInput
                        .value); });

                const glassSearchInput = document.getElementById('glassSearchInput');
                const glassSearchBtn = document.getElementById('glassSearchBtn');
                glassSearchBtn.addEventListener('click', () => {
                    const q = glassSearchInput.value.trim();
                    if (q) window.location.href = `https://www.baidu.com/s?wd=${encodeURIComponent(q)}`;
                });
                glassSearchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const q = glassSearchInput.value.trim();
                        if (q) window.location.href =
                            `https://www.baidu.com/s?wd=${encodeURIComponent(q)}`;
                    }
                });

                // 预加载核心资源
                ResourceLoader.preloadCore(
                    state.currentWallpaperType,
                    state.currentWallpaperId,
                    state.currentSongIndex
                );

                // 窗口resize调整边界
                window.addEventListener('resize', () => {
                    const safeRight = window.innerWidth - parseFloat(getComputedStyle(document.documentElement)
                        .getPropertyValue('--safe-right') || '0');
                    const safeBottom = window.innerHeight - parseFloat(getComputedStyle(document.documentElement)
                        .getPropertyValue('--safe-bottom') || '0');
                    document.querySelectorAll('.draggable-item').forEach(item => {
                        if (item.style.display !== 'none') {
                            let left = parseFloat(item.style.left) || 0;
                            let top = parseFloat(item.style.top) || 0;
                            left = Math.max(0, Math.min(safeRight - item.offsetWidth, left));
                            top = Math.max(0, Math.min(safeBottom - item.offsetHeight, top));
                            item.style.left = left + 'px';
                            item.style.top = top + 'px';
                        }
                    });
                    // 简单模式拖拽边界
                    document.querySelectorAll('.simple-draggable').forEach(el => {
                        const rect = el.getBoundingClientRect();
                        const transform = DragManager._getTransform(el);
                        const tx = transform.x,
                            ty = transform.y;
                        const w = el.offsetWidth || rect.width,
                            h = el.offsetHeight || rect.height;
                        const fixedLeft = rect.left - tx,
                            fixedTop = rect.top - ty;
                        const maxX = safeRight - w - fixedLeft,
                            minX = -fixedLeft;
                        const maxY = safeBottom - h - fixedTop,
                            minY = -fixedTop;
                        let newTX = Math.max(minX, Math.min(maxX, tx));
                        let newTY = Math.max(minY, Math.min(maxY, ty));
                        if (newTX !== tx || newTY !== ty) {
                            el.style.transform = `translate(${newTX}px, ${newTY}px)`;
                            const pos = Storage.get(getStorageKey('simplePositions'), {});
                            pos[el.id] = { x: newTX, y: newTY };
                            Storage.set(getStorageKey('simplePositions'), pos);
                        }
                    });
                });

                console.log('✅ 小永子·灵境 启动成功 (全部六方向优化)');
                console.log('📱 移动端适配 + 键盘支持 + 导入/导出配置');
                console.log('🖱️ 右键锁定元素 | 双击空白切换播放器');
            }

            // 页面加载完成后启动
            if (document.readyState === 'complete') {
                setTimeout(initApp, 100);
            } else {
                window.addEventListener('load', () => setTimeout(initApp, 100));
            }

            // 页面关闭释放资源
            window.addEventListener('beforeunload', () => {
                ResourceLoader.revokeAll();
                if (state.audioPlayer) {
                    state.audioPlayer.pause();
                    state.audioPlayer.src = '';
                }
                if (state.intervalTimer) clearInterval(state.intervalTimer);
                // 清理拖拽监听
                document.querySelectorAll('.simple-draggable, .draggable-item').forEach(el => {
                    if (el._dragCleanup) el._dragCleanup();
                });
            });

        })();
    </script>
</body>
