            // ================================================================
            // 9. 模式切换 (简洁 ↔ 壁纸)
            // ================================================================
            const modeSwitch = document.getElementById('modeSwitch');
            const modeLabel = document.getElementById('modeLabel');
            let isWallpaperMode = false;
            const positions = {};
            const draggableItems = document.querySelectorAll('.draggable-item');

            // ---------- 全局拖拽状态 ----------
            let dragJustHappened = false;
            let dragJustResetTimer = null;
            let currentDraggingItem = null;

            function forceEndAllDrags() {
                draggableItems.forEach(item => {
                    if (item._forceEnd) item._forceEnd();
                });
                if (simpleDragState && simpleDragState.dragging) {
                    endSimpleDrag(null);
                }
                if (dragJustResetTimer) {
                    clearTimeout(dragJustResetTimer);
                    dragJustResetTimer = null;
                }
                dragJustHappened = false;
                currentDraggingItem = null;
            }

            // ---------- 初始化可拖拽元素（壁纸模式） ----------
            function initDraggable(item) {
                let startX, startY, origX, origY;
                let dragging = false;
                let locked = false;

                function forceEnd() {
                    if (dragging) {
                        dragging = false;
                        item.style.cursor = locked ? 'default' : 'grab';
                        item.classList.remove('dragging');
                        if (currentDraggingItem === item) currentDraggingItem = null;
                        if (dragJustResetTimer) {
                            clearTimeout(dragJustResetTimer);
                            dragJustResetTimer = null;
                        }
                        dragJustHappened = false;
                    }
                }
                item._forceEnd = forceEnd;

                function toggleLock(e) {
                    e.stopPropagation();
                    if (dragging) {
                        forceEnd();
                    }
                    locked = !locked;
                    if (locked) {
                        item.classList.add('locked');
                        item.style.cursor = 'default';
                    } else {
                        item.classList.remove('locked');
                        item.style.cursor = 'grab';
                    }
                    if (currentDraggingItem === item) currentDraggingItem = null;
                    dragJustHappened = false;
                    return false;
                }
                item.addEventListener('dblclick', toggleLock);

                function onStart(e) {
                    if (locked) {
                        e.preventDefault();
                        return;
                    }
                    if (currentDraggingItem && currentDraggingItem !== item) {
                        if (currentDraggingItem._forceEnd) currentDraggingItem._forceEnd();
                    }
                    if (e.target.closest('input, textarea')) return;
                    if (e.target.closest('a') && item.id !== 'glassLinks') return;
                    const ev = e.touches ? e.touches[0] : e;
                    const rect = item.getBoundingClientRect();
                    let left = parseFloat(item.style.left) || rect.left;
                    let top = parseFloat(item.style.top) || rect.top;
                    if (!item.style.left) {
                        left = rect.left;
                        item.style.left = left + 'px';
                    }
                    if (!item.style.top) {
                        top = rect.top;
                        item.style.top = top + 'px';
                    }
                    origX = left;
                    origY = top;
                    startX = ev.clientX;
                    startY = ev.clientY;
                    dragging = false;
                    item.style.cursor = 'grabbing';
                    currentDraggingItem = item;
                    if (e.target.closest('a')) e.preventDefault();
                }

                function onMove(e) {
                    if (locked) return;
                    if (!currentDraggingItem || currentDraggingItem !== item) return;
                    const ev = e.touches ? e.touches[0] : e;
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 10) {
                        if (!dragging) {
                            dragging = true;
                            e.preventDefault();
                            dragJustHappened = true;
                            if (dragJustResetTimer) {
                                clearTimeout(dragJustResetTimer);
                                dragJustResetTimer = null;
                            }
                            item.classList.add('dragging');
                        }
                        let newX = origX + dx;
                        let newY = origY + dy;
                        const w = item.offsetWidth;
                        const h = item.offsetHeight;
                        newX = Math.max(0, Math.min(window.innerWidth - w, newX));
                        newY = Math.max(0, Math.min(window.innerHeight - h, newY));
                        item.style.left = newX + 'px';
                        item.style.top = newY + 'px';
                        e.preventDefault();
                    } else {
                        if (e.cancelable) e.preventDefault();
                    }
                }

                function onEnd(e) {
                    if (dragging) {
                        dragging = false;
                        item.style.cursor = locked ? 'default' : 'grab';
                        item.classList.remove('dragging');
                        const id = item.id;
                        if (id) {
                            positions[id] = {
                                left: parseFloat(item.style.left),
                                top: parseFloat(item.style.top)
                            };
                        }
                        if (currentDraggingItem === item) currentDraggingItem = null;
                        if (dragJustResetTimer) clearTimeout(dragJustResetTimer);
                        dragJustResetTimer = setTimeout(() => {
                            dragJustHappened = false;
                            dragJustResetTimer = null;
                        }, 300);
                    } else {
                        if (dragJustResetTimer) clearTimeout(dragJustResetTimer);
                        dragJustResetTimer = setTimeout(() => {
                            dragJustHappened = false;
                            dragJustResetTimer = null;
                        }, 50);
                    }
                }

                item.addEventListener('mousedown', onStart);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onEnd);
                item.addEventListener('touchstart', onStart, { passive: false });
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onEnd, { passive: false });
                window.addEventListener('touchcancel', onEnd, { passive: false });

                item.addEventListener('dragstart', function(e) { e.preventDefault(); }, false);

                item._destroyDrag = function() {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onEnd);
                    window.removeEventListener('touchmove', onMove);
                    window.removeEventListener('touchend', onEnd);
                    window.removeEventListener('touchcancel', onEnd);
                    item.removeEventListener('mousedown', onStart);
                    item.removeEventListener('touchstart', onStart);
                    item.removeEventListener('dragstart', function(e) { e.preventDefault(); });
                    item.removeEventListener('dblclick', toggleLock);
                };
            }

            draggableItems.forEach(item => initDraggable(item));

            document.addEventListener('click', function(e) {
                if (dragJustHappened) {
                    if (e.target.closest('a')) {
                        dragJustHappened = false;
                        if (dragJustResetTimer) {
                            clearTimeout(dragJustResetTimer);
                            dragJustResetTimer = null;
                        }
                        return;
                    }
                    e.stopPropagation();
                    e.preventDefault();
                    return false;
                }
            }, true);

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {

                    setTimeout(forceEndAllDrags, 50);
                }
            });

            window.addEventListener('beforeunload', function() {
                forceEndAllDrags();
            });

            window.addEventListener('load', function() {
                setTimeout(forceEndAllDrags, 100);
            });

            function setDefaultPositions() {
                const w = window.innerWidth,
                    h = window.innerHeight;
                const timeEl = document.getElementById('wallpaperTimeDisplay');
                if (timeEl && !positions['wallpaperTimeDisplay']) {
                    const tw = timeEl.offsetWidth || 200,

                }
                const quoteEl = document.getElementById('wallpaperQuoteDisplay');
                if (quoteEl && !positions['wallpaperQuoteDisplay']) {

                const searchEl = document.getElementById('glassSearch');
                if (searchEl && !positions['glassSearch']) {
                    const sw = searchEl.offsetWidth || 400,

                    positions['glassSearch'] = { left: (w - sw) / 2, top: h * 0.72 };
                }
                const linksEl = document.getElementById('glassLinks');
                if (linksEl && !positions['glassLinks']) {
                    const lw = linksEl.offsetWidth || 120,

            function applyPositions() {
                draggableItems.forEach(item => {
                    const id = item.id;
                    if (positions[id]) {
                        item.style.left = positions[id].left + 'px';

            // ---------- 模式切换 ----------
            modeSwitch.addEventListener('click', function() {
                isWallpaperMode = !isWallpaperMode;
                this.classList.toggle('active', isWallpaperMode);

                    else applyWallpaper(currentWallpaperType, currentWallpaperId);
                    renderWallpaperPreview();
                    document.querySelectorAll('.type-btn').forEach(b => {

                    setDefaultPositions();
                    applyPositions();
                } else {

            window.addEventListener('resize', function() {
                if (!isWallpaperMode) return;
                draggableItems.forEach(item => {
                    const rect = item.getBoundingClientRect();
                    const w = window.innerWidth,
                        h = window.innerHeight;
                    let left = parseFloat(item.style.left) || rect.left;
                    let top = parseFloat(item.style.top) || rect.top;
                    if (left + rect.width > w) left = w - rect.width - 10;
                    if (top + rect.height > h) top = h - rect.height - 10;
                    if (left < 0) left = 0;
                    if (top < 0) top = 0;
                    item.style.left = left + 'px';
                    item.style.top = top + 'px';
                    const id = item.id;
                    if (id) positions[id] = { left, top };
                });
            });

            // ================================================================
            // 10. 简洁模式拖拽（彻底重写，零抖动，全屏范围，跟手）
            // ================================================================
            const simpleDragTargets = document.querySelectorAll('.simple-draggable');

            const dragStateMap = new WeakMap();
            let activeSimpleDrag = null;

            function initSimpleDrag(el) {
                const state = {
                    isDragging: false,
                    startX: 0,
                    startY: 0,
                    baseTX: 0,
                    baseTY: 0,
                    fixedLeft: 0,
                    fixedTop: 0,
                    width: 0,
                    height: 0,
                    rafId: null,
                    pendingX: 0,
                    pendingY: 0,
                    locked: false,
                };
                dragStateMap.set(el, state);

                // --- 切换锁定（双击） ---
                el.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    if (state.isDragging) return;
                    state.locked = !state.locked;
                    if (state.locked) {
                        el.classList.add('locked');
                        el.style.cursor = 'default';
                        if (activeSimpleDrag === el) endSimpleDrag(el);
                    } else {
                        el.classList.remove('locked');
                        el.style.cursor = 'grab';
                    }
                });

                el.addEventListener('pointerdown', function(e) {
                    if (e.target.closest('input') || e.target.closest('textarea') ||
                        e.target.closest('a') || e.target.closest('button') ||
                        e.target.closest('.link-item') || e.target.closest('.add-link-btn') ||
                        e.target.closest('.search-btn') || e.target.closest('.search-btn-mobile') ||
                        e.target.closest('.search-btn-end')) {
                        return;
                    }
                    if (isWallpaperMode) return;
                    if (state.locked) return;

                    if (activeSimpleDrag) {
                        endSimpleDrag(activeSimpleDrag);
                    }

                    const rect = el.getBoundingClientRect();
                    const transform = getElementTransform(el);

                    state.isDragging = false;
                    state.startX = e.clientX;
                    state.startY = e.clientY;
                    state.baseTX = transform.x;
                    state.baseTY = transform.y;
                    state.fixedLeft = rect.left - state.baseTX;
                    state.fixedTop = rect.top - state.baseTY;
                    state.width = el.offsetWidth || rect.width;
                    state.height = el.offsetHeight || rect.height;

                    el.setPointerCapture(e.pointerId);
                    el.style.cursor = 'grabbing';
                    activeSimpleDrag = el;

                    e.preventDefault();
                });

                el.addEventListener('pointermove', function(e) {
                    if (activeSimpleDrag !== el) return;
                    if (state.locked) return;

                    const dx = e.clientX - state.startX;
                    const dy = e.clientY - state.startY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 6) {
                        if (!state.isDragging) {
                            state.isDragging = true;
                            el.classList.add('dragging-simple');
                            const rect = el.getBoundingClientRect();
                            const transform = getElementTransform(el);
                            state.baseTX = transform.x;
                            state.baseTY = transform.y;
                            state.fixedLeft = rect.left - state.baseTX;
                            state.fixedTop = rect.top - state.baseTY;
                            state.startX = e.clientX;
                            state.startY = e.clientY;
                            e.preventDefault();
                            return;
                        }

                        let newTX = state.baseTX + (e.clientX - state.startX);
                        let newTY = state.baseTY + (e.clientY - state.startY);

                        const maxX = window.innerWidth - state.width - state.fixedLeft;
                        const minX = -state.fixedLeft;
                        const maxY = window.innerHeight - state.height - state.fixedTop;
                        const minY = -state.fixedTop;

                        newTX = Math.max(minX, Math.min(maxX, newTX));
                        newTY = Math.max(minY, Math.min(maxY, newTY));

                        // ===== 动态调整名言框宽度，实现实时换行 =====
                        // 仅当元素为 quoteArea 时执行
                        if (el.id === 'quoteArea') {
                            const rectNow = el.getBoundingClientRect();
                            const leftEdge = rectNow.left;
                            // 最大宽度 420px，最小 200px，右侧留边距 32px
                            const availWidth = Math.min(420, Math.max(200, window.innerWidth - leftEdge - 32));
                            el.style.maxWidth = availWidth + 'px';
                        }

                        applyTransformRAF(el, newTX, newTY, state);
                        e.preventDefault();
                    } else {
                        e.preventDefault();
                    }
                }, { passive: false });

                el.addEventListener('pointerup', function(e) {
                    if (activeSimpleDrag !== el) return;
                    endSimpleDrag(el);
                    e.preventDefault();
                });

                el.addEventListener('pointercancel', function(e) {
                    if (activeSimpleDrag === el) endSimpleDrag(el);
                });
            }

            function getElementTransform(el) {
                let tx = 0,
                    ty = 0;
                const style = window.getComputedStyle(el);
                const transform = style.transform;
                if (transform && transform !== 'none') {
                    const matrix = transform.match(/matrix.*\((.+)\)/);
                    if (matrix) {
                        const values = matrix[1].split(', ').map(Number);
                        if (values.length === 6) {
                            tx = values[4] || 0;
                            ty = values[5] || 0;
                        } else if (values.length === 16) {
                            tx = values[12] || 0;
                            ty = values[13] || 0;
                        }
                    }
                }
                return { x: tx, y: ty };
            }

            function applyTransformRAF(el, x, y, state) {
                if (state.rafId) {
                    cancelAnimationFrame(state.rafId);
                    state.rafId = null;
                }
                state.pendingX = x;
                state.pendingY = y;
                state.rafId = requestAnimationFrame(() => {
                    if (el) {
                        el.style.transform = `translate(${state.pendingX}px, ${state.pendingY}px)`;
                    }
                    state.rafId = null;
                });
            }

            function endSimpleDrag(el) {
                if (!el) return;
                const state = dragStateMap.get(el);
                if (!state) return;
                if (state.rafId) {
                    cancelAnimationFrame(state.rafId);
                    state.rafId = null;
                }
                if (state.isDragging) {
                    el.classList.remove('dragging-simple');
                    el.style.cursor = state.locked ? 'default' : 'grab';
                    state.isDragging = false;
                }
                if (activeSimpleDrag === el) activeSimpleDrag = null;
                const rect = el.getBoundingClientRect();
                const transform = getElementTransform(el);
                state.fixedLeft = rect.left - transform.x;
                state.fixedTop = rect.top - transform.y;
            }

            simpleDragTargets.forEach(el => {
                initSimpleDrag(el);
            });

            document.addEventListener('pointerup', function(e) {
                if (activeSimpleDrag) {
                    endSimpleDrag(activeSimpleDrag);
                }
            });

            // ================================================================
            // 11. 时钟
            // ================================================================
            const timeEl = document.getElementById('time');
            const dateEl = document.getElementById('date');
            const wpTimeEl = document.getElementById('wpTime');
            const wpDateEl = document.getElementById('wpDate');

            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const timeStr = h + ':' + m;
                const dateStr =
                    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${'日一二三四五六'[now.getDay()]}`;
                timeEl.textContent = timeStr;
                dateEl.textContent = dateStr;
                wpTimeEl.textContent = timeStr;
                wpDateEl.textContent = dateStr;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // ================================================================
            // 12. 资源预加载 (背景图优先)
            // ================================================================
            const preloaded = { blobs: {} };
            let loadedCount = 0;
            let totalCount = 0;
            let failedCount = 0;

            function updateProgress() {
                loadedCount++;
                const loadingEl = document.querySelector('.start-loading span');
                if (loadingEl) loadingEl.textContent = `加载中 ... ${loadedCount}/${totalCount}${failedCount ? ` (失败 ${failedCount})` : ''}`;
                if (loadedCount >= totalCount) {
                    console.log('✅ 所有资源预加载完成！');
                    if (loadingEl) loadingEl.textContent = '加载完成 ✦ 点击进入';
                }
            }

            async function preloadAllResources() {
                totalCount = songs.length + albumImages.length + wallpapers.static.length + wallpapers.dynamic.length + 2;
                console.log(`🎯 预加载启动，共 ${totalCount} 个资源（背景图优先）`);

                await new Promise((resolve) => {
                    const bgImg = new Image();
                    bgImg.onload = function() {
                        console.log('🖼️ 开始页背景图加载完成！');
                        startPage.style.backgroundImage = 'url(images/background.png)';
                        startPage.classList.remove('loading');
                        startPageReady = true;
                        const loadingEl = document.querySelector('.start-loading span');
                        if (loadingEl) loadingEl.textContent = '加载完成 ✦ 点击进入';
                        resolve();
                    };
                    bgImg.onerror = function() {
                        console.warn('⚠️ 背景图加载失败，使用纯色后备');
                        startPage.classList.remove('loading');
                        startPageReady = true;
                        const loadingEl = document.querySelector('.start-loading span');
                        if (loadingEl) loadingEl.textContent = '加载完成 ✦ 点击进入';
                        resolve();
                    };
                    bgImg.src = 'images/background.png';
                });

                await new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => { updateProgress();
                        resolve(); };
                    img.onerror = () => { failedCount++;
                        updateProgress();
                        resolve(); };
                    img.src = 'images/bg_day.png';
                });

                await new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => { updateProgress();
                        resolve(); };
                    img.onerror = () => { failedCount++;
                        updateProgress();
                        resolve(); };
                    img.src = 'images/bg_night.png';
                });

                for (const song of songs) {
                    try {
                        const resp = await fetch('songs/' + song.file);
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        const blob = await resp.blob();
                        preloaded.blobs[song.file] = URL.createObjectURL(blob);
                        console.log(`🎵 歌曲已缓存: ${song.file}`);
                    } catch (e) {
                        failedCount++;
                        console.warn('⚠️ 预加载歌曲失败:', song.file, e);
                    }
                    updateProgress();
                }

                for (const src of albumImages) {
                    try {
                        await new Promise((resolve) => {
                            const img = new Image();
                            img.onload = () => { updateProgress();
                                resolve(); };
                            img.onerror = () => { failedCount++;
                                updateProgress();
                                resolve(); };
                            img.src = src;
                        });
                    } catch (e) { failedCount++; updateProgress(); }
                }

                for (const wp of wallpapers.static) {
                    try {
                        await new Promise((resolve) => {
                            const img = new Image();
                            img.onload = () => { updateProgress();
                                resolve(); };
                            img.onerror = () => { failedCount++;
                                updateProgress();
                                resolve(); };
                            img.src = 'images/' + wp.file;
                        });
                    } catch (e) { failedCount++; updateProgress(); }
                }

                for (const wp of wallpapers.dynamic) {
                    try {
                        const resp = await fetch('videos/' + wp.file);
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        const blob = await resp.blob();
                        preloaded.blobs[wp.id] = URL.createObjectURL(blob);
                        console.log(`📹 视频已缓存: ${wp.file}`);
                    } catch (e) {
                        failedCount++;
                        console.warn('⚠️ 预加载视频失败:', wp.file, e);
                    }
                    updateProgress();
                }

                console.log('🎉 全部资源预加载完成！');
            }

            if (document.readyState === 'complete') setTimeout(preloadAllResources, 100);
            else window.addEventListener('load', function() { setTimeout(preloadAllResources, 100); });

            // ================================================================
            // 13. 设置简洁模式默认初始位置（左上、右下、左下）
            // ================================================================
            function setDefaultSimplePositions() {
                const clockArea = document.getElementById('clockArea');
                const quoteArea = document.getElementById('quoteArea');
                const bottomArea = document.getElementById('bottomArea');

                // 时间在左上方: 向左移动约 18vw
                if (clockArea) {
                    clockArea.style.transform = 'translate(-18vw, 0)';
                }
                // 名言在右下角: 向右移动 12vw，向下移动 2vh
                if (quoteArea) {
                    quoteArea.style.transform = 'translate(12vw, 2vh)';
                    // 初始设置 max-width
                    quoteArea.style.maxWidth = '420px';
                }
                // 链接在左下角: 向左移动 18vw
                if (bottomArea) {
                    bottomArea.style.transform = 'translate(-18vw, 0)';
                }

                // 更新各区域的 dragState 中的 baseTX/baseTY，防止拖拽时跳变
                [clockArea, quoteArea, bottomArea].forEach(el => {
                    if (!el) return;
                    const state = dragStateMap.get(el);
                    if (!state) return;
                    const t = getElementTransform(el);
                    state.baseTX = t.x;
                    state.baseTY = t.y;
                    const rect = el.getBoundingClientRect();
                    state.fixedLeft = rect.left - state.baseTX;
                    state.fixedTop = rect.top - state.baseTY;
                });
            }

            if (document.readyState === 'complete') {
                setTimeout(setDefaultSimplePositions, 50);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(setDefaultSimplePositions, 50);
                });
            }

            // ================================================================
            // 14. 初始化
            // ================================================================
            setDayNight('day');
            body.classList.remove('wallpaper-mode');
            document.getElementById('modeSwitch').classList.remove('active');
            document.getElementById('modeLabel').textContent = '简洁';
            draggableItems.forEach(item => { item.style.display = 'none'; });
            updateGlassOpacity(0.7);

            console.log('✅ 新拟态 · 简洁/壁纸模式 · 拖拽彻底修复');
            console.log('🖱️ 简洁模式：全屏跟手拖拽，边界停稳不弹回');
            console.log('🖱️ 壁纸模式：双击锁定/解锁，解锁即释放所有拖拽状态，不再粘手');
            console.log('📐 默认位置：时间左上，名言右下，链接左下');
            console.log('📐 名言 & 链接左对齐');
            console.log('📐 简洁名言拖拽时宽度随位置实时变化，自动换行');
        })();
    </script>
</body>
