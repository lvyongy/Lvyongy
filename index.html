                    saveSimple(CONFIG.KEYS.QUOTE_INTERVAL, this.quoteInterval);
                    saveSimple(CONFIG.KEYS.NIGHT_MODE, this.currentMode === 'night');
                    saveSimple(CONFIG.KEYS.WALLPAPER_TYPE, this.currentWallpaperType);
                    saveSimple(CONFIG.KEYS.WALLPAPER_ID, this.currentWallpaperId);
                    saveSimple(CONFIG.KEYS.IS_WALLPAPER_MODE, this.isWallpaperMode);
                    saveSimple(CONFIG.KEYS.QUOTE_LOCKED, this.quoteLocked);
                    saveSimple(CONFIG.KEYS.SEARCH_VISIBLE, this.searchVisible);
                    saveData(CONFIG.KEYS.ELEM_STATE, this.elemState);
                    saveSimple(CONFIG.KEYS.MODULE_STATES, this.moduleStates);
                    // 其他独立存储分别调用
                },

                getDefaultElemState() {
                    const s = {};
                    [...CONFIG.ELEM_DEFS.simple, ...CONFIG.ELEM_DEFS.wallpaper].forEach(def => {
                        s[def.id] = {
                            visible: def.defaultVisible,
                            opacity: def.defaultOpacity

                // ================================================================
                // 3. 时钟
                // ================================================================
                initClock() {
                    const update = () => {
                        const now = new Date();
                        const h = String(now.getHours()).padStart(2, '0');
                        const m = String(now.getMinutes()).padStart(2, '0');
                        const timeStr = h + ':' + m;
                        const dateStr =
                            `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${'日一二三四五六'[now.getDay()]}`;
                        this.els.time.textContent = timeStr;
                        this.els.date.textContent = dateStr;
                        this.els.wpTime.textContent = timeStr;
                        this.els.wpDate.textContent = dateStr;
                    };
                    update();
                    setInterval(update, 1000);
                },

                // ================================================================
                // 4. 日夜切换 (拉绳)
                // ================================================================
                setDayNight(mode) {
                    if (mode === this.currentMode) return;
                    this.currentMode = mode;
                    document.body.classList.toggle('night-mode', mode === 'night');
                    const sun = document.querySelector('.icon-sun');
                    const moon = document.querySelector('.icon-moon');
                    if (sun && moon) {
                        sun.style.display = mode === 'day' ? 'inline-block' : 'none';
                        moon.style.display = mode === 'night' ? 'inline-block' : 'none';
                    }
                    this.saveAllSettings();
                },

                initRope() {
                    const ropeHandle = this.els.ropeHandle;
                    const ropeLine = this.els.ropeLine;
                    let isDragging = false,
                        startY = 0,
                        pull = 0,
                        triggered = false;
                    const MAX_PULL = 120,
                        THRESHOLD = 70;

                    const reset = (animate = true) => {
                        if (animate) {
                            ropeLine.style.transition = 'height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                            ropeHandle.style.transition = 'top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                        } else {
                            ropeLine.style.transition = 'none';
                            ropeHandle.style.transition = 'none';
                        }
                        ropeLine.style.height = '60px';
                        ropeHandle.style.top = '72px';
                        pull = 0;
                        triggered = false;
                        if (animate) {
                            setTimeout(() => {
                                ropeLine.style.transition = 'height 0.15s ease-out';
                                ropeHandle.style.transition = 'none';
                            }, 550);
                        } else {
                            ropeLine.style.transition = 'height 0.15s ease-out';
                            ropeHandle.style.transition = 'none';
                        }
                    };

                    const update = (dy) => {
                        const p = Math.max(0, Math.min(dy, MAX_PULL));
                        ropeLine.style.height = (60 + p) + 'px';
                        ropeHandle.style.top = (72 + p) + 'px';
                        pull = p;
                    };

                    const trigger = () => {
                        if (triggered) return;
                        triggered = true;
                        this.setDayNight(this.currentMode === 'day' ? 'night' : 'day');
                    };

                    const onStart = (e) => {
                        e.preventDefault();
                        isDragging = true;
                        startY = e.clientY || (e.touches && e.touches[0].clientY);
                        triggered = false;
                        ropeLine.style.transition = 'none';
                        ropeHandle.style.transition = 'none';
                    };

                    const onMove = (e) => {
                        if (!isDragging) return;
                        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                        const dy = clientY - startY;
                        update(Math.max(0, dy));
                        if (pull >= THRESHOLD && !triggered) trigger();
                    };

                    const onEnd = () => {
                        if (isDragging) {
                            isDragging = false;
                            if (pull >= THRESHOLD && !triggered) trigger();
                            reset(true);
                        }
                    };

                    // Pointer Events 统一
                    ropeHandle.addEventListener('pointerdown', onStart);
                    document.addEventListener('pointermove', onMove);
                    document.addEventListener('pointerup', onEnd);
                    document.addEventListener('pointercancel', onEnd);
                    // 兼容 touch
                    ropeHandle.addEventListener('touchstart', onStart, { passive: false });
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd, { passive: false });
                    document.addEventListener('touchcancel', onEnd, { passive: false });

                    reset(false);
                },

                // ================================================================
                // 5. 语录系统
                // ================================================================
                initQuotes() {
                    const qArea = this.els.quoteArea;
                    const wqDisplay = this.els.wallpaperQuoteDisplay;
                    const qText = this.els.quoteText;
                    const qAuthor = this.els.quoteAuthor;
                    const wqText = this.els.wqText;
                    const wqAuthor = this.els.wqAuthor;

                    const showQuote = (index) => {
                        if (!this.quotes.length) {
                            qText.textContent = '暂无名言';
                            qAuthor.textContent = '';
                            wqText.textContent = '暂无名言';
                            wqAuthor.textContent = '';
                            return;
                        }
                        const q = this.quotes[index % this.quotes.length];
                        qText.textContent = q.text;
                        qAuthor.textContent = '— ' + q.author;
                        wqText.textContent = q.text;
                        wqAuthor.textContent = '— ' + q.author;
                        // 简单淡入动画
                        qText.classList.remove('fade');
                        void qText.offsetWidth;
                        qText.classList.add('fade');
                        setTimeout(() => {
                            qText.textContent = q.text;
                            qText.classList.remove('fade');
                        }, 50);
                        wqText.classList.remove('fade');
                        void wqText.offsetWidth;
                        wqText.classList.add('fade');
                        setTimeout(() => {
                            wqText.textContent = q.text;
                            wqText.classList.remove('fade');
                        }, 50);
                    };

                    const nextQuote = () => {
                        if (!this.quoteLocked && this.quotes.length > 1) {
                            this.quoteIndex = (this.quoteIndex + 1) % this.quotes.length;
                            showQuote(this.quoteIndex);
                        }
                    };

                    const restartInterval = () => {
                        if (this.intervalTimer) clearInterval(this.intervalTimer);
                        if (this.quoteInterval > 0 && this.quotes.length > 1) {
                            this.intervalTimer = setInterval(nextQuote, this.quoteInterval);
                        }
                    };

                    // 暴露方法
                    this._showQuote = showQuote;
                    this._restartQuoteInterval = restartInterval;

                    // 锁定切换
                    const toggleLock = () => {
                        this.quoteLocked = !this.quoteLocked;
                        qArea.classList.toggle('locked', this.quoteLocked);
                        qArea.style.cursor = this.quoteLocked ? 'default' : 'pointer';
                        wqDisplay.classList.toggle('locked', this.quoteLocked);
                        this.saveAllSettings();
                    };

                    qArea.addEventListener('contextmenu', (e) => { e.preventDefault();
                        toggleLock(); });
                    wqDisplay.addEventListener('contextmenu', (e) => { e.preventDefault();
                        toggleLock(); });

                    // 点击换句
                    const handleClick = (e) => {
                        if (this.quoteLocked) return;
                        if (e.target.closest('.settings-panel') || e.target.closest('.settings-toggle')) return;
                        nextQuote();
                    };
                    qArea.addEventListener('click', handleClick);
                    wqDisplay.addEventListener('click', handleClick);

                    // 初始化
                    if (this.quotes.length === 0) {
                        this.quotes = CONFIG.DEFAULT_QUOTES.map(q => ({ ...q }));
                    }
                    showQuote(0);
                    restartInterval();
                    if (this.quoteLocked) {
                        qArea.classList.add('locked');
                        qArea.style.cursor = 'default';
                        wqDisplay.classList.add('locked');
                    }

                    // 保存到App
                    this._restartInterval = restartInterval;
                },

                            endBtn.addEventListener('click', this.toggleSearch.bind(this));

                            endBtn.addEventListener('mouseup', () => endBtn.classList.remove('pressed'));

                            a.dataset.index = idx;
                            a.addEventListener('contextmenu', (e) => { e.preventDefault();

                                this.openEditor(idx); });
                            glassGrid.appendChild(a);
                        });

                        glassAdd.className = 'glass-add';
                        glassAdd.textContent = '＋';
                        glassAdd.addEventListener('click', () => this.openEditor(-1));
                        glassGrid.appendChild(glassAdd);

                        // 搜索框可见性

                        } else {
                            wrapper.classList.add('hidden');
                            if (wrapper.contains(this.els.searchBtn)) wrapper.removeChild(this.els.searchBtn);

                    // 模态框逻辑
                    const modal = this.els.modalOverlay;

                    const modalTitle = this.els.modalTitle;
                    const modalSave = this.els.modalSave;
                    const modalCancel = this.els.modalCancel;
                    const modalDelete = this.els.modalDelete;

                    this.openEditor = (index) => {
                        this.editingIndex = index;
                        if (index === -1) {
                            modalTitle.textContent = '添加新链接';
                            modalText.value = '';
                            modalUrl.value = '';
                            modalDelete.style.display = 'none';
                        } else {
                            modalTitle.textContent = '编辑链接';
                            modalText.value = this.links[index].text;
                            modalUrl.value = this.links[index].url;
                            modalDelete.style.display = 'inline-block';
                        }
                        modal.classList.add('active');
                        modalText.focus();
                    };

                    const closeEditor = () => {
                        modal.classList.remove('active');
                        this.editingIndex = -1;
                    };

                    const saveLink = () => {
                        const text = modalText.value.trim();
                        const url = modalUrl.value.trim();
                        if (!text || !url) { showToast('请填写完整信息'); return; }
                        if (!isValidUrl(url)) {
                            showToast('链接地址无效，仅支持 http, https, ftp, mailto, tel 协议');
                            return;
                        }
                        const safeUrl = sanitizeUrl(url);
                        if (this.editingIndex === -1) this.links.push({ text, url: safeUrl });
                        else this.links[this.editingIndex] = { text, url: safeUrl };
                        this._renderLinks();
                        closeEditor();
                        this.saveAllSettings();
                    };

                    const deleteLink = () => {
                        if (this.editingIndex === -1) return;
                        if (confirm('确定删除？')) {
                            this.links.splice(this.editingIndex, 1);
                            this._renderLinks();
                            closeEditor();
                            this.saveAllSettings();
                        }
                    };

                    modalSave.addEventListener('click', saveLink);
                    modalCancel.addEventListener('click', closeEditor);
                    modalDelete.addEventListener('click', deleteLink);
                    modal.addEventListener('click', (e) => { if (e.target === modal) closeEditor(); });
                    modalText.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveLink(); if (e.key ===
                            'Escape') closeEditor(); });
                    modalUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveLink(); if (e.key ===
                            'Escape') closeEditor(); });

                toggleSearch() {

                    this._renderLinks();
                    this.saveAllSettings();
                },

                initSearch() {
                    const searchInput = this.els.searchInput;
                    const searchBtn = this.els.searchBtn;
                    const glassInput = this.els.glassSearchInput;
                    const glassBtn = this.els.glassSearchBtn;

                    const doSearch = (query) => {
                        if (query) window.location.href = `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`;
                        else if (this.searchVisible) this.toggleSearch();
                    };

                    searchBtn.addEventListener('click', () => doSearch(searchInput.value.trim()));
                    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(searchInput.value
                            .trim()); });

                    const doGlassSearch = () => {
                        const q = glassInput.value.trim();
                        if (q) window.location.href = `https://www.baidu.com/s?wd=${encodeURIComponent(q)}`;
                    };
                    glassBtn.addEventListener('click', doGlassSearch);
                    glassInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doGlassSearch(); });
                },

                // ================================================================
                // 7. 壁纸系统
                // ================================================================
                applyWallpaper(type, id) {
                    if (!this.resourceReady) {
                        // 延迟到资源加载完成
                        setTimeout(() => this.applyWallpaper(type, id), 500);
                        return;
                    }
                    const list = CONFIG.WALLPAPERS[type];
                    if (!list) return;
                    const item = list.find(w => w.id === id);
                    if (!item) return;

                    const video = this.els.wallpaperVideo;
                    const img = this.els.wallpaperImg;
                    const container = this.els.wallpaperContainer;

                    // 淡出当前
                    const active = video.classList.contains('active') ? video :
                        (img.classList.contains('active') ? img : null);
                    if (active) {
                        active.classList.remove('active');
                        active.classList.add('fade-out');
                    }

                    setTimeout(() => {
                        video.classList.remove('active', 'fade-out');
                        img.classList.remove('active', 'fade-out');

                        const onLoaded = () => {
                            if (type === 'dynamic') {
                                video.classList.add('active');
                                this.detectBrightnessVideo(video);
                            } else {
                                img.classList.add('active');
                                this.detectBrightnessImage(img);
                            }
                            // 更新预览高亮
                            document.querySelectorAll('.wp-preview-item').forEach(el => {
                                el.classList.toggle('active', el.dataset.id === id && el.dataset.type ===
                                    type);
                            });
                            this.currentWallpaperType = type;
                            this.currentWallpaperId = id;
                            this.saveAllSettings();
                        };

                        if (type === 'dynamic') {
                            const src = this.preloaded.blobs[item.id] || 'videos/' + item.file;
                            const source = video.querySelector('source') || document.createElement('source');
                            source.setAttribute('src', src);
                            if (!video.querySelector('source')) {
                                source.setAttribute('type', 'video/mp4');
                                video.appendChild(source);
                            }
                            video.load();
                            video.loop = true;
                            video.play().catch(() => {});
                            video.oncanplaythrough = () => { onLoaded();
                                video.oncanplaythrough = null; };
                            // 超时兜底
                            setTimeout(() => { if (!video.classList.contains('active')) onLoaded(); }, 2000);
                        } else {
                            img.src = 'images/' + item.file;
                            img.onload = () => { onLoaded();
                                img.onload = null;
                                img.onerror = null; };
                            img.onerror = () => { onLoaded();
                                img.onerror = null; };
                            setTimeout(() => { if (!img.classList.contains('active')) onLoaded(); }, 2000);
                        }
                    }, 800);
                },

                detectBrightnessImage(img) {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 64;
                        canvas.height = 64;
                        ctx.drawImage(img, 0, 0, 64, 64);
                        const data = ctx.getImageData(0, 0, 64, 64).data;
                        let sum = 0;
                        for (let i = 0; i < data.length; i += 4) {
                            sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        }
                        const avg = sum / (data.length / 4);
                        this.wallpaperBrightness = avg < 128 ? 'dark' : 'light';
                        document.body.setAttribute('data-brightness', this.wallpaperBrightness);
                    } catch (_) {}
                },

                detectBrightnessVideo(video) {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 64;
                        canvas.height = 64;
                        ctx.drawImage(video, 0, 0, 64, 64);
                        const data = ctx.getImageData(0, 0, 64, 64).data;
                        let sum = 0;
                        for (let i = 0; i < data.length; i += 4) {
                            sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        }
                        const avg = sum / (data.length / 4);
                        this.wallpaperBrightness = avg < 128 ? 'dark' : 'light';
                        document.body.setAttribute('data-brightness', this.wallpaperBrightness);
                    } catch (_) {}
                },

                toggleMode() {
                    this.isWallpaperMode = !this.isWallpaperMode;
                    const body = document.body;
                    if (this.isWallpaperMode) {
                        body.classList.add('wallpaper-mode');
                        this.applyWallpaper(this.currentWallpaperType, this.currentWallpaperId);
                        document.querySelectorAll('.draggable-item').forEach(el => {
                            if (el.id === 'glassSearch' || el.id === 'glassLinks') el.style.display = 'flex';
                            else el.style.display = 'block';
                        });
                        this.loadWallpaperPositions();
                        this.loadWallpaperLocks();
                    } else {
                        body.classList.remove('wallpaper-mode');
                        this.els.wallpaperVideo.classList.remove('active', 'fade-out');
                        this.els.wallpaperImg.classList.remove('active', 'fade-out');
                        body.removeAttribute('data-brightness');
                        document.querySelectorAll('.draggable-item').forEach(el => { el.style.display = 'none'; });
                        this.setDayNight(this.currentMode);
                    }
                    this.applyElemState();
                    this._renderSettings();
                    this.updateModeSwitchUI();
                    this.saveAllSettings();
                },

                // ================================================================
                // 8. 元素控制 (visible/opacity)
                // ================================================================
                applyElemState() {
                    const allDefs = [...CONFIG.ELEM_DEFS.simple, ...CONFIG.ELEM_DEFS.wallpaper];
                    allDefs.forEach(def => {
                        const state = this.elemState[def.id];
                        if (!state) return;
                        const el = def.getEl();
                        if (!el) return;
                        if (state.visible) {
                            if (el.classList.contains('hidden')) el.classList.remove('hidden');
                            if (def.id === 'musicPlayer') {
                                if (!el.classList.contains('active')) el.classList.add('active');
                            }
                        } else {
                            if (def.id === 'musicPlayer') {
                                el.classList.remove('active');
                            } else {
                                el.classList.add('hidden');
                            }
                        }
                        el.style.opacity = state.opacity;
                    });
                    // 同步播放器可见状态
                    this.musicPlayerVisible = this.elemState['musicPlayer']?.visible || false;
                },

                // ================================================================
                // 9. 设置面板 (增量渲染)
                // ================================================================
                initSettings() {
                    const toggleBtn = this.els.wallpaperSettingsBtn;
                    const panel = this.els.settingsPanel;
                    let isOpen = false;

                    const render = () => {
                        this._renderSettings();
                    };

                    const toggle = (e) => {
                        e.stopPropagation();
                        isOpen = !isOpen;
                        panel.classList.toggle('open', isOpen);
                        if (isOpen) {
                            render();
                            // 恢复折叠状态
                            document.querySelectorAll('.settings-module').forEach(mod => {
                                const name = mod.dataset.module;
                                if (name && this.moduleStates[name] !== undefined) {
                                    const body = mod.querySelector('.settings-module-body');
                                    const arrow = mod.querySelector('.arrow');
                                    if (body) body.classList.toggle('collapsed', !this.moduleStates[name]);
                                    if (arrow) arrow.classList.toggle('collapsed', !this.moduleStates[name]);
                                }
                            });
                        }
                    };

                    toggleBtn.addEventListener('click', toggle);

                    // 点击外部关闭
                    document.addEventListener('click', (e) => {
                        if (isOpen && !panel.contains(e.target) && e.target !== toggleBtn && !toggleBtn
                            .contains(e.target)) {
                            panel.classList.remove('open');
                            isOpen = false;
                        }
                    });

                    this._settingsToggle = toggle;
                },

                _renderSettings() {
                    const container = this.els.settingsDynamicContent;
                    container.innerHTML = '';

                    // 模式模块
                    const modeModule = this._createModeModule();
                    container.appendChild(modeModule);

                    // 壁纸模块 (仅壁纸模式)
                    if (this.isWallpaperMode) {
                        const wpModule = this._createWallpaperModule();
                        container.appendChild(wpModule);
                    }

                    // 元素控制
                    const elemModule = this._createElementsModule();
                    container.appendChild(elemModule);

                    // 语录模块
                    const quoteModule = this._createQuotesModule();
                    container.appendChild(quoteModule);

                    // 绑定模块折叠
                    container.querySelectorAll('[data-module-toggle]').forEach(header => {
                        header.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const name = header.dataset.moduleToggle;
                            if (this.moduleStates[name] !== undefined) {
                                this.moduleStates[name] = !this.moduleStates[name];
                                const body = header.closest('.settings-module').querySelector(
                                    '.settings-module-body');
                                const arrow = header.querySelector('.arrow');
                                if (body) body.classList.toggle('collapsed', !this.moduleStates[name]);
                                if (arrow) arrow.classList.toggle('collapsed', !this.moduleStates[name]);
                                this.saveAllSettings();
                            }
                        });
                    });

                    // 模式切换
                    const bigSwitch = container.querySelector('#modeSwitchBig');
                    if (bigSwitch) {
                        bigSwitch.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.toggleMode();
                        });
                    }

                    // 壁纸类型按钮
                    container.querySelectorAll('.type-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const type = btn.dataset.type;
                            this.currentWallpaperType = type;
                            const items = CONFIG.WALLPAPERS[type] || [];
                            if (items.length && !items.some(w => w.id === this.currentWallpaperId)) {
                                this.currentWallpaperId = items[0].id;
                            }
                            this._updateWallpaperPreview(type, this.currentWallpaperId);
                            this.saveAllSettings();
                        });
                    });

                    // 元素控制
                    container.querySelectorAll('.elem-control').forEach(row => {
                        const id = row.dataset.elemId;
                        const state = this.elemState[id];
                        if (!state) return;
                        const toggle = row.querySelector('.elem-toggle');
                        const range = row.querySelector('.elem-opacity input[type="range"]');
                        const valDisplay = row.querySelector('.elem-opacity-value');

                        toggle.addEventListener('click', (e) => {
                            e.stopPropagation();
                            state.visible = !state.visible;
                            toggle.classList.toggle('active', state.visible);
                            this.applyElemState();
                            this.saveAllSettings();
                        });

                        range.addEventListener('input', () => {
                            const val = parseFloat(range.value);
                            state.opacity = val;
                            this.applyElemState();
                            this.saveAllSettings();
                            if (valDisplay) valDisplay.textContent = Math.round(val * 100) + '%';
                        });
                    });

                    // 语录管理
                    const manager = container.querySelector('#quoteManager');
                    if (manager) {
                        manager.querySelectorAll('.edit-btn').forEach(btn => {
                            btn.addEventListener('click', () => {
                                const idx = parseInt(btn.dataset.index);
                                const q = this.quotes[idx];
                                if (!q) return;
                                const newText = prompt('编辑语录内容：', q.text);
                                if (newText !== null) {
                                    const newAuthor = prompt('编辑作者：', q.author);
                                    if (newAuthor !== null) {
                                        this.quotes[idx] = { text: newText.trim(),
                                        author: newAuthor.trim() };
                                        this.saveAllSettings();
                                        this._renderSettings();
                                        if (this.quoteIndex === idx) this._showQuote(idx);
                                        this._restartQuoteInterval();
                                    }
                                }
                            });
                        });
                        manager.querySelectorAll('.del-btn').forEach(btn => {
                            btn.addEventListener('click', () => {
                                const idx = parseInt(btn.dataset.index);
                                if (confirm('确定删除此语录？')) {
                                    this.quotes.splice(idx, 1);
                                    this.saveAllSettings();
                                    if (!this.quotes.length) {
                                        this.quotes = CONFIG.DEFAULT_QUOTES.map(q => ({ ...q }));
                                        this.saveAllSettings();
                                    }
                                    if (this.quoteIndex >= this.quotes.length) this.quoteIndex = 0;
                                    this._showQuote(this.quoteIndex);
                                    this._renderSettings();
                                    this._restartQuoteInterval();
                                }
                            });
                        });

                    const addBtn = container.querySelector('#addQuoteBtn');
                    const newText = container.querySelector('#newQuoteText');
                    const newAuthor = container.querySelector('#newQuoteAuthor');
                    if (addBtn) {
                        addBtn.addEventListener('click', () => {
                            const text = newText.value.trim();
                            const author = newAuthor.value.trim();
                            if (!text) { showToast('请输入语录内容'); return; }
                            this.quotes.push({ text, author: author || '佚名' });
                            this.saveAllSettings();
                            newText.value = '';
                            newAuthor.value = '';
                            this._renderSettings();
                            this._restartQuoteInterval();
                            showToast('语录已添加');
                        });
                    }

                    const intervalInput = container.querySelector('#intervalInput');
                    if (intervalInput) {
                        intervalInput.addEventListener('change', () => {
                            let val = parseInt(intervalInput.value);
                            if (isNaN(val) || val < 1) val = 1;
                            if (val > 300) val = 300;
                            intervalInput.value = val;
                            this.quoteInterval = val * 1000;
                            this.saveAllSettings();
                            this._restartQuoteInterval();
                            showToast('间隔已更新');
                        });
                    }

                    // 更新壁纸预览
                    if (this.isWallpaperMode) {
                        this._updateWallpaperPreview(this.currentWallpaperType, this.currentWallpaperId);
                    }
                    this.updateModeSwitchUI();
