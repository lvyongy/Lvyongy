                // ================================================================
                // 10. 修仙模式拖拽 (统一 Pointer)
                // ================================================================
                initDraggables() {
                    const items = document.querySelectorAll('.draggable-item');
                    items.forEach(item => {
                        let locked = false;
                        let dragging = false;
                        let startX, startY, origX, origY;

                        const onStart = (e) => {
                            if (e.target.closest('.settings-panel') || e.target.closest('.settings-toggle') ||
                                e.target.closest('a') || e.target.closest('button') || e.target.closest(
                                    'input')) return;
                            if (locked) { e.preventDefault(); return; }
                            const ev = e.touches ? e.touches[0] : e;
                            const rect = item.getBoundingClientRect();
                            let left = parseFloat(item.style.left) || rect.left;
                            let top = parseFloat(item.style.top) || rect.top;
                            if (!item.style.left) { left = rect.left;
                                item.style.left = left + 'px'; }
                            if (!item.style.top) { top = rect.top;
                                item.style.top = top + 'px'; }
                            origX = left;
                            origY = top;
                            startX = ev.clientX;
                            startY = ev.clientY;
                            dragging = false;
                            item.style.cursor = 'grabbing';
                            e.preventDefault();
                        };

                        const onMove = (e) => {
                            if (!dragging) {
                                const ev = e.touches ? e.touches[0] : e;
                                const dx = ev.clientX - startX;
                                const dy = ev.clientY - startY;
                                if (Math.sqrt(dx * dx + dy * dy) > 8) {
                                    dragging = true;
                                    item.classList.add('dragging');
                                    e.preventDefault();
                                } else return;
                            }
                            const ev = e.touches ? e.touches[0] : e;
                            let newX = origX + (ev.clientX - startX);
                            let newY = origY + (ev.clientY - startY);
                            const w = item.offsetWidth,
                                h = item.offsetHeight;
                            const safeRight = window.innerWidth - parseFloat(getComputedStyle(document
                                .documentElement).getPropertyValue('--safe-right') || '0');
                            const safeBottom = window.innerHeight - parseFloat(getComputedStyle(document
                                .documentElement).getPropertyValue('--safe-bottom') || '0');
                            newX = Math.max(0, Math.min(safeRight - w, newX));
                            newY = Math.max(0, Math.min(safeBottom - h, newY));
                            item.style.left = newX + 'px';
                            item.style.top = newY + 'px';
                            // 语录自适应宽度
                            if (item.id === 'wallpaperQuoteDisplay') {
                                const rect = item.getBoundingClientRect();
                                const leftDist = rect.left;
                                const availWidth = Math.min(420, Math.max(180, window.innerWidth - leftDist -
                                    24));
                                item.style.maxWidth = availWidth + 'px';
                                const fontSize = Math.max(0.7, Math.min(1.2, availWidth / 350));
                                const wqText = item.querySelector('.wq-text');
                                if (wqText) wqText.style.fontSize = fontSize + 'rem';
                            }
                            e.preventDefault();
                        };

                        const onEnd = () => {
                            if (dragging) {
                                dragging = false;
                                item.classList.remove('dragging');
                                item.style.cursor = locked ? 'default' : 'grab';
                                const id = item.id;
                                if (id) {
                                    const pos = { left: parseFloat(item.style.left), top: parseFloat(item.style
                                            .top) };
                                    this._saveWallpaperPos(id, pos);
                                }
                            }
                        };

                        // 右键锁定
                        item.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            if (dragging) return;
                            locked = !locked;
                            item.classList.toggle('locked', locked);
                            item.style.cursor = locked ? 'default' : 'grab';
                            this._saveWallpaperLock(item.id, locked);
                        });

                        // Pointer Events
                        item.addEventListener('pointerdown', onStart);
                        document.addEventListener('pointermove', onMove);
                        document.addEventListener('pointerup', onEnd);
                        document.addEventListener('pointercancel', onEnd);
                        // Touch fallback
                        item.addEventListener('touchstart', onStart, { passive: false });
                        document.addEventListener('touchmove', onMove, { passive: false });
                        document.addEventListener('touchend', onEnd, { passive: false });
                        document.addEventListener('touchcancel', onEnd, { passive: false });

                        // 阻止默认拖拽
                        item.addEventListener('dragstart', (e) => e.preventDefault(), false);

                        // 保存清理
                        item._cleanupDrag = () => {
                            document.removeEventListener('pointermove', onMove);
                            document.removeEventListener('pointerup', onEnd);
                            document.removeEventListener('pointercancel', onEnd);
                            document.removeEventListener('touchmove', onMove);
                            document.removeEventListener('touchend', onEnd);
                            document.removeEventListener('touchcancel', onEnd);
                        };
                    });
                    // 加载保存的位置
                    this.loadWallpaperPositions();
                    this.loadWallpaperLocks();
                },

                _saveWallpaperPos(id, pos) {
                    const key = getStorageKey(CONFIG.KEYS.WALLPAPER_POSITIONS);
                    const data = loadSimple(key, {});
                    data[id] = pos;
                    saveSimple(key, data);
                },

                loadWallpaperPositions() {
                    const key = getStorageKey(CONFIG.KEYS.WALLPAPER_POSITIONS);
                    const data = loadSimple(key, {});
                    document.querySelectorAll('.draggable-item').forEach(el => {
                        const id = el.id;
                        if (id && data[id]) {
                            el.style.left = data[id].left + 'px';
                            el.style.top = data[id].top + 'px';
                        }
                    });
                },

                _saveWallpaperLock(id, locked) {
                    const key = getStorageKey(CONFIG.KEYS.WALLPAPER_LOCKS);
                    const data = loadSimple(key, {});
                    data[id] = locked;
                    saveSimple(key, data);
                },

                loadWallpaperLocks() {
                    const key = getStorageKey(CONFIG.KEYS.WALLPAPER_LOCKS);
                    const data = loadSimple(key, {});
                    document.querySelectorAll('.draggable-item').forEach(el => {
                        const id = el.id;
                        if (id && data[id]) {
                            el.classList.add('locked');
                            el.style.cursor = 'default';
                        }
                    });
                },

                // ================================================================
                // 11. 阴阳模式拖拽 (统一 Pointer)
                // ================================================================
                initSimpleDrag() {
                    const items = document.querySelectorAll('.simple-draggable');
                    const stateMap = new WeakMap();

                    items.forEach(el => {
                        const state = {
                            locked: false,
                            dragging: false,
                            startX: 0,
                            startY: 0,
                            baseTX: 0,
                            baseTY: 0,
                            fixedLeft: 0,
                            fixedTop: 0,
                            width: 0,
                            height: 0
                        };
                        stateMap.set(el, state);

                        // 右键锁定
                        el.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            if (state.dragging) return;
                            state.locked = !state.locked;
                            el.classList.toggle('locked', state.locked);
                            el.style.cursor = state.locked ? 'default' : 'grab';
                            const key = getStorageKey(CONFIG.KEYS.SIMPLE_LOCKS);
                            const data = loadSimple(key, {});
                            data[el.id] = state.locked;
                            saveSimple(key, data);
                        });

                        const onStart = (e) => {
                            if (e.target.closest('input') || e.target.closest('textarea') ||
                                e.target.closest('a') || e.target.closest('button') ||
                                e.target.closest('.settings-panel') || e.target.closest('.settings-toggle')) {
                                return;
                            }
                            if (this.isWallpaperMode || state.locked) return;
                            const ev = e.touches ? e.touches[0] : e;
                            const rect = el.getBoundingClientRect();
                            const transform = this._getTransform(el);
                            state.baseTX = transform.x;
                            state.baseTY = transform.y;
                            state.fixedLeft = rect.left - state.baseTX;
                            state.fixedTop = rect.top - state.baseTY;
                            state.width = el.offsetWidth || rect.width;
                            state.height = el.offsetHeight || rect.height;
                            state.startX = ev.clientX;
                            state.startY = ev.clientY;
                            state.dragging = false;
                            el.style.cursor = 'grabbing';
                            e.preventDefault();
                        };

                        const onMove = (e) => {
                            if (state.locked) return;
                            const ev = e.touches ? e.touches[0] : e;
                            const dx = ev.clientX - state.startX;
                            const dy = ev.clientY - state.startY;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist > 6 && !state.dragging) {
                                state.dragging = true;
                                el.classList.add('dragging-simple');
                                // 重新记录基准
                                const rect = el.getBoundingClientRect();
                                const transform = this._getTransform(el);
                                state.baseTX = transform.x;
                                state.baseTY = transform.y;
                                state.fixedLeft = rect.left - state.baseTX;
                                state.fixedTop = rect.top - state.baseTY;
                                state.startX = ev.clientX;
                                state.startY = ev.clientY;
                            }
                            if (state.dragging) {
                                let newTX = state.baseTX + (ev.clientX - state.startX);
                                let newTY = state.baseTY + (ev.clientY - state.startY);
                                const safeRight = window.innerWidth - parseFloat(getComputedStyle(document
                                    .documentElement).getPropertyValue('--safe-right') || '0');
                                const safeBottom = window.innerHeight - parseFloat(getComputedStyle(document
                                    .documentElement).getPropertyValue('--safe-bottom') || '0');
                                const maxX = safeRight - state.width - state.fixedLeft;
                                const minX = -state.fixedLeft;
                                const maxY = safeBottom - state.height - state.fixedTop;
                                const minY = -state.fixedTop;
                                newTX = Math.max(minX, Math.min(maxX, newTX));
                                newTY = Math.max(minY, Math.min(maxY, newTY));
                                el.style.transform = `translate(${newTX}px, ${newTY}px)`;
                                // 保存位置
                                const key = getStorageKey(CONFIG.KEYS.SIMPLE_POSITIONS);
                                const data = loadSimple(key, {});
                                data[el.id] = { x: newTX, y: newTY };
                                saveSimple(key, data);
                                // 语录宽度自适应
                                if (el.id === 'quoteArea') {
                                    const rect = el.getBoundingClientRect();
                                    const leftEdge = rect.left;
                                    const availWidth = Math.min(420, Math.max(200, window.innerWidth -
                                        leftEdge - 32));
                                    el.style.maxWidth = availWidth + 'px';
                                }
                                e.preventDefault();
                            }
                        };

                        const onEnd = () => {
                            if (state.dragging) {
                                state.dragging = false;
                                el.classList.remove('dragging-simple');
                                el.style.cursor = state.locked ? 'default' : 'grab';
                            }
                        };

                        // Pointer + Touch
                        el.addEventListener('pointerdown', onStart);
                        document.addEventListener('pointermove', onMove);
                        document.addEventListener('pointerup', onEnd);
                        document.addEventListener('pointercancel', onEnd);
                        el.addEventListener('touchstart', onStart, { passive: false });
                        document.addEventListener('touchmove', onMove, { passive: false });
                        document.addEventListener('touchend', onEnd, { passive: false });
                        document.addEventListener('touchcancel', onEnd, { passive: false });

                        // 加载保存的位置
                        const keyPos = getStorageKey(CONFIG.KEYS.SIMPLE_POSITIONS);
                        const posData = loadSimple(keyPos, {});
                        if (posData[el.id]) {
                            const { x, y } = posData[el.id];
                            el.style.transform = `translate(${x}px, ${y}px)`;
                            state.baseTX = x;
                            state.baseTY = y;
                            const rect = el.getBoundingClientRect();
                            state.fixedLeft = rect.left - x;
                            state.fixedTop = rect.top - y;
                        }
                        // 加载锁定状态
                        const keyLock = getStorageKey(CONFIG.KEYS.SIMPLE_LOCKS);
                        const lockData = loadSimple(keyLock, {});
                        if (lockData[el.id]) {
                            state.locked = true;
                            el.classList.add('locked');
                            el.style.cursor = 'default';
                        }
                    });
                },

                _getTransform(el) {
                    let tx = 0,
                        ty = 0;
                    const style = window.getComputedStyle(el);
                    const transform = style.transform;
                    if (transform && transform !== 'none') {
                        const matrix = transform.match(/matrix.*\((.+)\)/);
                        if (matrix) {
                            const values = matrix[1].split(', ').map(Number);
                            if (values.length === 6) { tx = values[4] || 0;
                                ty = values[5] || 0; } else if (values.length === 16) { tx = values[12] || 0;
                                ty = values[13] || 0; }
                        }
                    }
                    return { x: tx, y: ty };
                },

                // ================================================================
                // 12. 音乐播放器
                // ================================================================
                initMusicPlayer() {
                    const player = this.els.musicPlayer;
                    const coverImg = this.els.playerCoverImg;
                    const joystickBtn = this.els.playerJoystickBtn;
                    const cover = this.els.playerCover;

                    const IMAGE_COUNT = 36;
                    const albumImages = [];
                    for (let i = 1; i <= IMAGE_COUNT; i++) {
                        albumImages.push(`images/cover_${String(i).padStart(2,'0')}.png`);
                    }
                    const songs = [
                        { name: '凡人', file: 'song_01.mp3' },
                        { name: '归期', file: 'song_02.mp3' },
                        { name: '旅人', file: 'song_03.mp3' },
                    ];

                    let audio = null;
                    let isPlaying = false;
                    let currentSongIndex = 0;
                    let currentImageIndex = 0;

                    const initAudio = () => {
                        if (!audio) {
                            audio = new Audio();
                            audio.volume = 0.6;
                            audio.addEventListener('ended', () => { isPlaying = false; });
                        }
                    };

                    const playSong = (index) => {
                        initAudio();
                        const song = songs[index % songs.length];
                        const src = this.preloaded.blobs[song.file] || 'songs/' + song.file;
                        audio.src = src;
                        audio.load();
                        audio.play().catch(() => {});
                        isPlaying = true;
                    };

                    const togglePlay = () => {
                        if (!audio) { initAudio();
                            playSong(currentSongIndex); return; }
                        if (isPlaying) { audio.pause();
                            isPlaying = false; } else { audio.play().catch(() => {});
                            isPlaying = true; }
                    };

                    const updateCover = () => {
                        coverImg.src = albumImages[currentImageIndex] || 'images/cover_01.png';
                    };

                    // 摇杆方向
                    const handleDir = (dir) => {
                        switch (dir) {
                            case 'up':
                                currentImageIndex = (currentImageIndex - 1 + IMAGE_COUNT) % IMAGE_COUNT;
                                updateCover();
                                break;
                            case 'down':
                                currentImageIndex = (currentImageIndex + 1) % IMAGE_COUNT;
                                updateCover();
                                break;
                            case 'left':
                                currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
                                playSong(currentSongIndex);
                                break;
                            case 'right':
                                currentSongIndex = (currentSongIndex + 1) % songs.length;
                                playSong(currentSongIndex);
                                break;
                        }
                    };

                    // 绑定摇杆按钮
                    document.querySelectorAll('.player-joystick .touch > div').forEach(div => {
                        const dir = div.dataset.dir;
                        div.addEventListener('mouseenter', () => {
                            joystickBtn.classList.remove('dir-up', 'dir-down', 'dir-left', 'dir-right');
                            joystickBtn.classList.add('dir-' + dir);
                        });
                        div.addEventListener('mouseleave', () => {
                            joystickBtn.classList.remove('dir-up', 'dir-down', 'dir-left', 'dir-right');
                        });
                        div.addEventListener('click', () => handleDir(dir));
                        div.addEventListener('touchstart', (e) => { e.preventDefault();
                            handleDir(dir); }, { passive: false });
                    });

                    // 封面点击播放/暂停
                    cover.addEventListener('click', togglePlay);

                    // 封面拖拽移动（仅拖动整个播放器）
                    let isDraggingPlayer = false,
                        dx, dy;
                    player.addEventListener('pointerdown', (e) => {
                        if (e.target.closest('.player-cover') || e.target.closest('.player-joystick')) return;
                        isDraggingPlayer = true;
                        const rect = player.getBoundingClientRect();
                        dx = e.clientX - rect.left;
                        dy = e.clientY - rect.top;
                        player.style.cursor = 'grabbing';
                        e.preventDefault();
                    });
                    document.addEventListener('pointermove', (e) => {
                        if (!isDraggingPlayer) return;
                        let x = e.clientX - dx,
                            y = e.clientY - dy;
                        const safeRight = window.innerWidth - parseFloat(getComputedStyle(document
                            .documentElement).getPropertyValue('--safe-right') || '0');
                        const safeBottom = window.innerHeight - parseFloat(getComputedStyle(document
                            .documentElement).getPropertyValue('--safe-bottom') || '0');
                        x = Math.max(0, Math.min(safeRight - player.offsetWidth, x));
                        y = Math.max(0, Math.min(safeBottom - player.offsetHeight, y));
                        player.style.left = x + 'px';
                        player.style.top = y + 'px';
                        this._saveMusicPlayerPos();
                    });
                    document.addEventListener('pointerup', () => {
                        if (isDraggingPlayer) { isDraggingPlayer = false;
                            player.style.cursor = 'grab';
                            this._saveMusicPlayerPos(); }
                    });
                    // 触摸拖拽
                    player.addEventListener('touchstart', (e) => {
                        if (e.target.closest('.player-cover') || e.target.closest('.player-joystick')) return;
                        const touch = e.touches[0];
                        const rect = player.getBoundingClientRect();
                        dx = touch.clientX - rect.left;
                        dy = touch.clientY - rect.top;
                        isDraggingPlayer = true;
                        e.preventDefault();
                    }, { passive: false });
                    document.addEventListener('touchmove', (e) => {
                        if (!isDraggingPlayer) return;
                        const touch = e.touches[0];
                        let x = touch.clientX - dx,
                            y = touch.clientY - dy;
                        const safeRight = window.innerWidth - parseFloat(getComputedStyle(document
                            .documentElement).getPropertyValue('--safe-right') || '0');
                        const safeBottom = window.innerHeight - parseFloat(getComputedStyle(document
                            .documentElement).getPropertyValue('--safe-bottom') || '0');
                        x = Math.max(0, Math.min(safeRight - player.offsetWidth, x));
                        y = Math.max(0, Math.min(safeBottom - player.offsetHeight, y));
                        player.style.left = x + 'px';
                        player.style.top = y + 'px';
                        this._saveMusicPlayerPos();
                    }, { passive: false });
                    document.addEventListener('touchend', () => { if (isDraggingPlayer) { isDraggingPlayer = false;
                            this._saveMusicPlayerPos(); } });

                    // 双击空白切换播放器可见性
                    document.addEventListener('dblclick', (e) => {
                        const interactive = ['button', 'a', 'input', 'textarea', 'select', '.link-item',
                            '.add-link-btn', '.glass-link', '.glass-add', '.settings-toggle',
                            '.settings-panel', '.modal-overlay', '.player-cover', '.player-joystick',
                            '.quote-area', '.wallpaper-quote-display', '.clock-area', '.draggable-item',
                            '#rope-container', '.search-box', '.glass-search-wrapper', '.search-btn',
                            '.glass-search-btn', '.mode-switch-big', '.type-btn', '.wp-preview-item',
                            '.elem-toggle', '.elem-opacity input', '.settings-module-header',
                            '.quote-item .q-actions button', '#addQuoteBtn', '#modalSave', '#modalCancel',
                            '#modalDelete'
                        ];
                        for (const sel of interactive) {
                            if (e.target.closest(sel)) return;
                        }
                        if (e.target === document.body || e.target === document.documentElement ||
                            e.target.closest('.wallpaper-container') || e.target.closest('.simple-mode')) {
                            this.togglePlayerVisibility();
                        }
                    });

                    // 加载位置
                    this._loadMusicPlayerPos();

                    // 保存引用
                    this._musicPlayer = { audio, isPlaying, currentSongIndex, currentImageIndex, songs, albumImages,
                        playSong, togglePlay, updateCover, handleDir };
                    // 初次封面
                    updateCover();

                    // 可见性变化暂停
                    document.addEventListener('visibilitychange', () => {
                        if (document.hidden && audio && !audio.paused) {
                            audio.pause();
                            isPlaying = false;
                        }
                    });
                },

                togglePlayerVisibility() {
                    const state = this.elemState['musicPlayer'];
                    if (!state) return;
                    state.visible = !state.visible;
                    this.applyElemState();
                    this.saveAllSettings();
                },

                _saveMusicPlayerPos() {
                    const player = this.els.musicPlayer;
                    saveSimple(CONFIG.KEYS.MUSIC_PLAYER_POS, {
                        left: player.style.left,
                        top: player.style.top
                    });
                },

                _loadMusicPlayerPos() {
                    const pos = loadSimple(CONFIG.KEYS.MUSIC_PLAYER_POS, {});
                    const player = this.els.musicPlayer;
                    if (pos.left) player.style.left = pos.left;
                    if (pos.top) player.style.top = pos.top;
                },

                // ================================================================
                // 13. 开始页 + 雨滴 (保留 Curtains.js 并增加降级)
                // ================================================================
                initStartPage() {
                    const startPage = this.els.startPage;
                    const canvasContainer = document.getElementById('canvas');
                    const textureImg = document.getElementById('texture');
                    let rainInitialized = false,
                        rainDestroyed = false;
                    let curtainsInstance = null,
                        plane = null;

                    // 加载 Curtains.js 超时降级
                    let rainTimeout = setTimeout(() => {
                        if (!rainInitialized && !rainDestroyed) {
                            console.warn('⚠️ Curtains.js 加载超时，跳过雨滴特效');
                            rainDestroyed = true;
                        }
                    }, 5000);

                    const initRain = () => {
                        if (rainInitialized || rainDestroyed) return;
                        if (typeof Curtains === 'undefined') {
                            console.warn('Curtains.js 未定义，跳过雨滴');
                            rainDestroyed = true;
                            return;
                        }
                        if (!textureImg.complete || textureImg.naturalWidth === 0) {
                            textureImg.onload = initRain;
                            return;
                        }
                        try {
                            curtainsInstance = new Curtains({
                                container: 'canvas',
                                watchScroll: false,
                                pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
                            });
                            const planeElement = document.querySelector('.plane');
                            const vertexShader = `
                                #ifdef GL_ES
                                precision mediump float;
                                #endif
                                attribute vec3 aVertexPosition;
                                attribute vec2 aTextureCoord;
                                uniform mat4 uMVMatrix;
                                uniform mat4 uPMatrix;
                                uniform mat4 dispImageMatrix;
                                varying vec3 vVertexPosition;
                                varying vec2 vTextureCoord;
                                void main() {
                                    vec3 vertexPosition = aVertexPosition;
                                    gl_Position = uPMatrix * uMVMatrix * vec4(vertexPosition, 1.0);
                                    vTextureCoord = (dispImageMatrix * vec4(aTextureCoord, 0., 1.)).xy;
                                    vVertexPosition = vertexPosition;
                                }
                            `;
                            const fragmentShader = `
                                #ifdef GL_ES
                                precision mediump float;
                                #endif
                                #define PI2 6.28318530718
                                #define PI  3.14159265359
                                #define S(a,b,n) smoothstep(a,b,n)
                                varying vec3 vVertexPosition;
                                varying vec2 vTextureCoord;
                                uniform float uTime;
                                uniform vec2  uReso;
                                uniform vec2  uMouse;
                                uniform sampler2D dispImage;

                                float N12(vec2 p) {
                                    p = fract(p * vec2(123.34, 345.45));
                                    p += dot(p, p + 34.345);
                                    return fract(p.x * p.y);
                                }

                                vec3 Layer(vec2 uv0, float t) {
                                    vec2 asp = vec2(2., 1.);
                                    vec2 uv1 = uv0 * 3.0 * asp;
                                    uv1.y += t * 0.25;
                                    vec2 gv = fract(uv1) - 0.5;
                                    vec2 id = floor(uv1);
                                    float n = N12(id);
                                    t += n * PI2;
                                    float w = uv0.y * 10.0;
                                    float x = (n - 0.5) * 0.8;
                                    x += (0.4 - abs(x)) * sin(3.0 * w) * pow(sin(w), 6.0) * 0.45;
                                    float y = -sin(t + sin(t + sin(t) * 0.5)) * (0.5 - 0.06);
                                    y -= (gv.x - x) * (gv.x - x);
                                    vec2 dropPos = (gv - vec2(x, y)) / asp;
                                    float drop = S(0.015, 0.01, length(dropPos));
                                    vec2 trailPos = (gv - vec2(x, t * 0.25)) / asp;
                                    trailPos.y = (fract(trailPos.y * 8.0) - 0.5) / 8.0;
                                    float trail = S(0.01, 0.0075, length(trailPos));
                                    float fogTrail = S(-0.05, 0.05, dropPos.y);
                                    fogTrail *= S(0.5, y, gv.y);
                                    trail *= fogTrail;
                                    fogTrail *= S(0.015, 0.0075, abs(dropPos.x));
                                    vec2 off = drop * dropPos + trail * trailPos;
                                    return vec3(off, fogTrail);
                                }

                                void main() {
                                    float dist = 5.0;
                                    float blurSize = 1.5;
                                    float t = mod(uTime * 0.03, 7200.0);
                                    vec2 uv = vTextureCoord;
                                    vec3 drops = Layer(uv, t);
                                    drops += Layer(uv * 1.25 + 7.54, t);
                                    drops += Layer(uv * 1.35 + 1.54, t);
                                    drops += Layer(uv * 1.57 - 7.54, t);
                                    float blur = blurSize * 1.0 * (1.0 - drops.z);
                                    vec4 col = vec4(0.0);
                                    int numSamples = 32;
                                    float a = N12(uv) * PI2;
                                    blur *= 0.0005;
                                    uv += drops.xy * dist;
                                    for (int n = 0; n < 32; n++) {
                                        vec2 off = vec2(sin(a), cos(a)) * blur;
                                        float d = fract(sin(float(n + 1) * 546.0) * 5424.0);
                                        d = sqrt(d);
                                        off *= d;
                                        col += texture2D(dispImage, uv + off);
                                        a++;
                                    }
                                    col /= float(numSamples);
                                    gl_FragColor = col;
                                }
                            `;

                            plane = curtainsInstance.addPlane(planeElement, {
                                vertexShader,
                                fragmentShader,
                                widthSegments: 40,
                                heightSegments: 40,
                                uniforms: {
                                    time: { name: 'uTime', type: '1f', value: 0 },
                                    mousepos: { name: 'uMouse', type: '2f', value: [0, 0] },
                                    resolution: { name: 'uReso', type: '2f', value: [window.innerWidth, window
                                            .innerHeight] },
                                }
                            });

                            if (plane) {
                                plane.onRender(() => {
                                    plane.uniforms.time.value++;
                                    plane.uniforms.resolution.value = [window.innerWidth, window.innerHeight];
                                    plane.uniforms.mousepos.value = [window.mouseX || 0, window.mouseY || 0];
                                });
                                window.addEventListener('mousemove', (e) => {
                                    window.mouseX = e.clientX;
                                    window.mouseY = e.clientY;
                                });
                                rainInitialized = true;
                                console.log('🌧️ 开始页雨滴特效已启动');
                            } else {
                                rainDestroyed = true;
                                if (curtainsInstance) curtainsInstance.dispose();
                            }
                        } catch (e) {
                            console.warn('雨滴初始化异常:', e);
                            rainDestroyed = true;
                            if (curtainsInstance) curtainsInstance.dispose();
                        }
                    };

                    // 启动雨滴
                    if (document.readyState === 'complete') setTimeout(initRain, 200);
                    else window.addEventListener('load', () => setTimeout(initRain, 200));

                    // 点击进入
                    const enterSite = () => {
                        if (startPage.classList.contains('fade-out')) return;
                        // 销毁雨滴
                        if (plane) {
                            try { plane.remove(); } catch (_) {}
                            plane = null;
                        }
                        if (curtainsInstance) {
                            try { curtainsInstance.dispose(); } catch (_) {}
                            curtainsInstance = null;
                        }
                        rainDestroyed = true;
                        clearTimeout(rainTimeout);

                        startPage.classList.add('fade-out');
                        setTimeout(() => startPage.classList.add('hide'), 1200);

                        const rainContainer = this.els.rainContainer;
                        rainContainer.classList.add('active');
                        setTimeout(() => {
                            rainContainer.classList.add('fade-out');
                            setTimeout(() => {
                                rainContainer.classList.remove('active');
                                rainContainer.style.display = 'none';
                            }, 1200);
                        }, 300);
                    };

                    startPage.addEventListener('click', enterSite);
                    startPage.addEventListener('touchstart', (e) => {
                        if (!startPage.classList.contains('fade-out')) enterSite();
                    }, { passive: true });

                    // 独立雨丝
                    const buildRaindrops = () => {
                        const container = this.els.rainContainer;
                        container.innerHTML = '';
                        const configs = [
                            { left: 10, duration: 2.4, delay: 0.2, height: 60 },
                            { left: 22, duration: 3.0, delay: 0.8, height: 80 },
                            { left: 35, duration: 2.0, delay: 0.0, height: 50 },
                            { left: 48, duration: 2.8, delay: 0.5, height: 70 },
                            { left: 60, duration: 2.2, delay: 1.0, height: 55 },
                            { left: 73, duration: 3.2, delay: 0.3, height: 90 },
                            { left: 85, duration: 2.6, delay: 0.7, height: 65 },
                            { left: 92, duration: 2.0, delay: 1.2, height: 45 },
                            { left: 15, duration: 2.9, delay: 0.9, height: 75 },
                            { left: 42, duration: 2.1, delay: 0.1, height: 50 },
                            { left: 68, duration: 3.1, delay: 0.6, height: 85 },
                            { left: 78, duration: 2.3, delay: 1.1, height: 60 },
                        ];
                        configs.forEach(cfg => {
                            const el = document.createElement('div');
                            el.className = 'raindrop';
                            el.style.left = cfg.left + '%';
                            el.style.animationDuration = cfg.duration + 's';
                            el.style.animationDelay = cfg.delay + 's';
                            el.style.height = cfg.height + 'px';
                            container.appendChild(el);
                        });
                    };
                    buildRaindrops();
                },

                // ================================================================
                // 14. 资源预加载 (不阻塞首屏)
                // ================================================================
                async preloadResources() {
                    const songs = this._musicPlayer?.songs || [
                        { file: 'song_01.mp3' }, { file: 'song_02.mp3' }, { file: 'song_03.mp3' }
                    ];
                    const albumImages = this._musicPlayer?.albumImages || [];
                    const staticWp = CONFIG.WALLPAPERS.static || [];
                    const dynamicWp = CONFIG.WALLPAPERS.dynamic || [];

                    const tasks = [];

                    // 歌曲
                    songs.forEach(song => {
                        tasks.push(fetch('songs/' + song.file).then(res => {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.blob().then(blob => {
                                this.preloaded.blobs[song.file] = URL.createObjectURL(blob);
                            });
                        }).catch(() => {}));
                    });

                    // 封面图片
                    albumImages.forEach(src => {
                        tasks.push(new Promise((resolve) => {
                            const img = new Image();
                            img.onload = () => resolve();
                            img.onerror = () => resolve();
                            img.src = src;
                        }));
                    });

                    // 静态壁纸
                    staticWp.forEach(wp => {
                        tasks.push(new Promise((resolve) => {
                            const img = new Image();
                            img.onload = () => resolve();
                            img.onerror = () => resolve();
                            img.src = 'images/' + wp.file;
                        }));
                    });

                    // 动态壁纸
                    dynamicWp.forEach(wp => {
                        tasks.push(fetch('videos/' + wp.file).then(res => {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.blob().then(blob => {
                                this.preloaded.blobs[wp.id] = URL.createObjectURL(blob);
                            });
                        }).catch(() => {}));
                    });

                    await Promise.allSettled(tasks);
                    console.log('✅ 资源预加载完成');
                },

                // ================================================================
                // 15. Resize 防抖 & 可见性
                // ================================================================
                initResizeHandler() {
                    const handler = throttle(() => {
                        const safeRight = window.innerWidth - parseFloat(getComputedStyle(document
                            .documentElement).getPropertyValue('--safe-right') || '0');
                        const safeBottom = window.innerHeight - parseFloat(getComputedStyle(document
                            .documentElement).getPropertyValue('--safe-bottom') || '0');

                        // 修仙元素
                        document.querySelectorAll('.draggable-item').forEach(item => {
                            if (item.style.display !== 'none') {
                                const rect = item.getBoundingClientRect();
                                const w = item.offsetWidth,
                                    h = item.offsetHeight;
                                let left = parseFloat(item.style.left) || rect.left;
                                let top = parseFloat(item.style.top) || rect.top;
                                left = Math.max(0, Math.min(safeRight - w, left));
                                top = Math.max(0, Math.min(safeBottom - h, top));
                                item.style.left = left + 'px';
                                item.style.top = top + 'px';
                            }
                        });

                        // 阴阳元素
                        document.querySelectorAll('.simple-draggable').forEach(el => {
                            const rect = el.getBoundingClientRect();
                            const transform = this._getTransform(el);
                            const tx = transform.x,
                                ty = transform.y;
                            const w = el.offsetWidth || rect.width;
                            const h = el.offsetHeight || rect.height;
                            const fixedLeft = rect.left - tx;
                            const fixedTop = rect.top - ty;
                            const maxX = safeRight - w - fixedLeft;
                            const minX = -fixedLeft;
                            const maxY = safeBottom - h - fixedTop;
                            const minY = -fixedTop;
                            let newTX = Math.max(minX, Math.min(maxX, tx));
                            let newTY = Math.max(minY, Math.min(maxY, ty));
                            if (newTX !== tx || newTY !== ty) {
                                el.style.transform = `translate(${newTX}px, ${newTY}px)`;
                                const key = getStorageKey(CONFIG.KEYS.SIMPLE_POSITIONS);
                                const data = loadSimple(key, {});
                                data[el.id] = { x: newTX, y: newTY };
                                saveSimple(key, data);
                            }
                        });
                    }, 200);
                    window.addEventListener('resize', handler);
                },

                initVisibilityHandler() {
                    document.addEventListener('visibilitychange', () => {
                        if (document.hidden && this._musicPlayer?.audio && !this._musicPlayer.audio
                        .paused) {
                            this._musicPlayer.audio.pause();
                            this._musicPlayer.isPlaying = false;
                        }
                    });
                }
            };

            // ================================================================
            // 启动 App
            // ================================================================
            document.addEventListener('DOMContentLoaded', () => {
                App.init();
            });

        })();
    </script>
