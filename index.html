    <!-- 引入 Curtains.js (延迟加载) -->
    <script>
        // 占位，由主脚本动态加载
        window.Curtains = null;
    </script>
    <script src="https://www.curtainsjs.com/build/curtains.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // 0. 配置中心 (统一资源管理)
            // ================================================================
            const CONFIG = {
                // 壁纸资源
                wallpapers: {
                    dynamic: [
                        { id: 'd1', name: '老婆', file: 'dynamic_01.mp4' },
                        { id: 'd2', name: '师姐', file: 'dynamic_02.mp4' },
                    ],
                    static: [
                        { id: 's1', name: '韩立', file: 'static_01.png' },
                        { id: 's2', name: '夫妻照', file: 'static_02.png' },
                        { id: 's3', name: '天南双圣', file: 'static_03.png' },
                        { id: 's4', name: '亲亲', file: 'static_04.png' },
                        { id: 's5', name: '极阴岛传人', file: 'static_05.png' },
                        { id: 's6', name: '老婆', file: 'static_06.png' },
                        { id: 's7', name: '初恋', file: 'static_07.png' },
                        { id: 's8', name: '徒儿', file: 'static_08.png' },
                        { id: 's9', name: '小梅凝', file: 'static_09.png' },
                        { id: 's10', name: '云梦山第一美人', file: 'static_10.png' },
                        { id: 's11', name: '银月', file: 'static_11.png' },
                        { id: 's12', name: '宋玉', file: 'static_12.png' },
                    ]
                },
                // 音乐资源
                songs: [
                    { name: '凡人', file: 'song_01.mp3' },
                    { name: '归期', file: 'song_02.mp3' },
                    { name: '旅人', file: 'song_03.mp3' },
                ],
                // 封面图 (36张)
                coverCount: 36,
                // 默认链接
                defaultLinks: [
                    { text: '我的简历', url: 'https://lvyyjianli.netlify.app/' },
                    { text: '中国色', url: 'https://zhongguose.com/' },
                    { text: '在线音乐', url: 'https://www.qqmp3.vip/' },
                    { text: '小霸王', url: 'https://www.yikm.net/' },
                    { text: '乡间郎中', url: 'https://www.xjlz365.com/' },
                    { text: 'A站', url: 'https://www.acfun.cn/' },
                    { text: '八门全开', url: 'https://kms.cx/' },
                    { text: 'MC', url: 'https://mcjs.link/' },
                    { text: 'CS', url: 'https://webcs.xyz/' },
                    { text: '装机儿', url: 'https://zhuangit.ababtools.com/' },
                    { text: '天阶功法', url: 'https://www.shidianguji.com/' },
                    { text: '世界名画', url: 'https://www.nbfox.com/' },
                    { text: '焚决', url: 'https://fmhy.net/' },
                    { text: '人造灵根', url: 'https://codernav.com/' },
                    { text: '全球电台', url: 'https://radiocast.co/' }
                ],
                // 默认名言
                defaultQuotes: [
                    { text: '人生百年，蜉蝣一日，长生与我何有哉？纵使蹉跎一生，也要争那一线天机，只因幼师便知，人生如棋，落子无悔。',
                    author: '孙孙浩' },
                    { text: '杀人放火厉飞雨，万人敬仰韩天尊', author: '阿青' },
                    { text: '你倒是个有情有义之人。可惜在这乱世之中，最不值钱的便是情义。且看我那两个逆徒，本座养育他们两百年，却轻易背叛。',
                        author: '玄骨上人' },
                    { text: '立哥哥,立giegie', author: '小佳乐' },
                    { text: '什么不会抹杀我的存在？没有了自主意识后的我，还会是我吗？和从这世间消失，有什么区别。', author: '小二黑' },
                    { text: '到头来,无非是求个念头通达罢liao。', author: '李化元' },
                    { text: '所谓元婴之下第一人，也不过就是个结丹修士而已，不如温少主的性命，就交予在下如何。', author: '吕少主' },
                    { text: '韩大哥，没有灵根真的不能成为修仙者么？', author: '墨彩环' },
                ]
            };

            // ================================================================
            // 1. 工具函数
            // ================================================================
            function showToast(msg, duration = 1800) {
                const container = document.getElementById('toastContainer');
                const el = document.createElement('div');
                el.className = 'toast';
                el.textContent = msg;
                container.appendChild(el);
                setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, duration);
            }

            function isMobile() {
                return window.innerWidth <= 768 || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            }

            function getStorageKey(baseKey) {
                return isMobile() ? baseKey + '_mobile' : baseKey + '_desktop';
            }

            function sanitizeUrl(url) {
                let trimmed = url.trim();
                if (!trimmed) return '';
                if (!/^[a-zA-Z][a-zA-Z0-9+\-.]*:/.test(trimmed)) {
                    trimmed = 'http://' + trimmed;
                }
                try {
                    const parsed = new URL(trimmed);
                    if (!['http:', 'https:', 'ftp:', 'mailto:', 'tel:'].includes(parsed.protocol)) return '';
                    return parsed.href;
                } catch (_) { return ''; }
            }

            function isValidUrl(url) {
                return sanitizeUrl(url) !== '';
            }

            // ================================================================
            // 2. 存储管理器
            // ================================================================
            const Storage = {
                get(key, def = null) {
                    try {
                        const val = localStorage.getItem(key);
                        return val ? JSON.parse(val) : def;
                    } catch { return def; }
                },
                set(key, val) {
                    try { localStorage.setItem(key, JSON.stringify(val)); } catch (_) {}
                },
                remove(key) {
                    try { localStorage.removeItem(key); } catch (_) {}
                }
            };

            // ================================================================
            // 3. 资源懒加载器 (仅预加载当前需要的内容)
            // ================================================================
            const ResourceLoader = {
                blobs: {},
                _loaded: 0,
                _total: 0,

                // 获取资源路径
                getPath(type, file) {
                    const map = {
                        song: 'songs/',
                        cover: 'images/',
                        static: 'images/',
                        dynamic: 'videos/',
                    };
                    return (map[type] || '') + file;
                },

                // 预加载核心资源 (仅当前壁纸 + 当前歌曲 + 第一张封面)
                preloadCore(currentWallpaperType, currentWallpaperId, currentSongIndex) {
                    const toLoad = [];
                    // 当前壁纸
                    const list = CONFIG.wallpapers[currentWallpaperType];
                    const wp = list ? list.find(w => w.id === currentWallpaperId) : null;
                    if (wp) {
                        const type = currentWallpaperType === 'dynamic' ? 'dynamic' : 'static';
                        toLoad.push({ type, file: wp.file, id: wp.id });
                    }
                    // 当前歌曲
                    const song = CONFIG.songs[currentSongIndex];
                    if (song) toLoad.push({ type: 'song', file: song.file, id: song.file });
                    // 第一张封面
                    toLoad.push({ type: 'cover', file: `cover_01.png`, id: 'cover_01' });

                    this._total = toLoad.length;
                    this._loaded = 0;
                    toLoad.forEach(item => this._loadItem(item));
                },

                _loadItem(item) {
                    const url = this.getPath(item.type, item.file);
                    if (item.type === 'song' || item.type === 'dynamic') {
                        fetch(url)
                            .then(res => {
                                if (!res.ok) throw new Error('HTTP ' + res.status);
                                return res.blob();
                            })
                            .then(blob => {
                                this.blobs[item.id] = URL.createObjectURL(blob);
                                this._loaded++;
                            })
                            .catch(() => { this._loaded++; });
                    } else if (item.type === 'static' || item.type === 'cover') {
                        const img = new Image();
                        img.onload = () => { this._loaded++; };
                        img.onerror = () => { this._loaded++; };
                        img.src = url;
                    }
                },

                // 按需加载 (用于后续切换)
                loadSong(file) {
                    return new Promise((resolve) => {
                        if (this.blobs[file]) return resolve(this.blobs[file]);
                        fetch('songs/' + file)
                            .then(r => r.blob())
                            .then(blob => {
                                const url = URL.createObjectURL(blob);
                                this.blobs[file] = url;
                                resolve(url);
                            })
                            .catch(() => resolve(null));
                    });
                },

                loadWallpaper(type, id, file) {
                    return new Promise((resolve) => {
                        if (this.blobs[id]) return resolve(this.blobs[id]);
                        const path = type === 'dynamic' ? 'videos/' : 'images/';
                        fetch(path + file)
                            .then(r => r.blob())
                            .then(blob => {
                                const url = URL.createObjectURL(blob);
                                this.blobs[id] = url;
                                resolve(url);
                            })
                            .catch(() => resolve(null));
                    });
                },

                revokeAll() {
                    for (const key in this.blobs) {
                        try { URL.revokeObjectURL(this.blobs[key]); } catch (_) {}
                    }
                    this.blobs = {};
                }
            };

            // ================================================================
            // 4. 全局状态
            // ================================================================
            const state = {
                isWallpaperMode: false,
                currentMode: 'day', // 'day' | 'night'
                currentWallpaperType: 'static',
                currentWallpaperId: 's1',
                wallpaperBrightness: 'dark',
                isWallpaperTransitioning: false,

                // 链接
                links: [],

                // 名言
                quotes: [],
                quoteIndex: 0,
                quoteLocked: false,
                quoteInterval: 5000,
                intervalTimer: null,

                // 搜索
                searchVisible: true,

                // 音乐
                currentSongIndex: 0,
                currentImageIndex: 0,
                isPlaying: false,
                audioPlayer: null,
                isCoverLoading: false,

                // 元素可见性
                elemState: {},

                // 模块折叠
                moduleStates: { mode: true, wallpaper: true, elements: true, quotes: true },

                // 拖拽锁
                simpleLocks: {},
                wallpaperLocks: {},
            };

            // ================================================================
            // 5. 元素定义
            // ================================================================
            const ELEM_DEFS = {
                simple: [
                    { id: 'simpleClock', name: '阴阳·时钟', defaultVisible: true, defaultOpacity: 1, getEl: () => document
                            .getElementById('clockArea') },
                    { id: 'simpleQuote', name: '阴阳·语录', defaultVisible: true, defaultOpacity: 1, getEl: () => document
                            .getElementById('quoteArea') },
                    { id: 'simpleBottom', name: '阴阳·底部', defaultVisible: true, defaultOpacity: 1, getEl: () => document
                            .getElementById('bottomArea') },
                ],
                wallpaper: [
                    { id: 'wpTime', name: '修仙·时间', defaultVisible: true, defaultOpacity: 1, getEl: () => document
                            .getElementById('wallpaperTimeDisplay') },
                    { id: 'wpQuote', name: '修仙·语录', defaultVisible: true, defaultOpacity: 1, getEl: () => document
                            .getElementById('wallpaperQuoteDisplay') },
                    { id: 'wpSearch', name: '修仙·搜索', defaultVisible: true, defaultOpacity: 1, getEl: () => document
                            .getElementById('glassSearch') },
                    { id: 'wpLinks', name: '修仙·链接', defaultVisible: true, defaultOpacity: 1, getEl: () => document
                            .getElementById('glassLinks') },
                    { id: 'musicPlayer', name: '音乐播放器', defaultVisible: false, defaultOpacity: 0.9, getEl: () =>
                            document.getElementById('musicPlayer') },
                ]
            };

            function getDefaultElemState() {
                const s = {};
                [...ELEM_DEFS.simple, ...ELEM_DEFS.wallpaper].forEach(def => {
                    s[def.id] = { visible: def.defaultVisible, opacity: def.defaultOpacity };
                });
                return s;
            }

            // ================================================================
            // 6. 核心模块: 名言管理
            // ================================================================
            const QuoteManager = {
                init() {
                    this.quotes = Storage.get('quotesData', CONFIG.defaultQuotes.map(q => ({ ...q })));
                    if (!this.quotes || this.quotes.length === 0) {
                        this.quotes = CONFIG.defaultQuotes.map(q => ({ ...q }));
                        this.save();
                    }
                    state.quotes = this.quotes;
                    state.quoteInterval = Storage.get('quoteInterval', 5000);
                    this._loadLocks();
                    this.show(0);
                    this.restartInterval();
                },

                save() {
                    Storage.set('quotesData', this.quotes);
                    state.quotes = this.quotes;
                },

                _loadLocks() {
                    state.quoteLocked = Storage.get('quoteLocked', false);
                },

                _saveLocks() {
                    Storage.set('quoteLocked', state.quoteLocked);
                },

                show(index) {
                    const qs = this.quotes;
                    if (qs.length === 0) {
                        this._setDisplayText('暂无名言', '');
                        return;
                    }
                    const q = qs[index % qs.length];
                    this._setDisplayText(q.text, '— ' + q.author);
                    state.quoteIndex = index;
                },

                _setDisplayText(text, author) {
                    const els = [
                        document.getElementById('quoteText'),
                        document.getElementById('wqText')
                    ];
                    const authEls = [
                        document.getElementById('quoteAuthor'),
                        document.getElementById('wqAuthor')
                    ];
                    els.forEach(el => {
                        if (!el) return;
                        el.classList.add('fade');
                        setTimeout(() => { el.textContent = text;
                            el.classList.remove('fade'); }, 50);
                    });
                    authEls.forEach(el => { if (el) el.textContent = author; });
                },

                next() {
                    if (!state.quoteLocked && this.quotes.length > 1) {
                        const idx = (state.quoteIndex + 1) % this.quotes.length;
                        this.show(idx);
                    }
                },

                toggleLock() {
                    state.quoteLocked = !state.quoteLocked;
                    this._saveLocks();
                    const els = [
                        document.getElementById('quoteArea'),
                        document.getElementById('wallpaperQuoteDisplay')
                    ];
                    els.forEach(el => {
                        if (!el) return;
                        if (state.quoteLocked) {
                            el.classList.add('locked');
                            el.style.cursor = 'default';
                        } else {
                            el.classList.remove('locked');
                            el.style.cursor = 'pointer';
                        }
                    });
                },

                restartInterval() {
                    if (state.intervalTimer) clearInterval(state.intervalTimer);
                    if (state.quoteInterval > 0 && this.quotes.length > 1) {
                        state.intervalTimer = setInterval(() => this.next(), state.quoteInterval);
                    }
                },

                add(text, author) {
                    if (!text.trim()) return false;
                    this.quotes.push({ text: text.trim(), author: author.trim() || '佚名' });
                    this.save();
                    this.restartInterval();
                    return true;
                },

                edit(index, text, author) {
                    if (!this.quotes[index]) return false;
                    this.quotes[index] = { text: text.trim(), author: author.trim() || '佚名' };
                    this.save();
                    if (state.quoteIndex === index) this.show(index);
                    return true;
                },

                remove(index) {
                    if (!this.quotes[index]) return false;
                    this.quotes.splice(index, 1);
                    if (this.quotes.length === 0) {
                        this.quotes = CONFIG.defaultQuotes.map(q => ({ ...q }));
                    }
                    this.save();
                    if (state.quoteIndex >= this.quotes.length) state.quoteIndex = 0;
                    this.show(state.quoteIndex);
                    this.restartInterval();
                    return true;
                },

                setInterval(sec) {
                    state.quoteInterval = Math.max(1, Math.min(300, sec)) * 1000;
                    Storage.set('quoteInterval', state.quoteInterval);
                    this.restartInterval();
                }
            };

            // ================================================================
            // 7. 核心模块: 链接管理
            // ================================================================
            const LinkManager = {
                init() {
                    const stored = Storage.get('quickLinks');
                    if (stored && Array.isArray(stored) && stored.length > 0) {
                        state.links = stored;
                    } else {
                        state.links = CONFIG.defaultLinks.map(l => ({ ...l }));
                        this.save();
                    }
                    this.render();
                },

                save() {
                    Storage.set('quickLinks', state.links);
                },

                render() {
                    const grid = document.getElementById('linksGrid');
                    const glass = document.getElementById('glassLinks');
                    grid.innerHTML = '';
                    glass.innerHTML = '';

                    state.links.forEach((link, index) => {
                        // 阴阳模式链接
                        const a = document.createElement('a');
                        a.className = 'link-item';
                        a.href = link.url;
                        a.target = '_blank';
                        a.textContent = link.text;
                        a.dataset.index = index;
                        a.setAttribute('role', 'listitem');
                        a.addEventListener('contextmenu', (e) => { e.preventDefault();
                            this.openEditor(index); });
                        this._addPressEffect(a);
                        grid.appendChild(a);

                        // 修仙模式链接
                        const ga = document.createElement('a');
                        ga.className = 'glass-link';
                        ga.href = link.url;
                        ga.target = '_blank';
                        ga.textContent = link.text;
                        ga.dataset.index = index;
                        ga.addEventListener('contextmenu', (e) => { e.preventDefault();
                            e.stopPropagation();
                            this.openEditor(index); });
                        glass.appendChild(ga);
                    });

                    // 添加按钮
                    const addBtn = document.createElement('button');
                    addBtn.className = 'add-link-btn';
                    addBtn.textContent = '＋';
                    addBtn.addEventListener('click', () => this.openEditor(-1));
                    this._addPressEffect(addBtn);
                    grid.appendChild(addBtn);

                    const glassAdd = document.createElement('button');
                    glassAdd.className = 'glass-add';
                    glassAdd.textContent = '＋';
                    glassAdd.addEventListener('click', () => this.openEditor(-1));

            // ================================================================
            // 8. 核心模块: 壁纸管理
            // ================================================================
            const WallpaperManager = {
                videoEl: document.getElementById('wallpaperVideo'),
                imgEl: document.getElementById('wallpaperImg'),

                init() {
                    const savedType = Storage.get('wallpaperType', 'static');
                    const savedId = Storage.get('wallpaperId', 's1');
                    state.currentWallpaperType = savedType;
                    state.currentWallpaperId = savedId;
                    this.apply(savedType, savedId);
                },

                _detectBrightnessFromMedia(mediaEl) {
                    return new Promise((resolve) => {
                        try {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            const w = 64,
                                h = 64;
                            canvas.width = w;
                            canvas.height = h;
                            ctx.drawImage(mediaEl, 0, 0, w, h);
                            const data = ctx.getImageData(0, 0, w, h).data;
                            let sum = 0,
                                count = 0;
                            for (let i = 0; i < data.length; i += 4) {
                                const luma = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                                sum += luma;
                                count++;
                            }
                            resolve(sum / count < 128 ? 'dark' : 'light');
                        } catch (_) { resolve('dark'); }
                    });
                },

                _applyBrightness(brightness) {
                    state.wallpaperBrightness = brightness || 'dark';
                    document.body.setAttribute('data-brightness', state.wallpaperBrightness);
                },

                apply(type, id) {
                    if (state.isWallpaperTransitioning) return;
                    const list = CONFIG.wallpapers[type];
                    const item = list ? list.find(w => w.id === id) : null;
                    if (!item) return;
                    state.isWallpaperTransitioning = true;
                    const activeEl = this.videoEl.classList.contains('active') ? this.videoEl :
                        (this.imgEl.classList.contains('active') ? this.imgEl : null);
                    if (activeEl) {
                        activeEl.classList.remove('active');
                        activeEl.classList.add('fade-out');
                    }
                    setTimeout(() => {
                        this.videoEl.classList.remove('active', 'fade-out');
                        this.imgEl.classList.remove('active', 'fade-out');

                        const onLoaded = () => {
                            if (type === 'dynamic') {
                                this.videoEl.classList.add('active');
                                this._detectBrightnessFromMedia(this.videoEl).then(b =>
                                    this._applyBrightness(b));
                            } else {
                                this.imgEl.classList.add('active');
                                this._detectBrightnessFromMedia(this.imgEl).then(b =>
                                    this._applyBrightness(b));
                            }
                            state.isWallpaperTransitioning = false;
                            document.querySelectorAll('.wp-preview-item').forEach(el => {
                                el.classList.toggle('active', el.dataset.id === id && el.dataset
                                    .type === type);
                            });
                            state.currentWallpaperType = type;
                            state.currentWallpaperId = id;
                            Storage.set('wallpaperType', type);
                            Storage.set('wallpaperId', id);
                        };

                        if (type === 'dynamic') {
                            const src = ResourceLoader.blobs[item.id] || 'videos/' + item.file;
                            const source = this.videoEl.querySelector('source');
                            if (source) source.setAttribute('src', src);
                            else {
                                const ns = document.createElement('source');
                                ns.setAttribute('src', src);
                                ns.setAttribute('type', 'video/mp4');
                                this.videoEl.appendChild(ns);
                            }
                            this.videoEl.load();
                            this.videoEl.loop = true;
                            this.videoEl.play().catch(() => {});
                            this.videoEl.oncanplaythrough = () => { onLoaded();
                                this.videoEl.oncanplaythrough = null; };
                            setTimeout(onLoaded, 2000);
                        } else {
                            this.imgEl.src = 'images/' + item.file;
                            this.imgEl.onload = () => { onLoaded();
                                this.imgEl.onload = null; };
                            this.imgEl.onerror = () => { onLoaded();
                                this.imgEl.onerror = null; };
                            setTimeout(onLoaded, 2000);
                        }
                    }, 800);
                },

                // 自定义上传 (静态)
                uploadCustom(file) {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const dataUrl = e.target.result;
                            const id = 'custom_' + Date.now();
                            // 添加到动态列表 (仅当前会话)
                            CONFIG.wallpapers.static.push({ id, name: file.name, file: dataUrl });
                            this.apply('static', id);
                            resolve(id);
                        };
                        reader.readAsDataURL(file);
                    });
                }
            };

                    this.coverImages = [];
                    for (let i = 1; i <= CONFIG.coverCount; i++) {
                        this.coverImages.push(`images/cover_${String(i).padStart(2, '0')}.png`);
                    }
                },

                _initAudio() {
                    if (!state.audioPlayer) {
                        state.audioPlayer = new Audio();
                        state.audioPlayer.volume = 0.6;
                        state.audioPlayer.addEventListener('ended', () => { state.isPlaying = false; });
                    }
                    return state.audioPlayer;
                },

                play(index) {
                    const song = CONFIG.songs[index % CONFIG.songs.length];
                    if (!song) return;
                    const audio = this._initAudio();
                    ResourceLoader.loadSong(song.file).then(src => {
                        if (!src) { showToast('歌曲加载失败'); return; }
                        audio.src = src;
                        audio.load();
                        audio.play().catch(() => {});
                        state.isPlaying = true;
                        state.currentSongIndex = index;
                        Storage.set('currentSongIndex', index);
                    });
                },

                togglePlay() {
                    const audio = this._initAudio();
                    if (!audio.src) {
                        this.play(state.currentSongIndex);
                        return;
                    }
                    if (state.isPlaying) {
                        audio.pause();
                        state.isPlaying = false;
                    } else {
                        audio.play().catch(() => {});
                        state.isPlaying = true;
                    }
                },

                updateCover() {
                    if (state.isCoverLoading) return;
                    state.isCoverLoading = true;
                    const src = this.coverImages[state.currentImageIndex] || this.coverImages[0];
                    this.coverImg.src = src;
                    this.coverImg.onload = () => { state.isCoverLoading = false;
                        this.coverImg.onload = null;
                        this.coverImg.onerror = null; };
                    this.coverImg.onerror = () => { state.isCoverLoading = false;
                        this.coverImg.onload = null;
                        this.coverImg.onerror = null; };
                },

                prevCover() {
                    if (state.isCoverLoading) return;
                    state.currentImageIndex = (state.currentImageIndex - 1 + this.coverImages.length) % this.coverImages
                        .length;
                    this.updateCover();
                    Storage.set('currentImageIndex', state.currentImageIndex);
                },

                nextCover() {
                    if (state.isCoverLoading) return;
                    state.currentImageIndex = (state.currentImageIndex + 1) % this.coverImages.length;
                    this.updateCover();
                    Storage.set('currentImageIndex', state.currentImageIndex);
                },

                prevSong() {
                    const idx = (state.currentSongIndex - 1 + CONFIG.songs.length) % CONFIG.songs.length;
                    this.play(idx);
                },

                nextSong() {
                    const idx = (state.currentSongIndex + 1) % CONFIG.songs.length;
                    this.play(idx);
                },

                toggleVisibility() {
                    const stateKey = 'musicPlayer';
                    const def = ELEM_DEFS.wallpaper.find(d => d.id === stateKey);
                    if (!def) return;
                    const cur = state.elemState[stateKey] || { visible: def.defaultVisible, opacity: def
                            .defaultOpacity };
                    cur.visible = !cur.visible;
                    state.elemState[stateKey] = cur;
                    ElemManager.apply();
                    Storage.set('elemState', state.elemState);
                    if (cur.visible) {
                        this.player.classList.add('active');
                        this.updateCover();
                        if (!state.audioPlayer || !state.audioPlayer.src) this.play(state.currentSongIndex);
                    } else {
                        this.player.classList.remove('active');

                },

                _loadPos() {
                    const pos = Storage.get('musicPlayerPos');
                    if (pos && pos.left && pos.top) {
                        this.player.style.left = pos.left;
                        this.player.style.top = pos.top;
                    }
                },

                savePos() {
                    Storage.set('musicPlayerPos', {
                        left: this.player.style.left,
                        top: this.player.style.top
                    });
                },

                handleJoystick(dir) {
                    switch (dir) {
                        case 'up':
                            this.prevCover();
                            break;
                        case 'down':
                            this.nextCover();
                            break;
                        case 'left':
                            this.prevSong();
                            break;
                        case 'right':
                            this.nextSong();
                            break;

                }

                                el.classList.remove('hidden');

                                el.classList.remove('active');

                                el.classList.add('hidden');
                            }
                        }
                        el.style.opacity = st.opacity;
