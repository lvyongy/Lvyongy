                const overlay = el.querySelector('.progress-overlay');
                if (overlay) overlay.remove();
                el.classList.add('downloaded');
                // 移除已有媒体
                const existingMedia = el.querySelector('img, video');
                if (existingMedia) existingMedia.remove();
                const placeholder = el.querySelector('.wp-placeholder');
                if (placeholder) placeholder.remove();

                if (type === 'static') {
                    // 静态壁纸：直接用原图作为缩略图（或使用缓存的 blob）
                    const img = document.createElement('img');
                    img.className = 'wp-thumbnail';
                    img.src = blobUrl;
                    img.alt = el.dataset.name || '';
                    img.loading = 'lazy';
                    el.prepend(img);
                } else if (type === 'dynamic') {
                    if (blobUrl.startsWith('data:image/') || blobUrl.startsWith('blob:') && blobUrl.includes('image')) {
                        const img = document.createElement('img');
                        img.src = blobUrl;
                        img.alt = el.dataset.name || '';
                        img.loading = 'lazy';
                        el.prepend(img);
                    } else {
                        const vid = document.createElement('video');
                        vid.src = blobUrl;
                        vid.muted = true;
                        vid.playsInline = true;
                        vid.preload = 'metadata';
                        vid.loop = true;
                        vid.addEventListener('loadedmetadata', function() {
                            this.pause();
                        });
                        el.prepend(vid);
                    }
                }
            }

            function downloadSingleResource(url, id, type, onProgress) {
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', url, true);
                    xhr.responseType = 'blob';
                    xhr.timeout = 120000;
                    xhr.onprogress = function(e) {
                        if (e.lengthComputable && onProgress) {
                            const progress = e.loaded / e.total;
                            onProgress(progress);
                        }
                    };
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            const blob = xhr.response;
                            const blobUrl = URL.createObjectURL(blob);
                            cacheBlob(id, blobUrl);
                            if (onProgress) onProgress(1);
                            resolve(blobUrl);
                        } else {
                            reject(new Error('HTTP ' + xhr.status));
                        }
                    };
                    xhr.onerror = function() {
                        reject(new Error('Network error'));
                    };
                    xhr.ontimeout = function() {
                        reject(new Error('Timeout'));
                    };
                    xhr.send();
                });
            }

            function buildDownloadTasks() {
                const tasks = [];
                for (const wp of wallpapers.static) {
                    tasks.push({
                        id: wp.id,
                        type: 'static',
                        url: 'images/' + wp.file,
                        name: wp.name,
                        category: 'static'
                    });
                }
                const IMAGE_COUNT = 36;
                for (let i = 1; i <= IMAGE_COUNT; i++) {
                    const num = String(i).padStart(2, '0');
                    tasks.push({
                        id: 'cover_' + num,
                        type: 'image',
                        url: 'images/cover_' + num + '.png',
                        name: '封面 ' + num,
                        category: 'cover'
                    });

                const songs = ['song_01.mp3', 'song_02.mp3', 'song_03.mp3'];
                for (const file of songs) {
                    tasks.push({
                        id: file,
                        type: 'audio',
                        url: 'songs/' + file,
                        name: file,
                        category: 'song'
                    });
                }
                for (const wp of wallpapers.dynamic) {
                    tasks.push({
                        id: wp.id,
                        type: 'dynamic',
                        url: 'videos/' + wp.file,
                        name: wp.name,
                        category: 'dynamic'
                    });
                }
                return tasks;
            }

            let bgDownloadStarted = false;

            function startSerialDownload() {
                if (bgDownloadStarted) return;
                bgDownloadStarted = true;
                const tasks = buildDownloadTasks();
                if (tasks.length === 0) return;

                tasks.forEach(t => {
                    downloadProgress[t.id] = 0;
                });

                document.querySelectorAll('.wp-preview-item').forEach(el => {
                    const id = el.dataset.id;
                    if (id && downloadProgress[id] !== undefined) {
                        if (!el.classList.contains('downloaded')) {
                            if (!el.querySelector('.progress-overlay')) {
                                const overlay = document.createElement('div');
                                overlay.className = 'progress-overlay';
                                const progress = document.createElement('progress');
                                progress.value = 0;
                                progress.max = 1;
                                const text = document.createElement('div');
                                text.className = 'progress-text';
                                text.textContent = '0%';
                                overlay.appendChild(progress);
                                overlay.appendChild(text);
                                el.prepend(overlay);
                            }
                            const cached = getBlob(id);
                            if (cached && !isPlaceholder(cached)) {
                                el.classList.add('downloaded');
                                const overlay2 = el.querySelector('.progress-overlay');
                                if (overlay2) overlay2.remove();
                                renderPreviewItem(el, el.dataset.type);
                            }
                        }
                    }
                });

                isDownloading = true;
                let currentIndex = 0;

                function downloadNext() {
                    if (currentIndex >= tasks.length) {
                        isDownloading = false;
                        showToast('所有资源下载完成 ✨');
                        // 如果当前选中的壁纸还没有缓存，重新应用
                        const curBlob = getBlob(currentWallpaperId);
                        if (!curBlob || isPlaceholder(curBlob)) {
                            applyWallpaper(currentWallpaperType, currentWallpaperId);
                        }
                        return;
                    }
                    const task = tasks[currentIndex];
                    const id = task.id;
                    const cached = getBlob(id);
                    if (cached && !isPlaceholder(cached)) {
                        if (downloadProgress[id] !== undefined) {
                            downloadProgress[id] = 1;
                            updatePreviewProgress(id, 1);
                        }
                        currentIndex++;
                        downloadNext();
                        return;
                    }

                    const onProgress = (progress) => {
                        if (downloadProgress[id] !== undefined) {
                            downloadProgress[id] = progress;
                            updatePreviewProgress(id, progress);
                        }
                    };

                    downloadSingleResource(task.url, id, task.type, onProgress)
                        .then(() => {
                            if (downloadProgress[id] !== undefined) {
                                downloadProgress[id] = 1;
                                updatePreviewProgress(id, 1);
                            }
                            // 如果这个壁纸是当前选中的，自动应用
                            if (task.category === 'static' || task.category === 'dynamic') {
                                if (id === currentWallpaperId && task.type === currentWallpaperType) {
                                    applyWallpaper(currentWallpaperType, currentWallpaperId);
                                }
                            }
                            currentIndex++;
                            downloadNext();
                        })
                        .catch((err) => {
                            console.warn('下载失败:', task.url, err.message);
                            const placeholder = task.type === 'static' || task.type === 'image' ? PLACEHOLDER_IMAGE :
                                PLACEHOLDER_VIDEO;
                            cacheBlob(id, placeholder);
                            if (downloadProgress[id] !== undefined) {
                                downloadProgress[id] = 1;
                                updatePreviewProgress(id, 1);
                            }
                            currentIndex++;
                            downloadNext();
                        });
                }

            // ================================================================
            // 4. 拉绳交互（保持不变）
            // ================================================================
            const ropeHandle = document.getElementById('rope-handle');
            const ropeLine = document.getElementById('rope-line');
            let isDraggingRope = false;
            let dragStartY = 0;
            let currentPull = 0;
            const MAX_PULL = 120;
            const THRESHOLD = 70;
            let hasTriggered = false;
            let ropeRafId = null;

            function resetRope(animate) {
                if (ropeRafId) {
                    cancelAnimationFrame(ropeRafId);
                    ropeRafId = null;
                }
                if (animate !== false) {
                    ropeLine.style.transition = 'height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    ropeHandle.style.transition = 'top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                } else {
                    ropeLine.style.transition = 'none';
                    ropeHandle.style.transition = 'none';
                }
                ropeLine.style.height = '60px';
                ropeHandle.style.top = '72px';
                currentPull = 0;
                hasTriggered = false;
                if (animate !== false) {
                    setTimeout(() => {
                        ropeLine.style.transition = 'height 0.15s ease-out';
                        ropeHandle.style.transition = 'none';
                    }, 550);
                } else {
                    ropeLine.style.transition = 'height 0.15s ease-out';
                    ropeHandle.style.transition = 'none';
                }
            }

            function updateRope(pull) {
                const clamped = Math.min(Math.max(pull, 0), MAX_PULL);
                if (ropeRafId) {
                    cancelAnimationFrame(ropeRafId);
                    ropeRafId = null;
                }
                ropeRafId = requestAnimationFrame(() => {
                    ropeLine.style.height = (60 + clamped) + 'px';
                    ropeHandle.style.top = (72 + clamped) + 'px';
                    currentPull = clamped;
                    ropeRafId = null;
                });
            }

            function triggerSwitch() {
                if (hasTriggered) return;
                hasTriggered = true;
                const target = currentMode === 'day' ? 'night' : 'day';
                setDayNight(target);
            }

            const ropeListeners = [];

            function ropePointerDown(e) {
                e.preventDefault();
                isDraggingRope = true;
                dragStartY = e.clientY;
                hasTriggered = false;
                ropeLine.style.transition = 'none';
                ropeHandle.style.transition = 'none';
                ropeHandle.style.cursor = 'grabbing';
                ropeHandle.setPointerCapture(e.pointerId);
            }

            function ropePointerMove(e) {
                if (!isDraggingRope) return;
                const delta = e.clientY - dragStartY;
                const pull = Math.max(0, delta);
                updateRope(pull);
                if (pull >= THRESHOLD && !hasTriggered) triggerSwitch();
            }

            function ropePointerUp(e) {
                if (!isDraggingRope) return;
                isDraggingRope = false;
                ropeHandle.style.cursor = 'grab';
                if (currentPull >= THRESHOLD && !hasTriggered) triggerSwitch();
                resetRope(true);
                if (ropeRafId) {
                    cancelAnimationFrame(ropeRafId);
                    ropeRafId = null;
                }
            }

            function ropePointerCancel(e) {
                if (isDraggingRope) {
                    isDraggingRope = false;
                    ropeHandle.style.cursor = 'grab';
                    resetRope(true);
                    if (ropeRafId) {
                        cancelAnimationFrame(ropeRafId);
                        ropeRafId = null;
                    }
                }
            }

            ropeHandle.addEventListener('pointerdown', ropePointerDown);
            window.addEventListener('pointermove', ropePointerMove);
            window.addEventListener('pointerup', ropePointerUp);
            window.addEventListener('pointercancel', ropePointerCancel);

            ropeListeners.push({ type: 'pointerdown', el: ropeHandle, fn: ropePointerDown });
            ropeListeners.push({ type: 'pointermove', el: window, fn: ropePointerMove });
            ropeListeners.push({ type: 'pointerup', el: window, fn: ropePointerUp });

            function isValidUrl(url) {
                if (!url) return false;
                let trimmed = url.trim();
                if (/^(javascript|data|vbscript):/i.test(trimmed)) return false;
                try {
                    const parsed = new URL(trimmed);
                    return ['http:', 'https:', 'ftp:', 'mailto:', 'tel:'].includes(parsed.protocol);
                } catch (_) {
                    try {
                        const parsed2 = new URL('http://' + trimmed);
                        return ['http:', 'https:', 'ftp:'].includes(parsed2.protocol);
                    } catch {
                        return false;
                    }
                }
            }

            function sanitizeUrl(url) {
                const trimmed = url.trim();
                if (!trimmed) return '';
                if (!trimmed.includes('://') && !trimmed.startsWith('mailto:') && !trimmed.startsWith('tel:')) {
                    return 'http://' + trimmed;
                }
                try {
                    const parsed = new URL(trimmed);
                    if (!['http:', 'https:', 'ftp:', 'mailto:', 'tel:'].includes(parsed.protocol)) {
                        return '';
                    }
                    return trimmed;
                } catch (_) {
                    return '';

                            }
                        }
                        elemState = defs;
                        return;
                    }
                } catch (e) {}
                elemState = getDefaultElemState();
                if (elemState['musicPlayer']) elemState['musicPlayer'].visible = false;
            }

            function saveElemState() {
                try { localStorage.setItem('elemState', JSON.stringify(elemState)); } catch (e) {}
            }

            function applyElemState() {
                const allDefs = [...elemDefs.simple, ...elemDefs.wallpaper];
                allDefs.forEach(def => {
                    const state = elemState[def.id];
                    if (!state) return;
                    const el = def.getEl();
                    if (!el) return;
                    if (state.visible) {
                        if (el.classList.contains('hidden')) el.classList.remove('hidden');
                        if (def.id === 'musicPlayer') {
                            if (!el.classList.contains('active')) el.classList.add('active');
                        }
                    } else {
                        if (def.id === 'musicPlayer') {
                            el.classList.remove('active');
                        } else {
                            el.classList.add('hidden');
                        }
                    }
                    el.style.opacity = state.opacity;
                });
            }

            let isWallpaperMode = false;

            function toggleMode() {
                isWallpaperMode = !isWallpaperMode;
                if (isWallpaperMode) {
                    body.classList.add('wallpaper-mode');

            function updateModeSwitchUI() {

            // ---- 更新壁纸预览网格（修复缩略图：使用原图，不再依赖 _thumb.png） ----
            function updateWallpaperPreview(type, id) {
                const previewGrid = document.getElementById('wallpaperPreviewGrid');
                if (!previewGrid) return;
                const items = wallpapers[type] || [];
                previewGrid.innerHTML = '';

                items.forEach(wp => {
                    const el = document.createElement('div');
                    el.className = 'wp-preview-item';
                    if (type === currentWallpaperType && id === wp.id) el.classList.add('active');
                    el.dataset.id = wp.id;
                    el.dataset.type = type;
                    el.dataset.file = wp.file;
                    el.dataset.name = wp.name;

                    // 缩略图：对于静态壁纸，直接用原图（不再依赖 _thumb.png）
                    if (type === 'static') {
                        const thumbSrc = 'images/' + wp.file;
                        const img = document.createElement('img');
                        img.className = 'wp-thumbnail';
                        img.src = thumbSrc;
                        img.alt = wp.name || '';
                        img.loading = 'lazy';
                        el.prepend(img);
                    } else {
                        // 动态壁纸：检查缓存，有则显示视频，否则显示占位
                        const cached = getBlob(wp.id);
                        if (cached && !isPlaceholder(cached)) {
                            if (cached.startsWith('data:image/') || cached.startsWith('blob:') && cached.includes(
                                'image')) {
                                const img = document.createElement('img');
                                img.src = cached;
                                img.alt = wp.name || '';
                                img.loading = 'lazy';
                                el.prepend(img);
                            } else {
                                const vid = document.createElement('video');
                                vid.src = cached;
                                vid.muted = true;
                                vid.playsInline = true;
                                vid.preload = 'metadata';
                                vid.loop = true;
                                vid.addEventListener('loadedmetadata', function() {
                                    this.pause();
                                });
                                el.prepend(vid);
                            }
                            el.classList.add('downloaded');
                        } else {
                            const placeholder = document.createElement('div');
                            placeholder.className = 'wp-placeholder';
                            placeholder.textContent = '加载中';
                            el.prepend(placeholder);
                        }
                    }

                    const label = document.createElement('div');
                    label.className = 'wp-label';
                    label.textContent = wp.name;
                    el.appendChild(label);

                    const check = document.createElement('div');
                    check.className = 'check-mark';
                    check.textContent = '✓';
                    el.appendChild(check);

                    const cached2 = getBlob(wp.id);
                    if (!cached2 || isPlaceholder(cached2)) {
                        const overlay = document.createElement('div');
                        overlay.className = 'progress-overlay';
                        const progress = document.createElement('progress');
                        progress.value = 0;
                        progress.max = 1;
                        const text = document.createElement('div');
                        text.className = 'progress-text';
                        text.textContent = '0%';
                        overlay.appendChild(progress);
                        overlay.appendChild(text);
                        el.prepend(overlay);
                        if (downloadProgress[wp.id] !== undefined && downloadProgress[wp.id] > 0) {
                            progress.value = downloadProgress[wp.id];
                            text.textContent = Math.round(downloadProgress[wp.id] * 100) + '%';
                        }
                    } else {
                        el.classList.add('downloaded');
                    }

                    // 点击切换壁纸
                    el.addEventListener('click', function(e) {
                        const isReady = getBlob(wp.id) && !isPlaceholder(getBlob(wp.id));
                        if (!isReady) {
                            showToast('壁纸下载中，请稍候...');
                            if (!bgDownloadStarted) startSerialDownload();
                            return;
                        }
                        applyWallpaper(type, wp.id);
                        document.querySelectorAll('.type-btn').forEach(b => {
                            b.classList.toggle('active', b.dataset.type === type);
                        });
                        document.querySelectorAll('.wp-preview-item').forEach(item => {
                            item.classList.toggle('active', item.dataset.id === wp.id &&
                                item.dataset.type === type);
                        });
                    });

                    previewGrid.appendChild(el);
                });
            }

            // ---- 设置面板事件委托 ----
            function initSettingsDelegation() {
                const content = document.getElementById('settingsDynamicContent');
                if (!content) return;

                content.addEventListener('click', function(e) {
                    const header = e.target.closest('.settings-module-header');
                    if (header && header.dataset.moduleToggle) {
                        const moduleName = header.dataset.moduleToggle;
                        if (moduleStates[moduleName] !== undefined) {
                            moduleStates[moduleName] = !moduleStates[moduleName];
                            const body = header.closest('.settings-module').querySelector('.settings-module-body');
                            const arrow = header.querySelector('.arrow');
                            if (body) body.classList.toggle('collapsed', !moduleStates[moduleName]);
                            if (arrow) arrow.classList.toggle('collapsed', !moduleStates[moduleName]);
                            saveModuleStates();
                        }
                    }
                });

                content.addEventListener('click', function(e) {
                    const bigSwitch = e.target.closest('#modeSwitchBig');
                    if (bigSwitch) {
                        e.stopPropagation();
                        toggleMode();
                    }
                });

                content.addEventListener('click', function(e) {
                    const btn = e.target.closest('.type-btn');
                    if (btn) {
                        e.stopPropagation();
                        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        const type = btn.dataset.type;
                        currentWallpaperType = type;
                        const items = wallpapers[type] || [];
                        if (items.length > 0) {
                            const exists = items.some(w => w.id === currentWallpaperId);
                            if (!exists) {
                                currentWallpaperId = items[0].id;
                            }
                        }
                        updateWallpaperPreview(type, currentWallpaperId);
                        saveAllSettings();
                    }
                });

                content.addEventListener('click', function(e) {
                    const toggle = e.target.closest('.elem-toggle');
                    if (toggle) {
                        e.stopPropagation();
                        const row = toggle.closest('.elem-control');
                        if (!row) return;
                        const id = row.dataset.elemId;
                        if (!id || !elemState[id]) return;
                        const newVis = !elemState[id].visible;
                        elemState[id].visible = newVis;
                        toggle.classList.toggle('active', newVis);
                        applyElemState();
                        saveElemState();
                    }
                });

                content.addEventListener('input', function(e) {
                    const range = e.target.closest('.elem-opacity input[type="range"]');
                    if (range) {
                        const row = range.closest('.elem-control');
                        if (!row) return;
                        const id = row.dataset.elemId;
                        if (!id || !elemState[id]) return;
                        const val = parseFloat(range.value);
                        elemState[id].opacity = val;
                        applyElemState();
                        saveElemState();
                        const valDisplay = row.querySelector('.elem-opacity-value');
                        if (valDisplay) valDisplay.textContent = Math.round(val * 100) + '%';
                    }
                });

                content.addEventListener('click', function(e) {
                    const editBtn = e.target.closest('.edit-btn');
                    if (editBtn) {
                        e.stopPropagation();
                        const idx = parseInt(editBtn.dataset.index);
                        const q = quotes[idx];
                        if (!q) return;
                        const newText = prompt('编辑语录内容：', q.text);
                        if (newText !== null) {
                            const trimmed = newText.trim();
                            if (trimmed.length > 300) {
                                showToast('语录内容不能超过300字符');
                                return;
                            }
                            const newAuthor = prompt('编辑作者：', q.author);
                            if (newAuthor !== null) {
                                const authorTrim = newAuthor.trim().slice(0, 50);
                                quotes[idx] = { text: trimmed, author: authorTrim || '佚名' };
                                saveQuotes();
                                renderSettings();
                                if (quoteIndex === idx) showQuote(quoteIndex);
                                restartInterval();
                            }
                        }
                        return;
                    }
                    const delBtn = e.target.closest('.del-btn');
                    if (delBtn) {
                        e.stopPropagation();
                        const idx = parseInt(delBtn.dataset.index);
                        if (confirm('确定删除此语录？')) {
                            quotes.splice(idx, 1);
                            saveQuotes();
                            if (quotes.length === 0) {
                                quotes = DEFAULT_QUOTES.map(q => ({ ...q }));
                                saveQuotes();
                            }
                            if (quoteIndex >= quotes.length) quoteIndex = 0;
                            showQuote(quoteIndex);
                            renderSettings();
                            restartInterval();
                        }
                        return;
                    }
                    const addBtn = e.target.closest('#addQuoteBtn');
                    if (addBtn) {
                        e.stopPropagation();
                        const textInput = document.getElementById('newQuoteText');
                        const authorInput = document.getElementById('newQuoteAuthor');
                        if (!textInput || !authorInput) return;
                        const text = textInput.value.trim();
                        const author = authorInput.value.trim();
                        if (!text) { showToast('请输入语录内容'); return; }
                        if (text.length > 300) { showToast('内容不能超过300字符'); return; }
                        quotes.push({ text, author: author || '佚名' });
                        saveQuotes();
                        textInput.value = '';
                        authorInput.value = '';
                        renderSettings();
                        restartInterval();
                        showToast('语录已添加');
                    }
                });

                content.addEventListener('change', function(e) {
                    const intervalInput = e.target.closest('#intervalInput');
                    if (intervalInput) {
                        let val = parseInt(intervalInput.value);
                        if (isNaN(val) || val < 1) val = 1;
                        if (val > 300) val = 300;
                        intervalInput.value = val;
                        quoteInterval = val * 1000;
                        saveInterval();
                        restartInterval();
                        showToast('间隔已更新');
                    }
                });
            }
